  <title>DairyOS — 7 Modules</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ––––– GLOBAL ––––– */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    :root {
      --bg-primary:#0b0e14; --bg-secondary:#131821; --bg-card:#1a212c; --bg-card-hover:#242e3d;
      --bg-input:#1f2836; --border-color:#2a3548; --text-primary:#f0f4fc; --text-secondary:#9aaec9;
      --text-muted:#6a7f9e; --accent-blue:#4a8cf7; --accent-cyan:#22d3ee; --accent-green:#34d399;
      --accent-orange:#fb923c; --accent-red:#f87171; --accent-purple:#a78bfa;
      --shadow:0 8px 24px rgba(0,0,0,0.5); --radius:14px; --radius-sm:8px;
      --transition:0.2s ease; --bottom-nav-height:64px; --header-height:56px;
    }
    html, body { height:100%; overflow:hidden; }
    body { background:var(--bg-primary); color:var(--text-primary); display:flex; flex-direction:column; padding:0; margin:0; height:100vh; max-height:100vh; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:10px; }

    .app-header {
      background:var(--bg-secondary); border-bottom:1px solid var(--border-color);
      padding:8px 16px; display:flex; align-items:center; justify-content:space-between;
      flex-shrink:0; height:var(--header-height); min-height:var(--header-height); gap:8px; z-index:100;
    }
    .app-logo { font-weight:700; font-size:1.2rem; display:flex; align-items:center; gap:8px; flex-shrink:0; }
    .app-logo i { color:var(--accent-cyan); font-size:1.4rem; }
    .app-logo span { background:linear-gradient(135deg,var(--accent-cyan),var(--accent-blue)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .header-actions { display:flex; align-items:center; gap:6px; }
    .header-actions button { background:transparent; border:none; color:var(--text-secondary); font-size:1.1rem; cursor:pointer; padding:4px 8px; border-radius:8px; transition:var(--transition); }
    .header-actions button:hover { background:var(--bg-card); color:var(--text-primary); }
    .header-actions .customise-btn { color:var(--accent-cyan); }
    .header-actions .customise-btn:hover { background:rgba(34,211,238,0.1); }
    .nav-modules { display:flex; flex-wrap:nowrap; gap:4px; overflow-x:auto; flex:1; justify-content:flex-end; }
    .nav-modules button { background:transparent; border:none; color:var(--text-secondary); padding:6px 14px; border-radius:30px; font-size:0.75rem; font-weight:500; cursor:pointer; transition:var(--transition); display:flex; align-items:center; gap:4px; white-space:nowrap; flex-shrink:0; }
    .nav-modules button i { font-size:0.85rem; }
    .nav-modules button:hover { background:var(--bg-card); color:var(--text-primary); }
    .nav-modules button.active { background:var(--accent-blue); color:#fff; box-shadow:0 4px 16px rgba(74,140,247,0.3); }
    @media (max-width:640px) { .nav-modules { display:none; } .app-header { justify-content:space-between; } }

    .app-main { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 16px 16px 16px; max-width:1200px; margin:0 auto; width:100%; -webkit-overflow-scrolling:touch; }
    .module-panel { display:none; animation:fadeUp 0.25s ease; }
    .module-panel.active { display:block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .section-title { font-size:1rem; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; color:var(--text-primary); }
    .section-title i { color:var(--accent-cyan); font-size:1.1rem; }
    .section-title small { font-weight:400; font-size:0.75rem; color:var(--text-muted); margin-left:4px; }
    .section-title .customise-badge { font-size:0.6rem; background:var(--accent-cyan); color:#0b0e14; padding:2px 10px; border-radius:30px; font-weight:600; margin-left:6px; cursor:pointer; }

    .alert-banner { background:#2a1a1a; border:1px solid #4a2a2a; border-radius:var(--radius); padding:10px 16px; display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .alert-banner i { color:var(--accent-red); font-size:0.9rem; }
    .alert-banner .msg { flex:1; font-size:0.85rem; }
    .alert-banner .count { background:var(--accent-red); color:#0b0e14; font-weight:700; padding:2px 12px; border-radius:30px; font-size:0.75rem; }

    .card-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; width:100%; max-width:100%; }
    .card-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; width:100%; max-width:100%; }

    .card-slim {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius);
      padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
      transition:var(--transition); cursor:pointer; min-height:68px; gap:8px;
      width:100%; max-width:100%; overflow:hidden; box-sizing:border-box;
      position:relative;
    }
    .card-slim:hover { background:var(--bg-card-hover); border-color:#3a4a62; transform:translateY(-2px); box-shadow:var(--shadow); }
    .card-slim:active { transform:scale(0.97); }
    .card-slim .label { font-size:0.75rem; font-weight:500; text-transform:uppercase; letter-spacing:0.3px; color:var(--text-secondary); display:flex; align-items:center; gap:8px; flex:1; min-width:0; line-height:1.3; word-break:break-word; hyphens:auto; max-width:70%; }
    .card-slim .label i { font-size:0.9rem; color:var(--accent-cyan); width:20px; text-align:center; flex-shrink:0; }
    .card-slim .label span { display:inline; word-break:break-word; hyphens:auto; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .card-slim .value { font-size:1.2rem; font-weight:700; color:var(--text-primary); letter-spacing:-0.2px; white-space:nowrap; flex-shrink:0; text-align:right; margin-left:4px; max-width:30%; }
    .card-slim .value .sub { font-size:0.65rem; font-weight:400; color:var(--text-muted); margin-left:4px; }
    .card-slim .drag-handle { position:absolute; top:4px; right:4px; font-size:0.7rem; color:var(--text-muted); opacity:0.3; cursor:grab; padding:4px; }
    .card-slim:hover .drag-handle { opacity:0.8; }
    .card-slim.dragging { opacity:0.5; transform:scale(0.95); }
    .card-slim.drag-over { border-color:var(--accent-cyan); border-style:dashed; background:var(--bg-card-hover); }
    .card-slim.hidden-card { display:none; }

    .touch-card {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius);
      padding:14px 18px; display:flex; align-items:center; gap:12px;
      transition:var(--transition); cursor:pointer; min-height:60px;
      width:100%; max-width:100%; overflow:hidden; box-sizing:border-box;
    }
    .touch-card:hover { background:var(--bg-card-hover); border-color:var(--accent-blue); transform:translateX(4px); box-shadow:var(--shadow); }
    .touch-card:active { transform:scale(0.97); }
    .touch-card i { font-size:1.2rem; color:var(--accent-blue); width:28px; text-align:center; flex-shrink:0; }
    .touch-card .info { flex:1; min-width:0; overflow:hidden; }
    .touch-card .info .title { font-weight:600; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .touch-card .info .desc { font-size:0.7rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .touch-card .amount { font-weight:700; font-size:1rem; color:var(--accent-green); white-space:nowrap; flex-shrink:0; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius); padding:18px 24px; margin-bottom:16px; }
    .form-grid .full { grid-column:1 / -1; }
    .form-grid label { font-size:0.8rem; font-weight:500; color:var(--text-secondary); display:flex; flex-direction:column; gap:4px; }
    .form-grid input, .form-grid select { background:var(--bg-input); border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:8px 12px; color:var(--text-primary); font-size:0.9rem; transition:var(--transition); width:100%; }
    .form-grid input:focus, .form-grid select:focus { outline:none; border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(74,140,247,0.15); }

    .btn { background:var(--accent-blue); border:none; color:#fff; padding:8px 20px; border-radius:30px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:var(--transition); display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; }
    .btn:hover { background:#3a7be0; transform:scale(1.02); box-shadow:0 4px 16px rgba(74,140,247,0.3); }
    .btn-outline { background:transparent; border-color:var(--border-color); color:var(--text-secondary); }
    .btn-outline:hover { background:var(--bg-card); color:var(--text-primary); border-color:var(--accent-blue); }
    .btn-sm { padding:4px 14px; font-size:0.7rem; }
    .btn-danger { background:var(--accent-red); color:#0b0e14; }
    .btn-danger:hover { background:#e05555; }
    .btn-green { background:var(--accent-green); color:#0b0e14; }
    .btn-green:hover { background:#2bc48a; }
    .btn-orange { background:var(--accent-orange); color:#0b0e14; }
    .btn-orange:hover { background:#e07c2e; }

    .table-wrap { overflow-x:auto; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius); padding:4px 0; margin-bottom:16px; -webkit-overflow-scrolling:touch; }
    .table-wrap table { width:100%; border-collapse:collapse; font-size:0.8rem; min-width:400px; }
    .table-wrap th { text-align:left; padding:10px 14px; color:var(--text-secondary); font-weight:500; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.3px; border-bottom:1px solid var(--border-color); background:var(--bg-secondary); }
    .table-wrap td { padding:8px 14px; border-bottom:1px solid var(--border-color); color:var(--text-primary); vertical-align:middle; }
    .table-wrap tr:hover td { background:var(--bg-input); }
    .table-wrap .delete-btn { background:transparent; border:none; color:var(--accent-red); cursor:pointer; font-size:1rem; transition:var(--transition); padding:2px 6px; }
    .table-wrap .delete-btn:hover { transform:scale(1.2); color:#ff4444; }
    .status-badge { font-size:0.6rem; padding:2px 10px; border-radius:30px; font-weight:500; }
    .status-badge.green { background:#1a3a2a; color:var(--accent-green); }
    .status-badge.orange { background:#3a2a1a; color:var(--accent-orange); }
    .status-badge.red { background:#3a1a1a; color:var(--accent-red); }
    .status-badge.blue { background:#1a2a3a; color:var(--accent-blue); }
    .status-badge.purple { background:#2a1a3a; color:var(--accent-purple); }
    .status-badge.gray { background:#1a1a1a; color:var(--text-muted); }
    .mini-scroll { max-height:200px; overflow-y:auto; }

    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; height:var(--bottom-nav-height);
      background:var(--bg-secondary); border-top:1px solid var(--border-color);
      display:flex; justify-content:space-around; align-items:center; padding:6px 8px; z-index:200; backdrop-filter:blur(8px); flex-shrink:0;
    }
    .bottom-nav button { background:transparent; border:none; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:0.6rem; font-weight:500; cursor:pointer; transition:var(--transition); padding:4px 8px; border-radius:8px; flex:1; max-width:64px; }
    .bottom-nav button i { font-size:1.3rem; transition:var(--transition); }
    .bottom-nav button span { line-height:1.2; }
    .bottom-nav button.active { color:var(--accent-cyan); }
    .bottom-nav button.active i { color:var(--accent-cyan); text-shadow:0 0 12px rgba(34,211,238,0.3); }
    .bottom-nav button:hover { color:var(--text-primary); }
    @media (max-width:480px) { .bottom-nav button { max-width:48px; font-size:0.5rem; } .bottom-nav button i { font-size:1.1rem; } .bottom-nav button span { display:none; } }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px; animation:fadeUp 0.2s ease; }
    .modal-overlay .modal-box { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:var(--radius); padding:24px 28px; max-width:520px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow); }
    .modal-overlay .modal-box h3 { margin-bottom:14px; display:flex; align-items:center; gap:10px; font-size:1.1rem; }
    .modal-overlay .modal-box h3 i { color:var(--accent-cyan); }
    .modal-overlay .modal-box .detail-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); font-size:0.85rem; }
    .modal-overlay .modal-box .detail-item .label { color:var(--text-secondary); }
    .modal-overlay .modal-box .detail-item .val { font-weight:600; }
    .modal-actions { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }

    /* ––– Dashboard Customiser ––– */
    .customiser-item {
      display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-color);
    }
    .customiser-item .drag-handle { color:var(--text-muted); cursor:grab; font-size:1rem; }
    .customiser-item .info { flex:1; }
    .customiser-item .info .name { font-weight:500; font-size:0.9rem; }
    .customiser-item .info .desc { font-size:0.7rem; color:var(--text-muted); }
    .customiser-item .toggle { position:relative; width:44px; height:24px; flex-shrink:0; cursor:pointer; background:var(--bg-input); border-radius:30px; border:1px solid var(--border-color); transition:var(--transition); }
    .customiser-item .toggle.active { background:var(--accent-cyan); border-color:var(--accent-cyan); }
    .customiser-item .toggle .knob { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:var(--transition); }
    .customiser-item .toggle.active .knob { left:22px; }
    .customiser-item.dragging { opacity:0.5; }

    .text-muted { color:var(--text-muted); }
    .text-green { color:var(--accent-green); }
    .text-orange { color:var(--accent-orange); }
    .text-red { color:var(--accent-red); }
    .text-blue { color:var(--accent-blue); }
    .mt-8 { margin-top:8px; }
    .mb-8 { margin-bottom:8px; }
    .flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

    @media (max-width:640px) {
      .app-main { padding:10px 12px 12px 12px; }
      .card-grid-2 { gap:10px; }
      .card-grid-3 { grid-template-columns:1fr 1fr; gap:10px; }
      .card-slim { padding:14px 16px; min-height:58px; }
      .card-slim .value { font-size:1rem; }
      .card-slim .label { font-size:0.7rem; }
      .touch-card { padding:12px 14px; min-height:52px; }
      .touch-card .info .title { font-size:0.8rem; }
      .touch-card .amount { font-size:0.9rem; }
      .form-grid { grid-template-columns:1fr; padding:14px 16px; }
      .form-grid .full { grid-column:1; }
      .form-grid input, .form-grid select { font-size:0.8rem; padding:6px 10px; }
      .section-title { font-size:0.9rem; }
    }
    @media (max-width:480px) {
      .card-grid-2 { gap:8px; }
      .card-grid-3 { grid-template-columns:1fr 1fr; gap:8px; }
      .card-slim { padding:10px 14px; min-height:50px; }
      .card-slim .value { font-size:0.9rem; }
      .card-slim .label { font-size:0.65rem; }
      .touch-card { padding:10px 12px; min-height:44px; }
      .touch-card .info .title { font-size:0.7rem; }
      .touch-card .amount { font-size:0.8rem; }
      .form-grid { padding:10px 12px; gap:8px; }
      .form-grid label { font-size:0.7rem; }
      .form-grid input, .form-grid select { font-size:0.75rem; padding:5px 8px; }
      .btn { font-size:0.7rem; padding:6px 14px; }
      .table-wrap table { font-size:0.7rem; min-width:300px; }
      .table-wrap th, .table-wrap td { padding:6px 10px; }
    }

    #appLoader {
      display:flex;
      justify-content:center;
      align-items:center;
      height:200px;
      color:var(--text-muted);
      font-size:1.2rem;
      transition:opacity 0.3s ease;
    }
    #appLoader i { margin-right:12px; }
    #appLoader.hidden { opacity:0; pointer-events:none; height:0; overflow:hidden; margin:0; padding:0; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-logo"><i class="fas fa-cow"></i><span>DairyOS</span></div>
    <nav class="nav-modules" id="topNav">
      <button class="active" data-module="dashboard"><i class="fas fa-chart-pie"></i> Dash</button>
      <button data-module="herd"><i class="fas fa-paw"></i> Herd</button>
      <button data-module="stock"><i class="fas fa-warehouse"></i> Stock</button>
      <button data-module="milk"><i class="fas fa-tint"></i> Milk</button>
      <button data-module="labour"><i class="fas fa-users"></i> Labour</button>
      <button data-module="accounts"><i class="fas fa-file-invoice-dollar"></i> P&L</button>
      <button data-module="reports"><i class="fas fa-chart-line"></i> Reports</button>
    </nav>
    <div class="header-actions">
      <button class="customise-btn" onclick="openCustomiser()" title="Customise Dashboard"><i class="fas fa-sliders-h"></i></button>
      <button onclick="exportData()" title="Export"><i class="fas fa-download"></i></button>
      <button onclick="document.getElementById('importInput').click()" title="Import"><i class="fas fa-upload"></i></button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)" />
      <button onclick="openRateModal()" title="Edit Rates"><i class="fas fa-cog"></i></button>
      <button onclick="installApp()" title="Install App" id="installBtn" style="display:none;"><i class="fas fa-download"></i></button>
    </div>
  </header>

  <main class="app-main" id="appMain">
    <div id="appLoader"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    <section id="panel-dashboard" class="module-panel"></section>
    <section id="panel-herd" class="module-panel"></section>
    <section id="panel-stock" class="module-panel"></section>
    <section id="panel-milk" class="module-panel"></section>
    <section id="panel-labour" class="module-panel"></section>
    <section id="panel-accounts" class="module-panel"></section>
    <section id="panel-reports" class="module-panel"></section>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="active" data-module="dashboard"><i class="fas fa-chart-pie"></i><span>Home</span></button>
    <button data-module="herd"><i class="fas fa-paw"></i><span>Herd</span></button>
    <button data-module="stock"><i class="fas fa-warehouse"></i><span>Stock</span></button>
    <button data-module="milk"><i class="fas fa-tint"></i><span>Milk</span></button>
    <button data-module="labour"><i class="fas fa-users"></i><span>Labour</span></button>
    <button data-module="accounts"><i class="fas fa-file-invoice-dollar"></i><span>P&L</span></button>
    <button data-module="reports"><i class="fas fa-chart-line"></i><span>Reports</span></button>
  </nav>

  <div id="modalContainer"></div>

  <script>
    // ================================================================
    // 1. STORAGE (IndexedDB + localStorage fallback)
    // ================================================================
    const DB = {
      _cache: {},
      _usingIndexedDB: false,
      _db: null,
      _dbName: 'DairyOSDB',
      _storeName: 'appData',
      _initialized: false,

      init() {
        return new Promise((resolve) => {
          try {
            const request = indexedDB.open(this._dbName, 2);
            request.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(this._storeName)) {
                db.createObjectStore(this._storeName);
              }
            };
            request.onsuccess = (e) => {
              this._db = e.target.result;
              this._usingIndexedDB = true;
              this._loadAll().then(() => { this._initialized = true; resolve(); }).catch(() => { this
                  ._initialized = true; resolve(); });
            };
            request.onerror = () => {
              console.warn('IndexedDB not available, using localStorage fallback.');
              this._usingIndexedDB = false;
              this._loadFromLocalStorage();
              this._initialized = true;
              resolve();
            };
          } catch (e) {
            console.warn('IndexedDB error, using localStorage fallback.', e);
            this._usingIndexedDB = false;
            this._loadFromLocalStorage();
            this._initialized = true;
            resolve();
          }
        });
      },

      _loadAll() {
        return new Promise((resolve, reject) => {
          if (!this._db) return reject('DB not initialized');
          const transaction = this._db.transaction([this._storeName], 'readonly');
          const store = transaction.objectStore(this._storeName);
          const request = store.getAll();
          request.onsuccess = () => {
            const results = request.result || [];
            results.forEach(item => {
              if (item.key && item.value !== undefined) {
                this._cache[item.key] = item.value;
              }
            });
            resolve();
          };
          request.onerror = (e) => reject(e.target.error);
        });
      },

      _loadFromLocalStorage() {
        const keys = ['animals', 'taji', 'kori', 'bakdi', 'slaughter', 'dead',
          'feedPurchases', 'feedConsumption', 'godown', 'danawalaPayments',
          'customers', 'milkProduction', 'milkOverrides', 'customerPayments',
          'labour', 'labourPayments', 'vendorPayments', 'medicineBills', 'bhaiswalBills',
          'config', 'dashboardPrefs'
        ];
        keys.forEach(key => {
          try {
            const val = localStorage.getItem('dairy_' + key);
            if (val) { this._cache[key] = JSON.parse(val); }
          } catch (e) {}
        });
      },

      _saveToDB(key, value) {
        if (this._usingIndexedDB) {
          return new Promise((resolve, reject) => {
            if (!this._db) return reject('DB not initialized');
            const transaction = this._db.transaction([this._storeName], 'readwrite');
            const store = transaction.objectStore(this._storeName);
            const request = store.put({ key, value });
            request.onsuccess = () => resolve();
            request.onerror = (e) => reject(e.target.error);
          });
        } else {
          try {
            localStorage.setItem('dairy_' + key, JSON.stringify(value));
            return Promise.resolve();
          } catch (e) { return Promise.reject(e); }
        }
      },

      get(key, def) { return this._cache[key] !== undefined ? this._cache[key] : def; },
      async set(key, value) { this._cache[key] = value; await this._saveToDB(key, value); },
      getAll() { return this._cache; },
      async importAll(data) {
        const keys = Object.keys(data);
        for (const key of keys) {
          if (data[key] !== undefined) {
            this._cache[key] = data[key];
            await this._saveToDB(key, data[key]);
          }
        }
      }
    };

    // ================================================================
    // 7. DRAG & DROP FOR DASHBOARD CARDS
    // ================================================================
    function setupDragAndDrop() {
      const grid = document.getElementById('kpiGrid');
      if (!grid) return;

      let draggedId = null;

      grid.addEventListener('dragstart', (e) => {
        const card = e.target.closest('.card-slim');
        if (!card) return;
        draggedId = card.dataset.kpiId;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedId);
      });

      grid.addEventListener('dragend', (e) => {
        const card = e.target.closest('.card-slim');
        if (card) card.classList.remove('dragging');
        document.querySelectorAll('.card-slim.drag-over').forEach(el => el.classList.remove('drag-over'));
      });

      grid.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const target = e.target.closest('.card-slim');
        if (target && target.dataset.kpiId !== draggedId) {
          document.querySelectorAll('.card-slim.drag-over').forEach(el => el.classList.remove('drag-over'));
          target.classList.add('drag-over');
        }
      });

      grid.addEventListener('dragleave', (e) => {
        const target = e.target.closest('.card-slim');
        if (target) target.classList.remove('drag-over');
      });

      grid.addEventListener('drop', async (e) => {
        e.preventDefault();
        const target = e.target.closest('.card-slim');
        if (!target || !draggedId) return;
        target.classList.remove('drag-over');

        const prefs = await getDashboardPrefs();
        const order = prefs.order || DEFAULT_KPI_ORDER;
        const fromIdx = order.indexOf(draggedId);
        const toIdx = order.indexOf(target.dataset.kpiId);
        if (fromIdx === -1 || toIdx === -1) return;

        // Reorder
        order.splice(fromIdx, 1);
        order.splice(toIdx, 0, draggedId);
        await saveDashboardPrefs(order, prefs.hidden || []);
        await refreshDashboard();
      });
    }

        if (!meta) return '';
        const isHidden = hidden.includes(id);
        return `
          <div class="customiser-item" data-id="${id}">
            <span class="drag-handle"><i class="fas fa-grip-lines"></i></span>
            <div class="info">
              <div class="name">${meta.label}</div>
              <div class="desc">${id}</div>
            </div>
            <div class="toggle ${isHidden ? '' : 'active'}" onclick="toggleKpiVisibility('${id}')">
              <div class="knob"></div>
            </div>
          </div>
        `;
      }).join('');

      const html = `
        <div style="margin-bottom:12px;color:var(--text-muted);font-size:0.85rem;">
          Drag to reorder · Toggle to show/hide cards
        </div>
        <div id="customiserList">
          ${itemsHtml}
        </div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="resetDashboard()">Reset to Default</button>
          <button class="btn" onclick="closeModal();refreshDashboard();">Done</button>
        </div>
      `;
      showModal('🎛️ Customise Dashboard', html);

      // Setup drag for customiser
      const list = document.getElementById('customiserList');
      if (list) {
        let draggedId = null;
        list.addEventListener('dragstart', (e) => {
          const item = e.target.closest('.customiser-item');
          if (!item) return;
          draggedId = item.dataset.id;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', draggedId);
        });
        list.addEventListener('dragend', (e) => {
          const item = e.target.closest('.customiser-item');
          if (item) item.classList.remove('dragging');
        });
        list.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const target = e.target.closest('.customiser-item');
          if (target && target.dataset.id !== draggedId) {
            const rect = target.getBoundingClientRect();
            const mid = rect.top + rect.height / 2;
            const insertBefore = e.clientY < mid;
            // Visual feedback
            target.style.borderTop = insertBefore ? '2px solid var(--accent-cyan)' : '2px solid transparent';
            target.style.borderBottom = !insertBefore ? '2px solid var(--accent-cyan)' : '2px solid transparent';
          }
        });
        list.addEventListener('dragleave', (e) => {
          const target = e.target.closest('.customiser-item');
          if (target) { target.style.borderTop = '2px solid transparent';
            target.style.borderBottom = '2px solid transparent'; }
        });
        list.addEventListener('drop', async (e) => {
          e.preventDefault();
          const target = e.target.closest('.customiser-item');
          if (!target || !draggedId) return;
          target.style.borderTop = '2px solid transparent';
          target.style.borderBottom = '2px solid transparent';

          const prefs2 = await getDashboardPrefs();
          const order2 = prefs2.order || DEFAULT_KPI_ORDER;
          const fromIdx = order2.indexOf(draggedId);
          const toIdx = order2.indexOf(target.dataset.id);
          if (fromIdx === -1 || toIdx === -1) return;
          order2.splice(fromIdx, 1);
          order2.splice(toIdx, 0, draggedId);
          await saveDashboardPrefs(order2, prefs2.hidden || []);
          // Re-render customiser
          openCustomiser();
        });
      }
    };

    async function refreshProjections() {
      const months = [];
      const now = new Date();
      for (let i = 0; i < 12; i++) { const d = new Date(now);
        d.setMonth(now.getMonth() + i);
        months.push(d.toLocaleString('en', { month: 'short', year: '2-digit' })); }
      const headers = document.getElementById('projectionHeaders');
      const row = document.getElementById('projectionRow');
      if (headers && row) {
        headers.innerHTML = months.map(m => '<th>' + m + '</th>').join('');
        const animals = await DB.get('animals', []);
        const counts = new Array(12).fill(0);
        animals.forEach(a => {
          if (a.faliDate) {
            const fali = new Date(a.faliDate);
            const birth = new Date(fali);
            birth.setDate(birth.getDate() + 300);
            const diff = (birth.getFullYear() - now.getFullYear()) * 12 + (birth.getMonth() - now.getMonth());
            if (diff >= 0 && diff < 12) counts[diff]++;
          }
        });
        row.innerHTML = counts.map(c => '<td>' + c + '</td>').join('');
      }
    }

      const milkRevenue = customers.reduce((s, c) => s + (c.fixedDailyVolume || 0) * 30 * (c.sellingRate || 0), 0);

    window.exportData = async function() {
      const data = {};
      const keys = ['animals', 'taji', 'kori', 'bakdi', 'slaughter', 'dead',
        'feedPurchases', 'feedConsumption', 'godown', 'danawalaPayments',
        'customers', 'milkProduction', 'milkOverrides', 'customerPayments',
        'labour', 'labourPayments', 'vendorPayments', 'medicineBills', 'bhaiswalBills',
        'config', 'dashboardPrefs'
      ];
      for (const k of keys) {
        data[k] = await DB.get(k, null);
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dairy_data_export.json';
      a.click();
      URL.revokeObjectURL(url);
      showModal('✅ Export', 'Data exported successfully!');
    };

    window.importData = async function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = JSON.parse(e.target.result);
          await DB.importAll(data);
          await refreshAll();
          showModal('✅ Import', 'Data imported successfully!');
        } catch (err) {
          showModal('❌ Error', 'Invalid JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    };

    window.installApp = async function() {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        const result = await window.deferredPrompt.userChoice;
        if (result.outcome === 'accepted') {
          console.log('App installed successfully');
        }
        window.deferredPrompt = null;
        document.getElementById('installBtn').style.display = 'none';
      } else {
        showModal('📱 Install', 'To install this app, use your browser\'s "Add to Home Screen" option.');
      }
    };

    // Listen for beforeinstallprompt event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('installBtn').style.display = 'none';
      console.log('App was installed');
    });

    // ================================================================
    // 21. SERVICE WORKER (Offline First)
    // ================================================================
    if ('serviceWorker' in navigator) {
      // Register a simple service worker that caches all assets
      const swCode = `
        const CACHE_NAME = 'dairyos-v1';
        const urlsToCache = [
          '/',
          '/index.html',
          'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css'
        ];

        self.addEventListener('install', event => {
          event.waitUntil(
            caches.open(CACHE_NAME)
              .then(cache => cache.addAll(urlsToCache))
              .then(() => self.skipWaiting())
          );
        });

        self.addEventListener('activate', event => {
          event.waitUntil(
            caches.keys().then(cacheNames => {
              return Promise.all(
                cacheNames.filter(name => name !== CACHE_NAME)
                  .map(name => caches.delete(name))
              );
            }).then(() => self.clients.claim())
          );
        });

        self.addEventListener('fetch', event => {
          event.respondWith(
            caches.match(event.request)
              .then(response => response || fetch(event.request))
          );
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      // Register the service worker
      navigator.serviceWorker.register(swUrl)
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.warn('Service Worker registration failed:', err));
    }
