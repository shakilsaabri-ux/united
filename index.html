    // ─────────────────────────────────────────────
    //  MILK BOOK
    // ─────────────────────────────────────────────
    const FIXED_HERD = 192;
    function MilkBook(p) {
      const [view, setView] = useState('DASHBOARD');
      const [opDate, setOpDate] = useState(BASE_DATE);
      const [detail, setDetail] = useState(null);

      if (view === 'PRODUCTION') return <ProductionEntry {...p} opDate={opDate} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'SUPPLY') return <SupplyEntry {...p} opDate={opDate} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'PAYMENT') return <MilkPaymentEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'BILL') return <BillGenerator {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'SUPPLY_TABLE') return <SupplyHistoryPage {...p} onBack={()=>setView('DASHBOARD')} />;
      
      const todayProd = p.production.find(pr=>pr.date===opDate) || {shedAMorn:0,shedAEve:0,shedBMorn:0,shedBEve:0};
      const shedATotal = (todayProd.shedAMorn||0)+(todayProd.shedAEve||0);
      const shedBTotal = (todayProd.shedBMorn||0)+(todayProd.shedBEve||0);
      const totalProd = shedATotal + shedBTotal;
      const avgPerBuf = (totalProd/FIXED_HERD).toFixed(2);
      const totalBill = p.supply.reduce((s,x)=>s+x.amount,0);
      const totalRcvd = p.milkPayLog.reduce((s,x)=>s+x.amount,0);
      const outstanding = totalBill - totalRcvd;
      
      const renderDetail = () => {
        if (!detail) return null;
        let rows=[], title='';
        if (detail==='TOTAL_PROD') { title='Herd Production History'; rows=p.production.map(pr=>({k:pr.date,v:(pr.shedAMorn+pr.shedAEve+pr.shedBMorn+pr.shedBEve)+' L'})); }
        else if (detail==='SHED_A') { title='Shed A Production History'; rows=p.production.map(pr=>({k:pr.date,v:`Morn: ${pr.shedAMorn}L  Eve: ${pr.shedAEve}L  Total: ${pr.shedAMorn+pr.shedAEve}L`})); }
        else if (detail==='SHED_B') { title='Shed B Production History'; rows=p.production.map(pr=>({k:pr.date,v:`Morn: ${pr.shedBMorn}L  Eve: ${pr.shedBEve}L  Total: ${pr.shedBMorn+pr.shedBEve}L`})); }
        else if (detail==='BILL') { title='Total Bill Breakdown'; const cm={}; p.supply.forEach(s=>{if(!cm[s.customer])cm[s.customer]=0;cm[s.customer]+=s.amount;}); rows=Object.entries(cm).map(([c,v])=>({k:c,v:'₹'+moneyFmt(v)})); }
        else if (detail==='RCVD') { title='Payments Received'; rows=p.milkPayLog.map(m=>({k:m.customer+' • '+m.date,v:'₹'+moneyFmt(m.amount)})); }
        else if (detail==='OUT') { title='Outstanding per Customer'; const cm={},pm={}; p.supply.forEach(s=>{if(!cm[s.customer])cm[s.customer]=0;cm[s.customer]+=s.amount;}); p.milkPayLog.forEach(m=>{if(!pm[m.customer])pm[m.customer]=0;pm[m.customer]+=m.amount;}); rows=Object.keys(cm).map(c=>({k:c,v:'₹'+moneyFmt(cm[c]-(pm[c]||0))})); }
        return (
          <div className="overlay" onClick={()=>setDetail(null)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-title">🥛 {title}</div>
              {rows.map((r,i)=><div key={i} className="report-row"><span className="report-key">{r.k}</span><span className="report-val">{r.v}</span></div>)}
              <button className="submit-btn" style={{marginTop:14,background:'var(--bg-back-btn)',color:'var(--primary)'}} onClick={()=>setDetail(null)}>Close</button>
            </div>
          </div>
        );
      };

      const [confirmClearMilk, setConfirmClearMilk] = useState(false);
      return (
        <div>
          <div className="app-header">
            <div><div className="farm-title">Milk Book</div><div className="farm-sub">Supply & Production</div></div>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              <input type="date" style={{background:'var(--bg-input)',border:'1px solid var(--border-input)',padding:'6px 8px',borderRadius:8,color:'var(--text-main)',fontFamily:'inherit',fontSize:11,fontWeight:700}} value={opDate} onChange={e=>setOpDate(e.target.value)} />
              {!confirmClearMilk && <button className="back-btn" style={{background:'#2A1414',color:'#FCA5A5',borderColor:'#7F1D1D',fontSize:10}} onClick={()=>setConfirmClearMilk(true)}>🗑️</button>}
              {confirmClearMilk && <button className="back-btn" style={{background:'#7F1D1D',color:'#fff',borderColor:'#EF4444',fontSize:10,fontWeight:800}} onClick={async ()=>{p.setProduction([]);p.setSupply([]);p.setMilkPayLog([]);await dbClearStores('production','supply','milkPayLog');setConfirmClearMilk(false);}}>⚠️ Clear</button>}
              {confirmClearMilk && <button className="back-btn" style={{fontSize:10}} onClick={()=>setConfirmClearMilk(false)}>✕</button>}
              <button className="theme-btn" onClick={()=>p.setIsDark(!p.isDark)}>{p.isDark?'☀️':'🌙'}</button>
            </div>
          </div>
          <div className="scroll-page" style={{paddingTop:10}}>
            
            <SectionDivider label="Production Dashboard" />
            <div className="dash-grid-2">
              {[
                {label:'Total Production',val:totalProd,unit:'L',color:'#10B981',det:'TOTAL_PROD'},
                {label:'Avg / Buffalo (192)',val:avgPerBuf,unit:'L',color:'#3B82F6',det:'SHED_A'},
                {label:'Shed A Total',val:shedATotal,unit:'L',color:'#A855F7',det:'SHED_A'},
                {label:'Shed B Total',val:shedBTotal,unit:'L',color:'#A855F7',det:'SHED_B'},
                {label:'Total Bill Amt',val:'₹'+moneyFmt(totalBill),unit:'',color:'#F59E0B',det:'BILL',noFmt:true},
                {label:'Total Received',val:'₹'+moneyFmt(totalRcvd),unit:'',color:'#10B981',det:'RCVD',noFmt:true},
                {label:'Outstanding',val:'₹'+moneyFmt(outstanding),unit:'',color:'#EF4444',det:'OUT',noFmt:true}
              ].map((c,i)=>(
                <div key={i} className="d-card" style={{borderLeft:`4px solid ${c.color}`}} onClick={()=>setDetail(c.det)}>
                  <div className="d-card-left"><div className="d-label">{c.label}</div>
                    <div className="d-val-sm" style={{color:c.color}}>{c.noFmt?c.val:<span>{c.val}<span className="d-unit"> {c.unit}</span></span>}</div>
                  </div><span style={{fontSize:12,color:'var(--text-muted)'}}>➔</span>
                </div>
              ))}
            </div>
            
            <SectionDivider label="Quick Actions" />
            <div className="dash-grid-2">
              {[
                {label:'Enter Production',icon:'🥛',v:'PRODUCTION',color:'#10B981'},
                {label:'Customer Supply',icon:'📦',v:'SUPPLY',color:'#3B82F6'},
                {label:'Receive Payment',icon:'💰',v:'PAYMENT',color:'#F59E0B'},
                {label:'Generate Bill',icon:'🧾',v:'BILL',color:'#EC4899'},
                {label:'Supply History',icon:'📋',v:'SUPPLY_TABLE',color:'#8B5CF6'},
              ].map(btn=>(
                <div key={btn.v} className="action-card" style={{background:`linear-gradient(135deg,${btn.color}22,${btn.color}44)`,border:`1px solid ${btn.color}55`}} onClick={()=>setView(btn.v)}>
                  <div className="ac-label">Milk Book</div>
                  <div className="ac-title">{btn.icon} {btn.label}</div>
                </div>
              ))}
            </div>
          </div>
          {renderDetail()}
        </div>
      );
    }

    function ProductionEntry({ production, setProduction, opDate, onBack }) {
      const existing = production.find(p=>p.date===opDate) || {};
      const [am,setAm] = useState(existing.shedAMorn||'');
      const [ae,setAe] = useState(existing.shedAEve||'');
      const [bm,setBm] = useState(existing.shedBMorn||'');
      const [be,setBe] = useState(existing.shedBEve||'');
      
      const submit = e => {
        e.preventDefault();
        const entry = {date:opDate,shedAMorn:Number(am),shedAEve:Number(ae),shedBMorn:Number(bm),shedBEve:Number(be)};
        setProduction(prev=>[...prev.filter(p=>p.date!==opDate),entry].sort((a,b)=>b.date.localeCompare(a.date)));
        alert('Production saved for '+opDate);
        onBack();
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Daily Production — {opDate}</span><BackBtn onClick={onBack} /></div>
            <form onSubmit={submit}>
              <div style={{color:'var(--primary)',fontSize:11,fontWeight:800,marginBottom:6,textTransform:'uppercase'}}>Shed A</div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Morning (L)</label><input type="number" className="farm-input" required value={am} onChange={e=>setAm(e.target.value)} /></div>
                <div className="input-row"><label className="field-lbl">Evening (L)</label><input type="number" className="farm-input" required value={ae} onChange={e=>setAe(e.target.value)} /></div>
              </div>
              <div style={{color:'var(--primary)',fontSize:11,fontWeight:800,margin:'10px 0 6px',textTransform:'uppercase'}}>Shed B</div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Morning (L)</label><input type="number" className="farm-input" required value={bm} onChange={e=>setBm(e.target.value)} /></div>
                <div className="input-row"><label className="field-lbl">Evening (L)</label><input type="number" className="farm-input" required value={be} onChange={e=>setBe(e.target.value)} /></div>
              </div>
              <button type="submit" className="submit-btn">Save Production</button>
            </form>
          </div>
          
          <SectionDivider label="Production History" />
          <div className="tbl-wrap">
            <table className="data-table">
              <thead><tr><th>Date</th><th>Shed A</th><th>Shed B</th><th>Total</th><th>Del</th></tr></thead>
              <tbody>{production.map(pr=>(
                <tr key={pr.date}><td>{pr.date}</td><td>{pr.shedAMorn+pr.shedAEve}L</td><td>{pr.shedBMorn+pr.shedBEve}L</td>
                  <td style={{fontWeight:800,color:'var(--primary)'}}>{pr.shedAMorn+pr.shedAEve+pr.shedBMorn+pr.shedBEve}L</td>
                  <td><DelBtn onClick={()=>{if(window.confirm('Delete '+pr.date+'?'))setProduction(prev=>prev.filter(x=>x.date!==pr.date))}} /></td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </div>
      );
    }

    function SupplyEntry({ supply, setSupply, opDate, onBack }) {
      const [form, setForm] = useState({ date:opDate, customer:'', mornLit:'', eveLit:'', rate:'' });
      const total = (Number(form.mornLit)||0)+(Number(form.eveLit)||0);
      const amt = total*(Number(form.rate)||0);
      const getLastSupply = (cust) => supply.filter(s=>s.customer===cust).sort((a,b)=>b.date.localeCompare(a.date))[0];
      
      useEffect(()=>{
        if(form.customer){
          const last = getLastSupply(form.customer);
          if(last){ setForm(f=>({...f,mornLit:last.mornLit.toString(),eveLit:last.eveLit.toString(),rate:last.rate.toString()})); }
        }
      },[form.customer]);
      
      const submit = e => {
        e.preventDefault();
        setSupply(prev=>[...prev,{id:'s-'+Date.now(),...form,mornLit:Number(form.mornLit),eveLit:Number(form.eveLit),rate:Number(form.rate),totalLiters:total,amount:amt}]);
        alert('Supply entry saved.');
        setForm({date:opDate,customer:'',mornLit:'',eveLit:'',rate:''});
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Customer Supply Entry</span><BackBtn onClick={onBack} /></div>
            <form onSubmit={submit}>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Date</label><input type="date" className="farm-input" required value={form.date} onChange={e=>setForm({...form,date:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Customer Name</label><input type="text" className="farm-input" required value={form.customer} onChange={e=>setForm({...form,customer:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Morning (L — Auto prev)</label><input type="number" step="any" className="farm-input" required value={form.mornLit} onChange={e=>setForm({...form,mornLit:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Evening (L — Auto prev)</label><input type="number" step="any" className="farm-input" required value={form.eveLit} onChange={e=>setForm({...form,eveLit:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Rate ₹/L (Auto prev)</label><input type="number" step="0.5" className="farm-input" required value={form.rate} onChange={e=>setForm({...form,rate:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Total Amt (Auto)</label><input type="text" className="farm-input" disabled value={'₹'+moneyFmt(amt)+' ('+total+'L)'} /></div>
              </div>
              <button type="submit" className="submit-btn">Save Supply Entry</button>
            </form>
          </div>
        </div>
      );
    }

    function MilkPaymentEntry({ supply, milkPayLog, setMilkPayLog, onBack }) {
      const [form, setForm] = useState({ date:'', customer:'', amount:'' });
      const customers = [...new Set(supply.map(s=>s.customer))];
      const totalBilled = c => supply.filter(s=>s.customer===c).reduce((t,s)=>t+s.amount,0);
      const totalPaid = c => milkPayLog.filter(m=>m.customer===c).reduce((t,m)=>t+m.amount,0);
      const balance = form.customer ? totalBilled(form.customer)-totalPaid(form.customer) : 0;
      
      const submit = e => {
        e.preventDefault();
        setMilkPayLog(prev=>[...prev,{id:'mp-'+Date.now(),...form,amount:Number(form.amount)}]);
        alert('Payment saved.');
        setForm({date:'',customer:'',amount:''});
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Receive Customer Payment</span><BackBtn onClick={onBack} /></div>
            <form onSubmit={submit}>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Date</label><input type="date" className="farm-input" required value={form.date} onChange={e=>setForm({...form,date:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Customer</label>
                  <select className="farm-select" value={form.customer} onChange={e=>setForm({...form,customer:e.target.value})}>
                    <option value="">-- Select --</option>
                    {customers.map(c=><option key={c}>{c}</option>)}
                  </select></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Amount Received (₹)</label><input type="number" className="farm-input" required value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Outstanding Balance (Auto)</label><input type="text" className="farm-input" disabled value={'₹'+moneyFmt(balance)} /></div>
              </div>
              <button type="submit" className="submit-btn">Save Payment</button>
            </form>
          </div>
          <SectionDivider label="Customer Balance Summary" />
          <div className="tbl-wrap">
            <table className="data-table">
              <thead><tr><th>Customer</th><th>Total Billed</th><th>Paid</th><th>Outstanding</th></tr></thead>
              <tbody>{customers.map(c=>(
                <tr key={c}><td style={{fontWeight:700}}>{c}</td><td>₹{moneyFmt(totalBilled(c))}</td>
                  <td className="green-val">₹{moneyFmt(totalPaid(c))}</td>
                  <td className={totalBilled(c)-totalPaid(c)>0?'red-val':'green-val'} style={{fontWeight:800}}>₹{moneyFmt(totalBilled(c)-totalPaid(c))}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
          <SectionDivider label="Payment History" />
          <div className="tbl-wrap">
            <table className="data-table">
              <thead><tr><th>Date</th><th>Customer</th><th>Amount</th><th>Del</th></tr></thead>
              <tbody>{milkPayLog.map(m=>(
                <tr key={m.id}><td>{m.date}</td><td style={{fontWeight:700}}>{m.customer}</td>
                  <td className="green-val">₹{moneyFmt(m.amount)}</td>
                  <td><DelBtn onClick={()=>{if(window.confirm('Delete?'))setMilkPayLog(prev=>prev.filter(x=>x.id!==m.id))}} /></td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </div>
      );
    }

    function BillGenerator({ supply, milkPayLog, onBack }) {
      const [cust, setCust] = useState('');
      const [from, setFrom] = useState('2026-05-31');
      const [to, setTo] = useState(BASE_DATE);
      const [manualOldBal, setManualOldBal] = useState('');
      const customers = [...new Set(supply.map(s=>s.customer))];
      
      const getBill = () => {
        if (!cust) return null;
        const rows = supply.filter(s=>s.customer===cust && s.date>=from && s.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
        const currentTotal = rows.reduce((t,r)=>t+r.amount,0);
        
        // Auto previous balance: all bills before 'from' minus all payments before 'from'
        const billBefore = supply.filter(s=>s.customer===cust && s.date<from).reduce((t,s)=>t+s.amount,0);
        const paidBefore = milkPayLog.filter(m=>m.customer===cust && m.date<from).reduce((t,m)=>t+m.amount,0);
        const autoPrevBal = billBefore - paidBefore;
        const oldBal = manualOldBal!=='' ? Number(manualOldBal) : autoPrevBal;
        
        const periodPayments = milkPayLog.filter(m=>m.customer===cust && m.date>=from && m.date<=to).reduce((t,m)=>t+m.amount,0);
        const netAmount = oldBal + currentTotal - periodPayments;
        
        return {rows, currentTotal, oldBal, autoPrevBal, periodPayments, netAmount};
      };
      
      const bill = getBill();
      
      const shareWA = () => {
        if (!bill || bill.rows.length===0) return alert('No data found.');
        let msg = `🥛 *HALIMA DAIRY FARM — MILK BILL* 🥛\n👤 Customer: ${cust}\n📅 Period: ${from} → ${to}\n━━━━━━━━━━━━━━━━━━━━━━\n`;
        msg += `Date | Morn | Eve | Total | Rate | Amount\n`;
        bill.rows.forEach(r=>{ msg+=`${r.date} | ${r.mornLit}L | ${r.eveLit}L | ${r.totalLiters}L | ₹${r.rate} | ₹${moneyFmt(r.amount)}\n`; });
        msg+=`━━━━━━━━━━━━━━━━━━━━━━\n🔹 Old Balance: ₹${moneyFmt(bill.oldBal)}\n🔹 Current Bill: ₹${moneyFmt(bill.currentTotal)}\n💸 Payments Received: ₹${moneyFmt(bill.periodPayments)}\n✨ *NET PAYABLE: ₹${moneyFmt(bill.netAmount)}*\n📞 Thank you! – Halima Dairy`;
        window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Generate Customer Bill</span><BackBtn onClick={onBack} /></div>
            <div className="input-row"><label className="field-lbl">Customer</label>
              <select className="farm-select" value={cust} onChange={e=>setCust(e.target.value)}>
                <option value="">-- Select Customer --</option>
                {customers.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="grid-2">
              <div className="input-row"><label className="field-lbl">From Date</label><input type="date" className="farm-input" value={from} onChange={e=>setFrom(e.target.value)} /></div>
              <div className="input-row"><label className="field-lbl">To Date</label><input type="date" className="farm-input" value={to} onChange={e=>setTo(e.target.value)} /></div>
            </div>
            {bill && <div className="auto-hint" style={{marginBottom:6}}>🔄 Previous Balance (Auto): ₹{moneyFmt(bill.autoPrevBal)}</div>}
            <div className="input-row"><label className="field-lbl">Old Balance Override (Manual ₹)</label><input type="number" className="farm-input" value={manualOldBal} onChange={e=>setManualOldBal(e.target.value)} placeholder="Leave blank for auto" /></div>
            <button className="submit-btn" style={{background:'#25D366',color:'#000'}} onClick={shareWA}>📲 Share Bill on WhatsApp</button>
          </div>
          {bill && bill.rows.length>0 && (
            <div className="form-panel">
              <div className="panel-header">Bill Preview — {cust}</div>
              <div className="tbl-wrap">
                <table className="data-table">
                  <thead><tr><th>Date</th><th>Morning</th><th>Evening</th><th>Total</th><th>Rate</th><th>Amount</th></tr></thead>
                  <tbody>{bill.rows.map(r=>(
                    <tr key={r.id}><td>{r.date}</td><td>{r.mornLit}L</td><td>{r.eveLit}L</td>
                      <td style={{fontWeight:700}}>{r.totalLiters}L</td><td>₹{r.rate}</td><td className="green-val">₹{moneyFmt(r.amount)}</td>
                    </tr>
                  ))}</tbody>
                </table>
              </div>
              <div style={{padding:'10px 0'}}>
                {[['Old Balance','₹'+moneyFmt(bill.oldBal)],['Current Bill','₹'+moneyFmt(bill.currentTotal)],['Payments Received','₹'+moneyFmt(bill.periodPayments)],['NET PAYABLE','₹'+moneyFmt(bill.netAmount)]].map(([k,v],i)=>(

    function StockBook(p) {
      const [view, setView] = useState('DASHBOARD');
      const [detail, setDetail] = useState(null);

      // useMemo MUST be before conditional returns (React hooks rules)
      const analytics = useMemo(()=>{
        const uniqueDays = [...new Set(p.consumption.map(c=>c.date))].length || 1;
        const bagSizeMap = {};
        p.purchases.forEach(pu=>{ bagSizeMap[pu.item?.toLowerCase()] = pu.bagSize || 50; });
        let totalKg = 0;
        p.consumption.forEach(c=>{ totalKg += c.consumedBags * (bagSizeMap[c.itemName?.toLowerCase()]||50); });
        const dailyKg = parseFloat((totalKg/uniqueDays).toFixed(2));
  
        const globalW = p.purchases.reduce((s,pu)=>s+pu.weight,0);
        const globalC = p.purchases.reduce((s,pu)=>s+pu.totalCost,0);
        const avgCostKg = globalW>0 ? parseFloat((globalC/globalW).toFixed(2)) : 0;
        const totalAnimals = p.buffalo.filter(b=>!b.outgoingDate&&!['Dead','Slaughtered'].includes(b.status)).length || 1;
        const avgPerBuf = parseFloat((dailyKg/totalAnimals).toFixed(2));
        let godownVal = 0;
        p.godown.forEach(g=>{ 
          const rate=(avgCostKg||33.5);
          const bagSize=(bagSizeMap[g.itemName?.toLowerCase()]||50); godownVal+=g.bags*bagSize*rate; 
        });
        
        const lowAlerts = [];
        p.godown.forEach(g=>{
          const logs = p.consumption.filter(c=>c.itemName?.toLowerCase()===g.itemName?.toLowerCase());
          const totalConsumed = logs.reduce((s,c)=>s+c.consumedBags,0);
          const avgDaily = totalConsumed/uniqueDays;
          if(avgDaily>0) {
            const runway = Math.round(g.bags/avgDaily);
            if(runway < 10) lowAlerts.push({item:g.itemName, bags:g.bags, runway});
          } else if(g.bags < 5) {
            lowAlerts.push({item:g.itemName, bags:g.bags, runway:0});
          }
        });
        lowAlerts.sort((a,b)=>a.runway-b.runway);
        return {dailyKg,avgCostKg,avgPerBuf,godownVal:Math.round(godownVal),lowAlerts};
      },[p.purchases,p.consumption,p.godown,p.buffalo]);

      if (view === 'PURCHASE') return <PurchaseEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'CONSUME') return <ConsumptionEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'LEDGER') return <DanaLedger {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'GODOWN') return <GodownPage {...p} onBack={()=>setView('DASHBOARD')} />;

      const renderDetail = () => {
        if(!detail) return null;
        let rows=[],title='';
        if(detail==='DAILY'){title='Daily Feed Consumption'; rows=p.consumption.map(c=>({k:c.date+' • '+c.itemName,v:c.consumedBags+' Bags'}));}
        else if(detail==='GODOWN'){title='Godown Stock'; rows=p.godown.map(g=>({k:g.itemName,v:g.bags+' Bags'}));}
        return(
          <div className="overlay" onClick={()=>setDetail(null)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-title">🌾 {title}</div>
              {rows.map((r,i)=><div key={i} className="report-row"><span className="report-key">{r.k}</span><span className="report-val">{r.v}</span></div>)}
              <button className="submit-btn" style={{marginTop:14,background:'var(--bg-back-btn)',color:'var(--primary)'}} onClick={()=>setDetail(null)}>Close</button>
            </div>
          </div>
        );
      };

      return (
        <div>
          <PageHeader title="Stock Book" sub="Feed & Godown" onTheme={()=>p.setIsDark(!p.isDark)} isDark={p.isDark}
            onClear={async () => { p.setGodown([]); p.setPurchases([]); p.setConsumption([]); p.setDanaPayLog([]); await dbClearStores('godown','purchases','consumption','danaPayLog'); }}
          />
          <div className="scroll-page" style={{paddingTop:10}}>

            {/* Low Stock Alerts */}
            {analytics.lowAlerts.length > 0 && (
              <>
                <SectionDivider label="⚠️ Low Stock Alerts" />
                <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:8}}>
                  {analytics.lowAlerts.map((a,i)=>(
                    <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 14px',borderRadius:10,background:a.runway<=3?'#2A0A0A':a.runway<=7?'#2A1A00':'#0A1A0A',border:`1px solid ${a.runway<=3?'#EF4444':a.runway<=7?'#F97316':'#10B981'}`}}>
                      <div>
                        <div style={{fontWeight:800,fontSize:13,color:a.runway<=3?'#FCA5A5':a.runway<=7?'#FCD34D':'#6EE7B7'}}>{a.item}</div>
                        <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>{a.bags} bags remaining</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontWeight:800,fontSize:16,color:a.runway<=3?'#EF4444':a.runway<=7?'#F97316':'#10B981'}}>{a.runway}d</div>
                        <div style={{fontSize:9,color:'var(--text-muted)',textTransform:'uppercase'}}>runway</div>
                      </div>
                    </div>
                  ))}
                </div>
              </>
            )}

            <SectionDivider label="Analytics Dashboard" />
            <div className="dash-grid-2">
              {[
                {label:'Daily Feed (KG)',val:analytics.dailyKg,unit:'KG/Day',color:'#3B82F6',det:'DAILY'},
                {label:'Avg Feed Cost',val:'₹'+analytics.avgCostKg,unit:'/KG',color:'#10B981',det:'DAILY',noFmt:true},
                {label:'Avg Feed/Buffalo',val:analytics.avgPerBuf,unit:'KG/Hd',color:'#10B981',det:'DAILY'},
                {label:'Godown Value',val:'₹'+moneyFmt(analytics.godownVal),unit:'',color:'#A855F7',det:'GODOWN',noFmt:true}
              ].map((c,i)=>(
                <div key={i} className="d-card" style={{borderLeft:`4px solid ${c.color}`}} onClick={()=>setDetail(c.det)}>
                  <div className="d-card-left"><div className="d-label">{c.label}</div>
                    <div className="d-val-sm">{c.noFmt?c.val:<span>{c.val}<span className="d-unit"> {c.unit}</span></span>}</div>
                  </div><span style={{fontSize:12,color:'var(--text-muted)'}}>➔</span>
                </div>
              ))}
            </div>

            <SectionDivider label="⚠️ Stock Alerts" />
            {analytics.lowAlerts.length>0
              ? analytics.lowAlerts.map((a,i)=>(
                  <div key={i} className="alert-box" style={{borderLeft:`4px solid ${a.runway<=3?'#EF4444':a.runway<=7?'#F97316':'#F59E0B'}`,background:a.runway<=3?'#1A0505':'#1A0D00'}}>
                    <div>
                      <span className="alert-txt">
                        {a.runway<=3?'🚨':'⚠️'} <strong>{a.item}</strong>
                      </span>
                      <div style={{fontSize:10,color:'var(--text-muted)',marginTop:2}}>
                        {a.bags} bags remaining — approx <strong style={{color:a.runway<=3?'#FCA5A5':a.runway<=7?'#FED7AA':'#FEF08A'}}>{a.runway} days</strong> left
                      </div>
                    </div>
                    <span className="alert-badge" style={{background:a.runway<=3?'#EF4444':a.runway<=7?'#F97316':'#F59E0B',color:'#fff',flexShrink:0}}>
                      {a.runway<=3?'CRITICAL':a.runway<=7?'LOW':'REORDER'}
                    </span>
                  </div>
                ))
              : <div className="alert-box alert-ok"><span className="alert-txt-ok">✅ All stock levels stable — 10+ day runway confirmed.</span></div>
            }
            
            <SectionDivider label="Godown Stock" />
            <div className="tbl-wrap">
              <table className="data-table" style={{minWidth:0}}>
                <thead><tr><th>Item</th><th>Bags</th></tr></thead>
                <tbody>{p.godown.map(g=>(
                  <tr key={g.id}><td style={{fontWeight:700}}>{g.itemName}</td>
                    <td style={{color:'var(--primary)',fontWeight:800}}>{g.bags} Bags</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>

            <SectionDivider label="Quick Actions" />
            <div className="dash-grid-2">
              {[
                {label:'Buy Feed',icon:'💼',v:'PURCHASE',color:'#D97706'},
                {label:'Consumption',icon:'🌾',v:'CONSUME',color:'#3B82F6'},
                {label:'Broker Ledger',icon:'📖',v:'LEDGER',color:'#A855F7'},
                {label:'Manage Godown',icon:'🏪',v:'GODOWN',color:'#059669'},
              ].map(btn=>(
                <div key={btn.v} className="action-card" style={{background:`linear-gradient(135deg,${btn.color}22,${btn.color}44)`,border:`1px solid ${btn.color}55`}} onClick={()=>setView(btn.v)}>
                  <div className="ac-label">Stock Book</div>
                  <div className="ac-title">{btn.icon} {btn.label}</div>
                </div>
              ))}
            </div>
          </div>
          {renderDetail()}
        </div>
      );
    }

    function PurchaseEntry({ godown, setGodown, purchases, setPurchases, onBack }) {
      const [form, setForm] = useState({date:'',broker:'',item:'',ratePerKg:'',weight:'',bags:'',freight:''});
      const bagSize = form.weight && form.bags ? parseFloat((Number(form.weight)/Number(form.bags)).toFixed(2)) : 0;
      const freightPerKg = form.freight && form.weight ? parseFloat((Number(form.freight)/Number(form.weight)).toFixed(2)) : 0;
      const totalCost = (Number(form.ratePerKg)*Number(form.weight)) + Number(form.freight);
      
      const submit = e => {
        e.preventDefault();
        const entry = {id:'pu-'+Date.now(),...form,ratePerKg:Number(form.ratePerKg),weight:Number(form.weight),bags:Number(form.bags),freight:Number(form.freight),bagSize,freightPerKg,totalCost};
        setPurchases(prev=>[entry,...prev]);
        setGodown(prev=>{
          const idx = prev.findIndex(g=>g.itemName?.toLowerCase()===form.item?.toLowerCase());
          if(idx!==-1) return prev.map((g,i)=>i===idx?{...g,bags:g.bags+Number(form.bags)}:g);
          return [...prev,{id:'g-'+Date.now(),itemName:form.item,bags:Number(form.bags)}];
        });
        alert('Purchase saved. Bags added to godown.');
        setForm({date:'',broker:'',item:'',ratePerKg:'',weight:'',bags:'',freight:''});
      };
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Feed Purchase Entry</span><BackBtn onClick={onBack} /></div>
            <form onSubmit={submit}>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Date</label><input type="date" className="farm-input" required value={form.date} onChange={e=>setForm({...form,date:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Broker Name</label><input type="text" className="farm-input" required value={form.broker} onChange={e=>setForm({...form,broker:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Item Name</label><input type="text" className="farm-input" required value={form.item} onChange={e=>setForm({...form,item:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Rate/KG (₹)</label><input type="number" step="0.01" className="farm-input" required value={form.ratePerKg} onChange={e=>setForm({...form,ratePerKg:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Total Weight (KG)</label><input type="number" className="farm-input" required value={form.weight} onChange={e=>setForm({...form,weight:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">No of Bags</label><input type="number" className="farm-input" required value={form.bags} onChange={e=>setForm({...form,bags:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Bag Size (Auto)</label><input type="text" className="farm-input" disabled value={bagSize?bagSize+' KG':''} /></div>
                <div className="input-row"><label className="field-lbl">Freight (₹)</label><input type="number" className="farm-input" required value={form.freight} onChange={e=>setForm({...form,freight:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Freight/KG (Auto)</label><input type="text" className="farm-input" disabled value={freightPerKg?'₹'+freightPerKg+'/KG':''} /></div>
                <div className="input-row"><label className="field-lbl">Total Cost (Auto)</label><input type="text" className="farm-input" disabled value={totalCost?'₹'+moneyFmt(totalCost):''} /></div>
              </div>
              <button type="submit" className="submit-btn">Save Purchase</button>

              <thead><tr><th>Date</th><th>Broker</th><th>Item</th><th>Bags</th><th>Total</th><th>Del</th></tr></thead>

                  <td>{pu.bags}</td><td className="green-val">₹{moneyFmt(pu.totalCost)}</td>
                  <td><DelBtn onClick={()=>{if(window.confirm('Delete?')){setGodown(prev=>prev.map(g=>g.itemName?.toLowerCase()===pu.item?.toLowerCase()?{...g,bags:Math.max(0,g.bags-pu.bags)}:g));setPurchases(prev=>prev.filter(x=>x.id!==pu.id));}}}/></td>
                </tr>
              ))}</tbody>

      );

    function ConsumptionEntry({ godown, setGodown, consumption, setConsumption, onBack }) {
      const [form, setForm] = useState({date:'',itemName:'',consumedBags:''});
      const matchedStock = godown.find(g=>g.itemName?.toLowerCase()===form.itemName?.toLowerCase());
      const opening = matchedStock ? matchedStock.bags : 0;
      const closing = opening - (Number(form.consumedBags)||0);
      
      const submit = e => {
        e.preventDefault();
        if(!matchedStock){alert('Item not found in godown!');return;}
        if(Number(form.consumedBags)>opening){alert('Insufficient stock!');return;}
        const entry = {id:'co-'+Date.now(),...form,consumedBags:Number(form.consumedBags),openingBags:opening,closingBags:closing,itemName:matchedStock.itemName};
        setConsumption(prev=>[entry,...prev]);
        setGodown(prev=>prev.map(g=>g.itemName?.toLowerCase()===form.itemName?.toLowerCase()?{...g,bags:closing}:g));
        alert('Consumption logged.');
        setForm({date:'',itemName:'',consumedBags:''});
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Daily Consumption</span><BackBtn onClick={onBack} /></div>
            <form onSubmit={submit}>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Date</label><input type="date" className="farm-input" required value={form.date} onChange={e=>setForm({...form,date:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Item Name</label><input type="text" className="farm-input" required value={form.itemName} onChange={e=>setForm({...form,itemName:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Opening Balance (Auto)</label><input type="text" className="farm-input" disabled value={opening+' Bags'} /></div>
                <div className="input-row"><label className="field-lbl">Consumed (Bags)</label><input type="number" className="farm-input" required value={form.consumedBags} onChange={e=>setForm({...form,consumedBags:e.target.value})} /></div>
              </div>
              <div className="auto-hint">Closing Balance (Auto): {closing} Bags</div>
              <button type="submit" className="submit-btn">Log Consumption</button>
            </form>
          </div>
          <SectionDivider label="Consumption Log" />
          <div className="tbl-wrap">
            <table className="data-table">
              <thead><tr><th>Date</th><th>Item</th><th>Opening</th><th>Consumed</th><th>Closing</th><th>Del</th></tr></thead>
              <tbody>{consumption.map(c=>(
                <tr key={c.id}><td>{c.date}</td><td style={{fontWeight:700}}>{c.itemName}</td>
                  <td>{c.openingBags}Bg</td><td className="red-val">-{c.consumedBags}Bg</td>
                  <td className="green-val">{c.closingBags}Bg</td>
                  <td><DelBtn onClick={()=>{if(window.confirm('Restore bags?')){setGodown(prev=>prev.map(g=>g.itemName?.toLowerCase()===c.itemName?.toLowerCase()?{...g,bags:g.bags+c.consumedBags}:g));setConsumption(prev=>prev.filter(x=>x.id!==c.id));}}}/></td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </div>
      );
    }

    function DanaLedger({ purchases, danaPayLog, setDanaPayLog, onBack }) {

      const submit = e => {
        e.preventDefault();
        setDanaPayLog(prev=>[...prev,{id:'dp-'+Date.now(),date:form.date||BASE_DATE,broker:form.broker,amount:Number(form.amount)}]);
        alert('Payment saved.');
        setForm({date:'',broker:'',amount:''});
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>

              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Date</label><input type="date" className="farm-input" required value={form.date} onChange={e=>setForm({...form,date:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Broker Name</label><input type="text" className="farm-input" required value={form.broker} onChange={e=>setForm({...form,broker:e.target.value})} /></div>
              </div>
              <div className="input-row"><label className="field-lbl">Amount Paid (₹)</label><input type="number" className="farm-input" required value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} /></div>

          <div className="tbl-wrap">
            <table className="data-table" style={{minWidth:0}}>
              <thead><tr><th>Broker</th><th>Purchased</th><th>Paid</th><th>Balance</th></tr></thead>
              <tbody>{Object.entries(danaMap).map(([name,v])=>(
                <tr key={name}><td style={{fontWeight:700}}>{name}</td><td>₹{moneyFmt(v.purchased)}</td>
                  <td className="green-val">₹{moneyFmt(v.paid)}</td>
                  <td className={v.purchased-v.paid>0?'red-val':'green-val'} style={{fontWeight:800}}>₹{moneyFmt(v.purchased-v.paid)}</td>
                </tr>

            </table>
          </div>
          <SectionDivider label="Payment History" />
          <div className="tbl-wrap">
            <table className="data-table" style={{minWidth:0}}>
              <thead><tr><th>Date</th><th>Broker</th><th>Amount</th><th>Del</th></tr></thead>
              <tbody>{danaPayLog.map(p=>(
                <tr key={p.id}><td>{p.date}</td><td style={{fontWeight:700}}>{p.broker}</td>
                  <td className="green-val">₹{moneyFmt(p.amount)}</td>
                  <td><DelBtn onClick={()=>{if(window.confirm('Delete?'))setDanaPayLog(prev=>prev.filter(x=>x.id!==p.id))}} /></td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </div>
      );
    }

                <div className="input-row"><label className="field-lbl">Bags</label><input type="number" className="farm-input" required value={form.bags} onChange={e=>setForm({...form,bags:e.target.value})} /></div>

    // ── Pagar Slip Generator ──
    function PagarSlipPage({ labour, labPayLog, profiles, onBack }) {
      const [selWorker, setSelWorker] = useState('');
      const [month, setMonth] = useState('2026-06');

      const prof = profiles.find(pr=>pr.workerName===selWorker);
      const [yr, mo] = month.split('-').map(Number);
      const monthStart = month+'-01';
      const monthEnd = new Date(yr, mo, 0).toISOString().split('T')[0];

      // Days worked within the selected month
      const joinDate = prof ? prof.joiningDate : '';
      const leaveDate = prof ? (prof.leavingDate || BASE_DATE) : BASE_DATE;
      const periodStart = joinDate > monthStart ? joinDate : monthStart;
      const periodEnd = leaveDate < monthEnd ? leaveDate : monthEnd;
      const daysInMonth = new Date(yr, mo, 0).getDate();
      const workedDays = prof ? Math.max(0, daysBetween(periodStart, periodEnd)) : 0;
      const grossForMonth = prof ? Math.round((prof.pagarPerMonth / daysInMonth) * workedDays) : 0;

      // Draws taken in this month only
      const monthDraws = labPayLog.filter(lp=>lp.workerName===selWorker && lp.date>=monthStart && lp.date<=monthEnd);
      const totalDrawn = monthDraws.reduce((s,lp)=>s+lp.amountTaken, 0);
      const netDue = grossForMonth - totalDrawn;
      
      const shareWA = () => {
        if (!prof) return;
        const mName = new Date(yr, mo-1, 1).toLocaleString('default',{month:'long',year:'numeric'});
        let msg = `👷 *PAGAR SLIP — ${prof.workerName.toUpperCase()}*\n`;
        msg += `📅 Month: ${mName}\n🏚️ Shed: ${prof.shed}\n`;
        msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
        msg += `Days in Month: ${daysInMonth}\nDays Worked: ${workedDays}\n`;
        msg += `Monthly Rate: ₹${moneyFmt(prof.pagarPerMonth)}\n`;
        msg += `Gross Earned: ₹${moneyFmt(grossForMonth)}\n`;
        msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
        msg += `Draws / Advances:\n`;
        monthDraws.forEach(d=>{ msg+=`  ${d.date}: ₹${moneyFmt(d.amountTaken)}\n`; });
        msg += `Total Draws: ₹${moneyFmt(totalDrawn)}\n`;
        msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
        msg += netDue>=0 ? `✅ *BALANCE DUE: ₹${moneyFmt(netDue)}*` : `⚠️ *ADVANCE CARRIED: ₹${moneyFmt(Math.abs(netDue))}*`;
        msg += `\n📞 Halima Dairy Farm`;
        window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Monthly Pagar Slip</span><BackBtn onClick={onBack} /></div>
            <div className="grid-2">
              <div className="input-row"><label className="field-lbl">Worker</label>
                <select className="farm-select" value={selWorker} onChange={e=>setSelWorker(e.target.value)}>
                  <option value="">-- Select Worker --</option>
                  {labour.map(w=><option key={w.id}>{w.workerName}</option>)}
                </select>
              </div>
              <div className="input-row"><label className="field-lbl">Month</label>
                <input type="month" className="farm-input" value={month} onChange={e=>setMonth(e.target.value)} />
              </div>
            </div>
            {prof && (
              <>
                <div style={{background:'var(--bg-input)',border:'1px solid var(--border-card)',borderRadius:8,padding:'12px',marginTop:8}}>
                  {[
                    ['Worker',prof.workerName],['Shed',prof.shed],
                    ['Monthly Rate','₹'+moneyFmt(prof.pagarPerMonth)],
                    ['Days in Month',daysInMonth+'d'],
                    ['Days Worked (Auto)',workedDays+'d'],
                    ['Gross Earned (Auto)','₹'+moneyFmt(grossForMonth)],
                    ['Draws This Month','₹'+moneyFmt(totalDrawn)],
                  ].map(([k,v],i)=>(
                    <div key={i} className="report-row"><span className="report-key">{k}</span><span className="report-val">{v}</span></div>
                  ))}
                  <div className="report-row" style={{borderTop:'2px solid var(--primary)',marginTop:6,paddingTop:6}}>
                    <span className="report-key" style={{fontWeight:800}}>{netDue>=0?'Balance Due to Worker':'Advance Carried'}</span>
                    <span className="report-val" style={{fontWeight:800,fontSize:15,color:netDue>=0?'var(--primary)':'#EF4444'}}>₹{moneyFmt(Math.abs(netDue))}</span>
                  </div>
                </div>
                {monthDraws.length>0 && (
                  <>
                    <div style={{marginTop:8,color:'var(--primary)',fontWeight:700,fontSize:11,textTransform:'uppercase',padding:'4px 0'}}>Draws this month</div>
                    {monthDraws.map(d=>(
                      <div key={d.id} className="report-row"><span className="report-key">{d.date}</span><span className="report-val red-val">₹{moneyFmt(d.amountTaken)}</span></div>
                    ))}
                  </>
                )}
                <button className="submit-btn" style={{background:'#25D366',color:'#000',marginTop:12}} onClick={shareWA}>📲 Send Slip on WhatsApp</button>
              </>
            )}
          </div>
        </div>
      );
    }

    function LabourBook(p) {
      const [view, setView] = useState('DASHBOARD');
      const [workerModal, setWorkerModal] = useState(null);
      const [detail, setDetail] = useState(null);
      const [labSearch, setLabSearch] = useState('');
      
      // useMemo MUST be before any conditional returns (React hooks rules)
      const analytics = useMemo(()=>{
        let totalPagar=0, totalBalance=0, totalAdvance=0;
        const advAlerts=[];
        const profiles = p.labour.map(w=>{
          totalPagar += w.pagarPerMonth;
          const endDate = w.leavingDate || BASE_DATE;
          const daysWorked = daysBetween(w.joiningDate, endDate);
          const earned = parseFloat(((w.pagarPerMonth/30)*daysWorked).toFixed(2));
          const draws = p.labPayLog.filter(lp=>lp.workerName?.toLowerCase()===w.workerName?.toLowerCase()).reduce((s,lp)=>s+lp.amountTaken,0);
          const net = earned - (w.oldAdvance + draws);
          let balance=0, advance=0;
          if(net<0){advance=Math.abs(net);totalAdvance+=advance;advAlerts.push({name:w.workerName,amount:Math.round(advance)});}
          else{balance=net;totalBalance+=balance;}
          return {...w,daysWorked,earned,draws,balance:Math.round(balance),advance:Math.round(advance)};
        });
        const activeCount = p.buffalo.filter(b=>!b.outgoingDate&&!['Dead','Slaughtered'].includes(b.status)).length||1;
        return {totalPagar,totalBalance:Math.round(totalBalance),totalAdvance:Math.round(totalAdvance),avgPerAnimal:parseFloat((totalPagar/activeCount).toFixed(2)),advAlerts,profiles};

      if (view === 'WORKERS') return <WorkerEntry {...p} onBack={()=>setView('DASHBOARD')} />;

      const autoAdvance = name => {

        return(

            </div>

      return (

    function WorkerEntry({ labour, setLabour, labPayLog, setLabPayLog, onBack }) {
      const [form, setForm] = useState({workerName:'',joiningDate:'',oldAdvance:'',leavingDate:'',pagarPerMonth:'',shed:'Shed A'});
      // Auto: days worked from joining to leaving (or today)
      const endDate = form.leavingDate || BASE_DATE;
      const autoDays = form.joiningDate ? daysBetween(form.joiningDate, endDate) : 0;
      // Auto: gross earned based on days
      const pagar = Number(form.pagarPerMonth) || 0;
      const grossEarned = autoDays > 0 && pagar > 0 ? Math.round((pagar / 30) * autoDays) : 0;
      // Auto: total draws from labPayLog for this worker
      const workerDraws = labPayLog.filter(lp => lp.workerName?.toLowerCase() === form.workerName.trim().toLowerCase()).reduce((s, lp) => s + lp.amountTaken, 0);
      const oldAdv = Number(form.oldAdvance) || 0;
      const net = grossEarned - (oldAdv + workerDraws);
      const isAdvance = net < 0;
      const settlementAmt = Math.abs(net);

      const submit = e => {
        e.preventDefault();
        if(labour.some(l=>l.workerName?.toLowerCase()===form.workerName.trim().toLowerCase())){alert('Worker already exists!');return;}
        setLabour(prev=>[...prev,{id:'l-'+Date.now(),...form,oldAdvance:Number(form.oldAdvance)||0,pagarPerMonth:Number(form.pagarPerMonth)||0}]);
        alert('Worker registered: '+form.workerName);
        setForm({workerName:'',joiningDate:'',oldAdvance:'',leavingDate:'',pagarPerMonth:'',shed:'Shed A'});
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Worker Registration</span><BackBtn onClick={onBack} /></div>
            <form onSubmit={submit}>

                <div className="input-row"><label className="field-lbl">Worker Name</label><input type="text" className="farm-input" required value={form.workerName} onChange={e=>setForm({...form,workerName:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Shed</label>
                  <select className="farm-select" value={form.shed} onChange={e=>setForm({...form,shed:e.target.value})}>
                    {['Shed A','Shed B','Yard A','Yard B'].map(s=><option key={s}>{s}</option>)}
                  </select></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Joining Date</label><input type="date" className="farm-input" required value={form.joiningDate} onChange={e=>setForm({...form,joiningDate:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Leaving Date</label><input type="date" className="farm-input" value={form.leavingDate} onChange={e=>setForm({...form,leavingDate:e.target.value})} /></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Pagar/Month (₹)</label><input type="number" className="farm-input" required value={form.pagarPerMonth} onChange={e=>setForm({...form,pagarPerMonth:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Old Advance (₹)</label><input type="number" className="farm-input" value={form.oldAdvance} onChange={e=>setForm({...form,oldAdvance:e.target.value})} /></div>
              </div>

    // ─────────────────────────────────────────────
    //  REPORTS BOOK
    // ─────────────────────────────────────────────
    function ReportsBook(p) {
      const [tab, setTab] = useState('PL');
      const [month, setMonth] = useState('2026-06');
      const [custFilter, setCustFilter] = useState('');
      const [slipWorker, setSlipWorker] = useState('');
      
      // ── Helpers ──
      const inMonth = (dateStr, m) => dateStr && dateStr.startsWith(m);
      
      const months = useMemo(()=>{
        const all = new Set();
        [...p.supply,...p.purchases,...p.milkPayLog,...p.labPayLog,...p.medicineLog,...p.slaughtered,...p.koriLog]
          .forEach(x=>{ const d=x.date||x.outgoingDate||''; if(d.length>=7) all.add(d.slice(0,7)); });
        return [...all].sort().reverse();
      },[p.supply,p.purchases,p.milkPayLog,p.labPayLog,p.medicineLog,p.slaughtered,p.koriLog]);
      
      // ── Monthly P&L ──
      const pl = useMemo(()=>{
        const milkRev = p.supply.filter(x=>inMonth(x.date,month)).reduce((s,x)=>s+x.amount,0);
        const slaRev = p.slaughtered.filter(x=>inMonth(x.outgoingDate,month)).reduce((s,x)=>s+x.amount,0);
        const feedExp = p.purchases.filter(x=>inMonth(x.date,month)).reduce((s,x)=>s+x.totalCost,0);
        const medExp = p.medicineLog.filter(x=>inMonth(x.date,month)).reduce((s,x)=>s+x.amount,0);
        const koriExp = p.koriLog.filter(x=>inMonth(x.date,month)).reduce((s,x)=>s+x.amount,0);
        const labExp = p.labour.filter(l=>!l.leavingDate).reduce((s,w)=>s+w.pagarPerMonth,0);
        const nooraA = p.buffalo.filter(b=>!b.outgoingDate&&!['Dead','Slaughtered'].includes(b.status)&&b.shed==='Noora').length;
        const tosifA = p.buffalo.filter(b=>!b.outgoingDate&&!['Dead','Slaughtered'].includes(b.status)&&b.shed==='Tosif').length;
        const palakExp = nooraA*p.rates.nooraPerMonth + tosifA*p.rates.tosifPerMonth;
        const tajiInMonth = p.tajiLog.filter(x=>inMonth(x.date,month)).length;
        const bakdiInMonth = p.bakdiLog.filter(x=>inMonth(x.date,month)).length;
        const irshadExp = tajiInMonth*p.rates.irshadPerTaji + bakdiInMonth*p.rates.irshadPerBakdi;
        const totalInc = milkRev + slaRev;
        const totalExp = feedExp + medExp + koriExp + labExp + palakExp + irshadExp;
        const net = totalInc - totalExp;
        return {milkRev,slaRev,feedExp,medExp,koriExp,labExp,palakExp,irshadExp,totalInc,totalExp,net};
      },[month,p.supply,p.slaughtered,p.purchases,p.medicineLog,p.koriLog,p.labour,p.buffalo,p.tajiLog,p.bakdiLog,p.rates]);

      // ── Cash Flow (weekly buckets for selected month) ──
      const cashFlow = useMemo(()=>{
        const weeks = [{label:'Wk 1 (1–7)',in:0,out:0},{label:'Wk 2 (8–14)',in:0,out:0},{label:'Wk 3 (15–21)',in:0,out:0},{label:'Wk 4 (22–31)',in:0,out:0}];
        const wk = d => { const day=parseInt((d||'').slice(8,10)); return day<=7?0:day<=14?1:day<=21?2:3; };
        p.milkPayLog.filter(x=>inMonth(x.date,month)).forEach(x=>{ weeks[wk(x.date)].in+=x.amount; });
        p.slaughtered.filter(x=>inMonth(x.outgoingDate,month)).forEach(x=>{ weeks[wk(x.outgoingDate)].in+=x.amount; });
        p.purchases.filter(x=>inMonth(x.date,month)).forEach(x=>{ weeks[wk(x.date)].out+=x.totalCost; });
        p.medicineLog.filter(x=>inMonth(x.date,month)).forEach(x=>{ weeks[wk(x.date)].out+=x.amount; });
        p.labPayLog.filter(x=>inMonth(x.date,month)).forEach(x=>{ weeks[wk(x.date)].out+=x.amountTaken; });
        p.koriLog.filter(x=>inMonth(x.date,month)).forEach(x=>{ weeks[wk(x.date)].out+=x.amount; });
        return weeks.map(w=>({...w,net:w.in-w.out}));
      },[month,p.milkPayLog,p.slaughtered,p.purchases,p.medicineLog,p.labPayLog,p.koriLog]);

      // ── Pagar Slip ──
      const pagarSlip = useMemo(()=>{
        if (!slipWorker) return null;
        const w = p.labour.find(l=>l.workerName===slipWorker);
        if (!w) return null;
        const draws = p.labPayLog.filter(lp=>lp.workerName===slipWorker && inMonth(lp.date,month));
        const totalDraws = draws.reduce((s,d)=>s+d.amountTaken,0);
        const daysInMonth = 30;
        const dailyRate = Math.round(w.pagarPerMonth / daysInMonth);
        const grossEarned = w.pagarPerMonth;
        const net = grossEarned - totalDraws;
        return {w, draws, totalDraws, grossEarned, dailyRate, net};
      },[slipWorker,month,p.labour,p.labPayLog]);
      
      const shareSlip = () => {
        if (!pagarSlip) return;
        const {w,draws,totalDraws,grossEarned,net} = pagarSlip;
        let msg = `👷 *HALIMA DAIRY FARM — PAGAR SLIP*\n━━━━━━━━━━━━━━━━━━━━━━\n`;
        msg += `👤 Worker: ${w.workerName}\n📍 Shed: ${w.shed}\n📅 Month: ${month}\n`;
        msg += `💵 Monthly Pagar: ₹${moneyFmt(w.pagarPerMonth)}\n`;
        msg += `━━━━━━━━━━━━━━━━━━━━━━\n📋 Draws / Advances:\n`;
        draws.forEach(d=>{ msg+=`  • ${d.date}: ₹${moneyFmt(d.amountTaken)}\n`; });
        msg += `💸 Total Draws: ₹${moneyFmt(totalDraws)}\n`;
        msg += `━━━━━━━━━━━━━━━━━━━━━━\n`;
        msg += net>=0 ? `✅ Balance to Pay: ₹${moneyFmt(net)}` : `⚠️ Advance Taken: ₹${moneyFmt(Math.abs(net))}`;
        msg += `\n📞 Halima Dairy Farm`;
        window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
      };
      
      // ── CSV Export ──
      const exportCSV = () => {
        let csv = 'HALIMA DAIRY FARM — DATA EXPORT\n\n';
        csv += 'BUFFALO HERD\nTag,Khila,Shed,Status,Incoming,Cycle\n';
        p.buffalo.forEach(b=>{ csv+=`${b.tagId},${b.khilaNo},${b.shed},${b.status},${b.incomingDate},${b.lactationCycle||1}\n`; });
        csv += '\nMILK SUPPLY\nDate,Customer,Morning,Evening,Total,Rate,Amount\n';
        p.supply.forEach(s=>{ csv+=`${s.date},${s.customer},${s.mornLit},${s.eveLit},${s.totalLiters},${s.rate},${s.amount}\n`; });
        csv += '\nFEED PURCHASES\nDate,Broker,Item,Weight,Rate,Total\n';
        p.purchases.forEach(x=>{ csv+=`${x.date},${x.broker},${x.item},${x.weight},${x.ratePerKg},${x.totalCost}\n`; });
        csv += '\nMEDICINE LOG\nDate,Item,Vendor,Amount\n';
        p.medicineLog.forEach(m=>{ csv+=`${m.date},${m.item},${m.vendor},${m.amount}\n`; });
        csv += '\nLABOUR PAYMENTS\nDate,Worker,Amount\n';
        p.labPayLog.forEach(l=>{ csv+=`${l.date},${l.workerName},${l.amountTaken}\n`; });
        const blob = new Blob([csv],{type:'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download='halima_farm_'+month+'.csv'; a.click();
        URL.revokeObjectURL(url);
      };
      
      const customers = [...new Set(p.supply.map(s=>s.customer))];
      const workers = p.labour.map(l=>l.workerName);

      const TABS = [
        {k:'PL',icon:'📊',label:'P&L'},
        {k:'CASH',icon:'💵',label:'Cash Flow'},
        {k:'SLIP',icon:'👷',label:'Pagar Slip'},
        {k:'CUST',icon:'🥛',label:'Customers'},
      ];
      
      return (
        <div>
          <PageHeader title="Reports" sub="Analytics & Summary" onTheme={()=>p.setIsDark(!p.isDark)} isDark={p.isDark}
            onClear={async () => {
              p.setBuffalo([]); p.setFaliLog([]); p.setKoriLog([]); p.setBhaisPayLog([]);
              p.setSlaughtered([]); p.setDeadLog([]); p.setTajiLog([]); p.setBakdiLog([]);
              p.setPalakPayLog([]); p.setProduction([]); p.setSupply([]); p.setMilkPayLog([]);
              p.setLabour([]); p.setLabPayLog([]); p.setGodown([]); p.setPurchases([]);
              p.setConsumption([]); p.setDanaPayLog([]); p.setMedicineLog([]);
              await dbClearStores('buffalo','faliLog','koriLog','bhaisPayLog','slaughtered','deadLog',
                'tajiLog','bakdiLog','palakPayLog','production','supply','milkPayLog',
                'labour','labPayLog','godown','purchases','consumption','danaPayLog','medicineLog');
            }}
          />
          <div className="scroll-page" style={{paddingTop:8}}>

            {/* Month picker + CSV export */}
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10,flexWrap:'wrap'}}>
              <select className="farm-select" style={{flex:1,minWidth:120}} value={month} onChange={e=>setMonth(e.target.value)}>
                {months.length===0 && <option value="2026-06">2026-06</option>}
                {months.map(m=><option key={m} value={m}>{m}</option>)}
              </select>
              <button className="back-btn" style={{background:'#0A2010',color:'#34D399',borderColor:'#1A5030',fontSize:10,whiteSpace:'nowrap'}} onClick={exportCSV}>📥 Export CSV</button>
            </div>

            {/* Sub-tabs */}
            <div style={{display:'flex',gap:6,marginBottom:12,overflowX:'auto'}}>
              {TABS.map(t=>(
                <button key={t.k} onClick={()=>setTab(t.k)} style={{padding:'8px 14px',borderRadius:20,border:'none',cursor:'pointer',fontWeight:800,fontSize:11,whiteSpace:'nowrap',
                  background:tab===t.k?'var(--primary)':'var(--bg-card)',color:tab===t.k?'#000':'var(--text-muted)',transition:'all 0.2s'}}>
                  {t.icon} {t.label}
                </button>
              ))}
            </div>

            {/* ── P&L ── */}
            {tab==='PL' && (
              <>
                <SectionDivider label={`Monthly P&L — ${month}`} />
                <div className="form-panel">
                  {[
                    ['🥛 Milk Revenue','₹'+moneyFmt(pl.milkRev),'green-val'],
                    ['🔪 Slaughter Revenue','₹'+moneyFmt(pl.slaRev),'green-val'],
                    ['✅ Total Income','₹'+moneyFmt(pl.totalInc),'green-val',true],
                    ['','',''],
                    ['🌾 Feed (Dana Wala)','₹'+moneyFmt(pl.feedExp),'red-val'],
                    ['💊 Medicine','₹'+moneyFmt(pl.medExp),'red-val'],
                    ['🐃 Kori Purchase','₹'+moneyFmt(pl.koriExp),'red-val'],
                    ['👷 Labour Pagar','₹'+moneyFmt(pl.labExp),'red-val'],
                    ['🏡 Palak (Noora+Tosif)','₹'+moneyFmt(pl.palakExp),'amber-val'],
                    ['🚚 Irshad Freight','₹'+moneyFmt(pl.irshadExp),'amber-val'],
                    ['❌ Total Expense','₹'+moneyFmt(pl.totalExp),'red-val',true],
                    ['','',''],
                    [pl.net>=0?'📈 NET PROFIT':'📉 NET LOSS','₹'+moneyFmt(Math.abs(pl.net)),pl.net>=0?'green-val':'red-val',true],
                  ].map(([k,v,cls,bold],i)=>k?(
                    <div key={i} className="report-row" style={bold?{borderTop:'1px solid var(--border-card)',marginTop:4,paddingTop:8,fontWeight:800}:{}}>
                      <span className="report-key" style={bold?{fontSize:13}:{}}>{k}</span>
                      <span className={`report-val ${cls}`} style={bold?{fontSize:14}:{}}>{v}</span>
                    </div>
                  ):<div key={i} style={{height:6}} />)}
                </div>
              </>
            )}

            {/* ── Cash Flow ── */}
            {tab==='CASH' && (
              <>
                <SectionDivider label={`Cash Flow — ${month}`} />
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {cashFlow.map((w,i)=>{
                    const maxVal = Math.max(...cashFlow.map(x=>Math.max(x.in,x.out)),1);
                    const barIn = Math.round((w.in/maxVal)*100);
                    const barOut = Math.round((w.out/maxVal)*100);
                    return (
                      <div key={i} className="form-panel" style={{marginBottom:0}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                          <span style={{fontWeight:800,fontSize:12,color:'var(--text-main)'}}>{w.label}</span>
                          <span style={{fontWeight:800,fontSize:12,color:w.net>=0?'#10B981':'#EF4444'}}>
                            {w.net>=0?'+':''}{w.net>=0?'':'−'}₹{moneyFmt(Math.abs(w.net))}
                          </span>
                        </div>
                        <div style={{marginBottom:4}}>
                          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text-muted)',marginBottom:2}}>
                            <span>IN ₹{moneyFmt(w.in)}</span>
                          </div>
                          <div style={{height:8,background:'var(--bg-input)',borderRadius:4,overflow:'hidden'}}>
                            <div style={{height:'100%',width:barIn+'%',background:'#10B981',borderRadius:4,transition:'width 0.5s'}} />
                          </div>
                        </div>
                        <div>
                          <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:'var(--text-muted)',marginBottom:2}}>
                            <span>OUT ₹{moneyFmt(w.out)}</span>
                          </div>
                          <div style={{height:8,background:'var(--bg-input)',borderRadius:4,overflow:'hidden'}}>
                            <div style={{height:'100%',width:barOut+'%',background:'#EF4444',borderRadius:4,transition:'width 0.5s'}} />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                  <div className="form-panel">
                    <div className="report-row"><span className="report-key">Total Cash In</span><span className="report-val green-val">₹{moneyFmt(cashFlow.reduce((s,w)=>s+w.in,0))}</span></div>
                    <div className="report-row"><span className="report-key">Total Cash Out</span><span className="report-val red-val">₹{moneyFmt(cashFlow.reduce((s,w)=>s+w.out,0))}</span></div>
                    <div className="report-row" style={{borderTop:'1px solid var(--border-card)',marginTop:4,paddingTop:8}}>
                      <span className="report-key" style={{fontWeight:800}}>Net Cash Flow</span>
                      <span className={`report-val ${cashFlow.reduce((s,w)=>s+w.net,0)>=0?'green-val':'red-val'}`} style={{fontWeight:800,fontSize:14}}>
                        ₹{moneyFmt(Math.abs(cashFlow.reduce((s,w)=>s+w.net,0)))}
                      </span>
                    </div>
                  </div>
                </div>
              </>
            )}

            {/* ── Pagar Slip ── */}
            {tab==='SLIP' && (
              <>
                <SectionDivider label="Monthly Pagar Slip" />
                <div className="form-panel">
                  <div className="input-row"><label className="field-lbl">Select Worker</label>
                    <select className="farm-select" value={slipWorker} onChange={e=>setSlipWorker(e.target.value)}>
                      <option value="">-- Select Worker --</option>
                      {workers.map(w=><option key={w}>{w}</option>)}
                    </select>
                  </div>
                </div>
                {pagarSlip && (
                  <div className="form-panel">
                    <div style={{textAlign:'center',marginBottom:12}}>
                      <div style={{fontSize:18,fontWeight:900,color:'var(--primary)',letterSpacing:1}}>HALIMA DAIRY FARM</div>
                      <div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>PAGAR SLIP — {month}</div>
                    </div>
                    {[
                      ['Worker',pagarSlip.w.workerName],
                      ['Shed',pagarSlip.w.shed],
                      ['Monthly Pagar','₹'+moneyFmt(pagarSlip.grossEarned)],
                    ].map(([k,v],i)=>(
                      <div key={i} className="report-row"><span className="report-key">{k}</span><span className="report-val">{v}</span></div>
                    ))}
                    <div style={{marginTop:8,marginBottom:8}}>
                      <div style={{fontSize:10,color:'var(--text-muted)',fontWeight:700,textTransform:'uppercase',marginBottom:4}}>Draws This Month</div>
                      {pagarSlip.draws.length===0 && <div style={{fontSize:12,color:'var(--text-muted)'}}>No draws recorded</div>}
                      {pagarSlip.draws.map((d,i)=>(
                        <div key={i} className="report-row"><span className="report-key">{d.date}</span><span className="report-val red-val">₹{moneyFmt(d.amountTaken)}</span></div>
                      ))}
                    </div>
                    <div className="report-row"><span className="report-key">Total Draws</span><span className="report-val red-val">₹{moneyFmt(pagarSlip.totalDraws)}</span></div>
                    <div className="report-row" style={{borderTop:'2px solid var(--primary)',marginTop:6,paddingTop:8}}>
                      <span className="report-key" style={{fontWeight:900,fontSize:13}}>{pagarSlip.net>=0?'Balance to Pay':'Advance Taken'}</span>
                      <span className={`report-val ${pagarSlip.net>=0?'green-val':'red-val'}`} style={{fontWeight:900,fontSize:15}}>₹{moneyFmt(Math.abs(pagarSlip.net))}</span>
                    </div>
                    <button className="submit-btn" style={{background:'#25D366',color:'#000',marginTop:14}} onClick={shareSlip}>
                      📲 Share Pagar Slip on WhatsApp
                    </button>
                  </div>
                )}
              </>
            )}

            {/* ── Customer Report ── */}
            {tab==='CUST' && (
              <>
                <SectionDivider label="Customer-wise Milk Report" />
                <div className="input-row" style={{padding:'0 0 10px 0'}}>
                  <label className="field-lbl">Filter Customer</label>
                  <select className="farm-select" value={custFilter} onChange={e=>setCustFilter(e.target.value)}>
                    <option value="">-- All --</option>
                    {customers.map(c=><option key={c}>{c}</option>)}
                  </select>
                </div>
                <div className="tbl-wrap">
                  <table className="data-table" style={{minWidth:0}}>
                    <thead><tr><th>Customer</th><th>Bill</th><th>Paid</th><th>Due</th></tr></thead>
                    <tbody>{(custFilter?[custFilter]:customers).map(c=>{
                      const bills=p.supply.filter(s=>s.customer===c&&inMonth(s.date,month)).reduce((t,x)=>t+x.amount,0);
                      const pays=p.milkPayLog.filter(m=>m.customer===c&&inMonth(m.date,month)).reduce((t,x)=>t+x.amount,0);
                      return(
                        <tr key={c}><td style={{fontWeight:700}}>{c}</td><td>₹{moneyFmt(bills)}</td>
                          <td className="green-val">₹{moneyFmt(pays)}</td>
                          <td className={bills-pays>0?'red-val':'green-val'} style={{fontWeight:800}}>₹{moneyFmt(bills-pays)}</td>
                        </tr>
                      );
                    })}</tbody>
                  </table>
                </div>

                <SectionDivider label="Palak & Irshad (Current)" />
                <div className="form-panel">
                  {[
                    ['Noora ('+p.buffalo.filter(b=>!b.outgoingDate&&b.shed==='Noora').length+' Hd)',p.buffalo.filter(b=>!b.outgoingDate&&b.shed==='Noora').length*p.rates.nooraPerMonth],
                    ['Tosif ('+p.buffalo.filter(b=>!b.outgoingDate&&b.shed==='Tosif').length+' Hd)',p.buffalo.filter(b=>!b.outgoingDate&&b.shed==='Tosif').length*p.rates.tosifPerMonth],
                    ['Irshad — Taji',p.tajiLog.filter(t=>inMonth(t.date,month)).length*p.rates.irshadPerTaji],
                    ['Irshad — Bakdi',p.bakdiLog.filter(t=>inMonth(t.date,month)).length*p.rates.irshadPerBakdi],
                  ].map(([k,v],i)=>(
                    <div key={i} className="report-row"><span className="report-key">{k}</span><span className="report-val amber-val">₹{moneyFmt(v)}</span></div>
                  ))}
                </div>
              </>
            )}

          </div>
        </div>
      );
    }

    // ── RENDER ──
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
