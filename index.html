      --bg-main: #090F0C;
      --text-main: #F3F4F6;
      --text-muted: #9CA3AF;
      --text-muted-dark: #6B7280;
      --primary: #10B981;
      --primary-light: #34D399;
      --primary-btn-text: #06110D;
      --border-color: #1F2937;
      --border-card: #1F3A31;
      --bg-card: linear-gradient(135deg, #111C17 0%, #162420 100%);
      --bg-panel: #111C17;
      --bg-input: #070D0C;
      --border-input: #244238;
      --bg-back-btn: #1A2E28;
      --text-back-btn: #CBD5E1;
      --bg-table-wrapper: #0C1412;
      --bg-th: #142420;
      --border-table-row: #162924;
      --text-table: #E5E7EB;
      --bg-alert-success: #092419;
      --text-alert-success: #A7F3D0;
    }
    body.light-theme {
      --bg-main: #F9FAFB;
      --text-main: #111827; 
      --text-muted: #4B5563;
      --text-muted-dark: #9CA3AF; 
      --primary: #059669; 
      --primary-light: #047857;
      --primary-btn-text: #FFFFFF; 
      --border-color: #E5E7EB; 
      --border-card: #D1FAE5;
      --bg-card: linear-gradient(135deg, #FFFFFF 0%, #F3F4F6 100%); 
      --bg-panel: #FFFFFF;
      --bg-input: #F3F4F6; 
      --border-input: #D1D5DB; 
      --bg-back-btn: #EEF2F6;
      --text-back-btn: #1F2937; 
      --bg-table-wrapper: #FFFFFF; 
      --bg-th: #F3F4F6;
      --border-table-row: #E5E7EB; 
      --text-table: #374151;
      --bg-alert-success: #E6F4EA; 
      --text-alert-success: #065F46;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body { 
      width:100%; height:100%; background-color:var(--bg-main); color:var(--text-main);
      font-family:'Plus Jakarta Sans',-apple-system,sans-serif; overflow-x:hidden;
      -webkit-overflow-scrolling:touch; transition:background-color 0.2s,color 0.2s; 
    }
    #root { padding-bottom: 80px; }

    /* ── HEADER ── */
    .app-header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px 0 16px; margin-bottom:4px; }
    .farm-title { color:var(--primary); font-size:20px; font-weight:800; text-transform:uppercase; letter-spacing:0.3px; }
    .farm-sub { color:var(--text-muted-dark); font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
    .theme-btn { 
      background:var(--bg-panel); border:1px solid var(--border-card); color:var(--primary);
      padding:7px 11px; border-radius:8px; font-size:11px; font-weight:700; cursor:pointer;
      display:flex; align-items:center; gap:5px; text-transform:uppercase; letter-spacing:0.5px;
    }

    /* ── BOTTOM NAV ── */
    .bottom-nav { 
      position:fixed; bottom:0; left:0; right:0; background:var(--bg-panel);
      border-top:1px solid var(--border-card); display:flex; justify-content:space-around;
      align-items:center; padding:6px 2px 14px 2px; z-index:1000; 
    }
    .nav-item { display:flex; flex-direction:column; align-items:center; cursor:pointer; padding:4px 6px; border-radius:8px; min-width:44px; transition:0.15s; }
    .nav-item.active .nav-icon { color:var(--primary); }
    .nav-item.active .nav-label { color:var(--primary); }
    .nav-icon { font-size:20px; margin-bottom:1px; color:var(--text-muted-dark); }
    .nav-label { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted-dark); white-space:nowrap; }

    /* ── SECTION DIVIDER ── */
    .section-divider { 
      font-size:11px; font-weight:800; text-transform:uppercase; color:var(--primary);
      letter-spacing:0.8px; margin:20px 0 10px 0; padding-bottom:6px; border-bottom:1px solid var(--border-color); 
    }

    /* ── DASHBOARD GRID ── */
    .dash-grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px; }
    .dash-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
    .d-card { 
      background:var(--bg-card); border:1px solid var(--border-card); border-radius:10px;
      padding:10px 12px; min-height:62px; display:flex; flex-direction:row; align-items:center;
      justify-content:space-between; cursor:pointer; transition:transform 0.15s,border-color 0.15s;
    }
    .d-card:active { transform:scale(0.96); border-color:var(--primary); }
    .d-card-left { display:flex; flex-direction:column; justify-content:center; }
    .d-card-icon { font-size:15px; color:var(--text-muted); }
    .d-label { color:var(--text-muted); font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:2px; }
    .d-val { color:var(--text-main); font-size:18px; font-weight:800; letter-spacing:-0.4px; }
    .d-val-sm { color:var(--text-main); font-size:14px; font-weight:800; }
    .d-unit { font-size:9px; color:var(--text-muted-dark); font-weight:700; text-transform:uppercase; margin-left:2px; }
    .d-curr { font-size:12px; font-weight:700; color:var(--primary-light); margin-right:1px; }

    /* ── FORM PANEL ── */
    .page-wrap { padding:0 16px 20px 16px; }
    .form-panel { background:var(--bg-panel); border-radius:10px; padding:14px; border:1px solid var(--border-card); margin-bottom:14px; }
    .panel-header { 
      color:var(--primary); font-size:12px; font-weight:700; margin:0 0 12px 0;
      text-transform:uppercase; border-bottom:1px solid var(--border-card); padding-bottom:6px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .grid-2 { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    .input-row { display:flex; flex-direction:column; margin-bottom:10px; }
    .field-lbl { color:var(--text-muted); font-size:11px; font-weight:600; margin-bottom:4px; text-transform:uppercase; }
    .farm-input { 
      background:var(--bg-input); border:1px solid var(--border-input); border-radius:6px;
      color:var(--text-main); padding:8px 10px; font-size:13px; font-family:inherit; width:100%; height:37px; 
    }
    .farm-input:focus { border-color:var(--primary); outline:none; }
    .farm-input:disabled { opacity:0.6; }
    .farm-select { 
      background:var(--bg-input); border:1px solid var(--border-input); border-radius:6px;
      color:var(--text-main); padding:8px 10px; font-size:13px; font-family:inherit; width:100%; height:37px; 
    }
    .farm-select:focus { border-color:var(--primary); outline:none; }
    .submit-btn { 
      background:var(--primary); color:var(--primary-btn-text); border:none; padding:11px;
      border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; width:100%;
      text-transform:uppercase; margin-top:6px; letter-spacing:0.5px;
    }
    .submit-btn:active { opacity:0.85; }
    .back-btn { 
      background:var(--bg-back-btn); color:var(--text-back-btn); border:1px solid var(--border-input);
      padding:6px 12px; border-radius:4px; font-size:10px; font-weight:700; cursor:pointer; text-transform:uppercase; 
    }

    /* ── TABLE ── */
    .tbl-wrap { 
      width:100%; overflow-x:auto; background:var(--bg-table-wrapper); border:1px solid var(--border-card);
      border-radius:8px; margin-top:10px; 
    }
    .data-table { width:100%; border-collapse:collapse; text-align:left; font-size:12px; min-width:480px; }
    .data-table th { 
      background:var(--bg-th); color:var(--primary-light); padding:9px 8px; font-weight:700;
      text-transform:uppercase; font-size:10px; letter-spacing:0.4px; border-bottom:1px solid var(--border-card);
    }
    .data-table td { padding:9px 8px; border-bottom:1px solid var(--border-table-row); color:var(--text-table); vertical-align:middle; }
    .data-table tr:last-child td { border-bottom:none; }
    .del-btn { 
      background:#3B1818; color:#FCA5A5; border:1px solid #5C2525; padding:3px 7px;
      border-radius:4px; font-size:10px; font-weight:700; cursor:pointer; text-transform:uppercase; 
    }
    .del-btn:active { background:#5C2525; }

    /* ── ALERTS ── */
    .alert-box { border-radius:6px; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .alert-danger { background:#2A1414; border-left:4px solid #EF4444; }
    .alert-warn { background:#2A1F0A; border-left:4px solid #F59E0B; }
    .alert-ok { background:var(--bg-alert-success); border-left:4px solid var(--primary); }
    .alert-txt { font-size:12px; font-weight:600; color:#FCA5A5; line-height:1.4; }
    .alert-txt-warn { font-size:12px; font-weight:600; color:#FCD34D; line-height:1.4; }
    .alert-txt-ok { font-size:12px; font-weight:600; color:var(--text-alert-success); line-height:1.4; }
    .alert-badge { font-size:9px; font-weight:800; padding:3px 7px; border-radius:10px; text-transform:uppercase; flex-shrink:0; }

    /* ── OVERLAY MODAL ── */
    .overlay { 
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(5,10,8,0.88); display:flex; align-items:center; justify-content:center;
      padding:16px; z-index:2000; 
    }
    .modal-box { 
      background:var(--bg-panel); border:1px solid var(--border-card); border-radius:12px;
      padding:20px; width:100%; max-width:460px; max-height:85vh; overflow-y:auto; 
    }
    .modal-title { 
      margin:0 0 14px 0; color:var(--primary); text-transform:uppercase; font-size:14px;
      font-weight:800; border-bottom:1px solid var(--border-card); padding-bottom:6px;
    }

    /* ── BADGE ── */
    .badge { display:inline-block; font-size:9px; font-weight:800; padding:2px 7px; border-radius:10px; text-transform:uppercase; }
    .badge-green { background:#064E3B; color:#6EE7B7; }
    .badge-red { background:#7F1D1D; color:#FCA5A5; }
    .badge-amber { background:#78350F; color:#FCD34D; }
    .badge-blue { background:#1E3A5F; color:#93C5FD; }
    .badge-purple { background:#3B1F6B; color:#C4B5FD; }
    .badge-gray { background:#374151; color:#9CA3AF; }

    /* ── STATUS TAG ── */
    .status-tag { font-size:10px; font-weight:800; padding:3px 8px; border-radius:12px; text-transform:uppercase; }

    /* ── DELIVERY MATRIX ── */
    .matrix-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px; }
    .matrix-cell { background:var(--bg-input); border:1px solid var(--border-card); border-radius:6px; padding:6px 4px; text-align:center; }
    .matrix-month { font-size:9px; font-weight:800; color:var(--text-muted-dark); text-transform:uppercase; }
    .matrix-count { font-size:14px; font-weight:800; color:var(--primary); }

    /* ── QUICK ACTION CARDS ── */
    .action-card { border-radius:10px; padding:12px 14px; min-height:60px; display:flex; flex-direction:column; justify-content:center; cursor:pointer; transition:transform 0.15s; }
    .action-card:active { transform:scale(0.96); }
    .ac-label { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:3px; }
    .ac-title { font-size:14px; font-weight:800; color:var(--text-main); }

    /* ── PAGE SCROLL CONTAINER ── */
    .scroll-page { padding:0 16px 24px 16px; min-height:100vh; background:var(--bg-main); }

    /* ── REPORT ROWS ── */
    .report-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-table-row); font-size:13px; }
    .report-row:last-child { border-bottom:none; }
    .report-key { color:var(--text-muted); font-weight:600; }
    .report-val { font-weight:800; color:var(--text-main); }

    .green-val { color:var(--primary); }
    .red-val { color:#EF4444; }
    .amber-val { color:#F59E0B; }
    .blue-val { color:#60A5FA; }

    /* inline auto-calc hint */
    .auto-hint { font-size:11px; color:var(--primary); font-weight:700; padding-top:6px; }
  </style>
</head>

    const INIT_RATES = {

      irshadPerBakdi: 1800
    };

    // ─────────────────────────────────────────────
    //  INDEXEDDB DATABASE LAYER
    // ─────────────────────────────────────────────
    const DB_NAME    = 'HalimaFarmDB';
    const DB_VERSION = 1;
    const STORES = [
      'rates','buffalo','faliLog','koriLog','bhaisPayLog','slaughtered','deadLog',
      'tajiLog','bakdiLog','irshadPayLog','palakPayLog','production','supply',
      'milkPayLog','labour','labPayLog','godown','purchases','consumption',
      'danaPayLog','medicineLog'
    ];

    // Open (or create) the database
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); });
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror   = e => reject(e.target.error);
      });
    }

    // Read one key from a store (returns value or null)
    async function dbGet(store, key='data') {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => resolve(req.result ?? null);
        req.onerror   = () => reject(req.error);
      });
    }

    // Write one value to a store
    async function dbPut(store, value, key='data') {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).put(value, key);
        req.onsuccess = () => resolve();
        req.onerror   = () => reject(req.error);
      });
    }

    // Clear all data in one store
    async function dbClear(store) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx  = db.transaction(store, 'readwrite');
        const req = tx.objectStore(store).clear();
        req.onsuccess = () => resolve();
        req.onerror   = () => reject(req.error);
      });
    }

    // Helper: clear multiple DB stores (used in clear buttons)
    async function dbClearStores(...stores) {
      await Promise.all(stores.map(s => dbClear(s)));
    }

    // Load ALL stores at once → returns object keyed by store name
    async function dbLoadAll() {
      const result = {};
      await Promise.all(STORES.map(async s => { result[s] = await dbGet(s); }));
      return result;
    }

    // Save ALL stores at once from a data snapshot
    async function dbSaveAll(data) {
      await Promise.all(STORES.map(s => data[s] !== undefined ? dbPut(s, data[s]) : Promise.resolve()));
    }
    
    // Debounce helper — avoids hammering DB on rapid state changes
    function debounce(fn, ms) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
    }
    const debouncedSave = debounce(dbSaveAll, 600);

    // ─────────────────────────────────────────────
    //  MAIN APP
    // ─────────────────────────────────────────────
    function App() {
      const [tab,      setTab]      = useState('dashboard');
      const [isDark,   setIsDark]   = useState(true);
      const [dbReady,  setDbReady]  = useState(false);

      // show splash until DB loaded
      useEffect(() => {
        isDark ? document.body.classList.remove('light-theme') : document.body.classList.add('light-theme');
      }, [isDark]);

      // ── Global Data State (empty defaults — filled from DB on mount) ──
      const [rates,        setRates]        = useState(INIT_RATES);
      const [buffalo,      setBuffalo]      = useState([]);
      const [faliLog,      setFaliLog]      = useState([]);
      const [koriLog,      setKoriLog]      = useState([]);
      const [bhaisPayLog,  setBhaisPayLog]  = useState([]);
      const [slaughtered,  setSlaughtered]  = useState([]);
      const [deadLog,      setDeadLog]      = useState([]);
      const [tajiLog,      setTajiLog]      = useState([]);
      const [bakdiLog,     setBakdiLog]     = useState([]);
      const [irshadPayLog, setIrshadPayLog] = useState([]);
      const [palakPayLog,  setPalakPayLog]  = useState([]);
      const [production,   setProduction]   = useState([]);
      const [supply,       setSupply]       = useState([]);
      const [milkPayLog,   setMilkPayLog]   = useState([]);
      const [labour,       setLabour]       = useState([]);
      const [labPayLog,    setLabPayLog]    = useState([]);
      const [godown,       setGodown]       = useState([]);
      const [purchases,    setPurchases]    = useState([]);
      const [consumption,  setConsumption]  = useState([]);
      const [danaPayLog,   setDanaPayLog]   = useState([]);
      const [medicineLog,  setMedicineLog]  = useState([]);

      // ── Load from IndexedDB on first mount ──
      useEffect(() => {
        dbLoadAll().then(saved => {
          if (saved.rates)        setRates(saved.rates);
          // For arrays: use saved data if exists, else seed with INIT_ data
          setBuffalo     (saved.buffalo      ?? INIT_BUFFALO);
          setFaliLog     (saved.faliLog      ?? INIT_FALI);
          setKoriLog     (saved.koriLog      ?? INIT_KORI);
          setBhaisPayLog (saved.bhaisPayLog  ?? INIT_BHAIS_PAY);
          setSlaughtered (saved.slaughtered  ?? INIT_SLAUGHTERED);
          setDeadLog     (saved.deadLog      ?? INIT_DEAD);
          setTajiLog     (saved.tajiLog      ?? INIT_TAJI);
          setBakdiLog    (saved.bakdiLog     ?? INIT_BAKDI);
          setIrshadPayLog(saved.irshadPayLog ?? INIT_IRSHAD_PAY);
          setPalakPayLog (saved.palakPayLog  ?? INIT_PALAK_PAY);
          setProduction  (saved.production   ?? INIT_PRODUCTION);
          setSupply      (saved.supply       ?? INIT_SUPPLY);
          setMilkPayLog  (saved.milkPayLog   ?? INIT_MILK_PAY);
          setLabour      (saved.labour       ?? INIT_LABOUR);
          setLabPayLog   (saved.labPayLog    ?? INIT_LAB_PAY);
          setGodown      (saved.godown       ?? INIT_GODOWN);
          setPurchases   (saved.purchases    ?? INIT_PURCHASES);
          setConsumption (saved.consumption  ?? INIT_CONSUMPTION);
          setDanaPayLog  (saved.danaPayLog   ?? INIT_DANA_PAY);
          setMedicineLog (saved.medicineLog  ?? INIT_MEDICINE);
          setDbReady(true);
        }).catch(() => {
          // IndexedDB failed (private browsing?) — fall through with seed data
          setBuffalo(INIT_BUFFALO); setFaliLog(INIT_FALI); setKoriLog(INIT_KORI);
          setBhaisPayLog(INIT_BHAIS_PAY); setSlaughtered(INIT_SLAUGHTERED);
          setDeadLog(INIT_DEAD); setTajiLog(INIT_TAJI); setBakdiLog(INIT_BAKDI);
          setIrshadPayLog(INIT_IRSHAD_PAY); setPalakPayLog(INIT_PALAK_PAY);
          setProduction(INIT_PRODUCTION); setSupply(INIT_SUPPLY); setMilkPayLog(INIT_MILK_PAY);
          setLabour(INIT_LABOUR); setLabPayLog(INIT_LAB_PAY); setGodown(INIT_GODOWN);
          setPurchases(INIT_PURCHASES); setConsumption(INIT_CONSUMPTION);
          setDanaPayLog(INIT_DANA_PAY); setMedicineLog(INIT_MEDICINE);
          setDbReady(true);
        });
      }, []);

      // ── Auto-save to IndexedDB on every state change (debounced 600ms) ──
      useEffect(() => {
        if (!dbReady) return;
        debouncedSave({rates,buffalo,faliLog,koriLog,bhaisPayLog,slaughtered,deadLog,tajiLog,
          bakdiLog,irshadPayLog,palakPayLog,production,supply,milkPayLog,labour,labPayLog,
          godown,purchases,consumption,danaPayLog,medicineLog});
      },[dbReady,rates,buffalo,faliLog,koriLog,bhaisPayLog,slaughtered,deadLog,tajiLog,
         bakdiLog,irshadPayLog,palakPayLog,production,supply,milkPayLog,labour,labPayLog,
         godown,purchases,consumption,danaPayLog,medicineLog]);

      // ── Backup Export (reads live state, not DB) ──
      const exportBackup = () => {
        const data = JSON.stringify({rates,buffalo,faliLog,koriLog,bhaisPayLog,slaughtered,
          deadLog,tajiLog,bakdiLog,irshadPayLog,palakPayLog,production,supply,milkPayLog,
          labour,labPayLog,godown,purchases,consumption,danaPayLog,medicineLog},null,2);
        const blob = new Blob([data],{type:'application/json'});
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = 'halima_farm_backup_'+new Date().toISOString().split('T')[0]+'.json';
        a.click(); URL.revokeObjectURL(url);
      };

      // ── Backup Import (restores all stores) ──
      const importBackup = () => {
        const input = document.createElement('input');
        input.type='file'; input.accept='.json';
        input.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async ev => {
            try {
              const d = JSON.parse(ev.target.result);
              // Write to DB first, then update state
              await dbSaveAll(d);
              if(d.rates)        setRates(d.rates);
              if(d.buffalo)      setBuffalo(d.buffalo);
              if(d.faliLog)      setFaliLog(d.faliLog);
              if(d.koriLog)      setKoriLog(d.koriLog);
              if(d.bhaisPayLog)  setBhaisPayLog(d.bhaisPayLog);
              if(d.slaughtered)  setSlaughtered(d.slaughtered);
              if(d.deadLog)      setDeadLog(d.deadLog);
              if(d.tajiLog)      setTajiLog(d.tajiLog);
              if(d.bakdiLog)     setBakdiLog(d.bakdiLog);
              if(d.palakPayLog)  setPalakPayLog(d.palakPayLog);
              if(d.production)   setProduction(d.production);
              if(d.supply)       setSupply(d.supply);
              if(d.milkPayLog)   setMilkPayLog(d.milkPayLog);
              if(d.labour)       setLabour(d.labour);
              if(d.labPayLog)    setLabPayLog(d.labPayLog);
              if(d.godown)       setGodown(d.godown);
              if(d.purchases)    setPurchases(d.purchases);
              if(d.consumption)  setConsumption(d.consumption);
              if(d.danaPayLog)   setDanaPayLog(d.danaPayLog);
              if(d.medicineLog)  setMedicineLog(d.medicineLog);
              alert('✅ Backup restored successfully!');
            } catch(err) { alert('❌ Invalid backup file.');
            }
          };
          reader.readAsText(file);
        };
        input.click();
      };

      // ── Loading splash — shown while DB reads ──
      if (!dbReady) return (
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
          height:'100vh',background:'var(--bg-main)',gap:16}}>
          <div style={{fontSize:48}}>🐃</div>
          <div style={{color:'var(--primary)',fontWeight:900,fontSize:18,letterSpacing:1}}>HALIMA DAIRY FARM</div>
          <div style={{color:'var(--text-muted)',fontSize:12}}>Loading database…</div>
          <div style={{width:48,height:4,background:'var(--bg-card)',borderRadius:2,overflow:'hidden',marginTop:8}}>
            <div style={{width:'60%',height:'100%',background:'var(--primary)',borderRadius:2,animation:'pulse 1s infinite'}} />
          </div>
        </div>
      );

      const sharedProps = {
        tab, setTab, isDark, setIsDark, rates, setRates,
        buffalo, setBuffalo, faliLog, setFaliLog,
        koriLog, setKoriLog, bhaisPayLog, setBhaisPayLog,
        slaughtered, setSlaughtered, deadLog, setDeadLog,
        tajiLog, setTajiLog, bakdiLog, setBakdiLog,
        irshadPayLog, setIrshadPayLog, palakPayLog, setPalakPayLog,
        production, setProduction, supply, setSupply,
        milkPayLog, setMilkPayLog,
        labour, setLabour, labPayLog, setLabPayLog,
        godown, setGodown, purchases, setPurchases,
        consumption, setConsumption, danaPayLog, setDanaPayLog,
        medicineLog, setMedicineLog,
        exportBackup, importBackup
      };

      return (
        <div>
          {/* Backup Bar */}
          <div style={{display:'flex',gap:6,padding:'6px 16px 0',justifyContent:'flex-end'}}>
            <button className="back-btn" style={{background:'#0F3A2E',color:'#34D399',borderColor:'#1F5A45',fontSize:9}} onClick={exportBackup}>💾 Export</button>
            <button className="back-btn" style={{background:'#1A1A0A',color:'#FCD34D',borderColor:'#4A4A10',fontSize:9}} onClick={importBackup}>📂 Restore</button>
          </div>
          {tab === 'dashboard' && <DashboardBook {...sharedProps} />}
          {tab === 'herd' && <HerdBook {...sharedProps} />}
          {tab === 'milk' && <MilkBook {...sharedProps} />}
          {tab === 'stock' && <StockBook {...sharedProps} />}
          {tab === 'labour' && <LabourBook {...sharedProps} />}
          {tab === 'accounts' && <AccountsBook {...sharedProps} />}
          {tab === 'reports' && <ReportsBook {...sharedProps} />}
          <BottomNav tab={tab} setTab={setTab} />
        </div>
      );
    }

    // ─────────────────────────────────────────────
    //  BOTTOM NAV
    // ─────────────────────────────────────────────
    function BottomNav({ tab, setTab }) {
      const items = [
        { key:'dashboard', icon:'📊', label:'Dashboard' },
        { key:'herd',      icon:'🐃', label:'Herd' },
        { key:'milk',      icon:'🥛', label:'Milk' },
        { key:'stock',     icon:'🌾', label:'Stock' },
        { key:'labour',    icon:'👷', label:'Labour' },
        { key:'accounts',  icon:'💼', label:'Accounts' },
        { key:'reports',   icon:'📋', label:'Reports' }
      ];
      return (
        <div className="bottom-nav">
          {items.map(it => (
            <div key={it.key} className={`nav-item${tab===it.key?' active':''}`} onClick={()=>setTab(it.key)}>
              <span className="nav-icon">{it.icon}</span>
              <span className="nav-label">{it.label}</span>
            </div>
          ))}
        </div>
      );
    }

    // ─────────────────────────────────────────────
    //  HELPERS
    // ─────────────────────────────────────────────
    function daysBetween(d1, d2) {
      const ms = new Date(d2) - new Date(d1);
      return ms > 0 ? Math.floor(ms / 86400000) : 0;
    }
    function PageHeader({ title, sub, onTheme, isDark, onClear }) {
      const [confirmClear, setConfirmClear] = useState(false);
      // Handle clear asynchronously
      const handleClear = async () => {
        if (onClear) await onClear();
        setConfirmClear(false);
      };
      return (
        <div className="app-header">
          <div>
            <div className="farm-title">{title}</div>
            <div className="farm-sub">{sub}</div>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            {onClear && !confirmClear && (
              <button className="back-btn" style={{background:'#2A1414',color:'#FCA5A5',borderColor:'#7F1D1D',fontSize:10}} onClick={()=>setConfirmClear(true)}>🗑️ Clear</button>
            )}
            {onClear && confirmClear && (
              <button className="back-btn" style={{background:'#7F1D1D',color:'#fff',borderColor:'#EF4444',fontSize:10,fontWeight:800}} onClick={handleClear}>⚠️ Confirm</button>
            )}
            {onClear && confirmClear && (
              <button className="back-btn" style={{fontSize:10}} onClick={()=>setConfirmClear(false)}>✕</button>
            )}
            <button className="theme-btn" onClick={onTheme}>{isDark ? '☀️' : '🌙'}</button>
          </div>
        </div>
      );
    }
    function SectionDivider({ label }) {
      return <div className="section-divider">{label}</div>;
    }
    function BackBtn({ onClick }) {
      return <button className="back-btn" onClick={onClick}>◀ Back</button>;
    }
    function DelBtn({ onClick }) {
      return <button className="del-btn" onClick={onClick}>Delete</button>;
    }
    function moneyFmt(n) { return (n||0).toLocaleString('en-IN'); }

    function DashboardBook(p) {
      const [detail, setDetail] = useState(null);
      const [showRates, setShowRates] = useState(false);
      const [rateForm, setRateForm] = useState(p.rates);

      // ── Compute herd counts ──
      const activeBuffalo = p.buffalo.filter(b => !['Dead','Slaughtered'].includes(b.status) && !b.outgoingDate);
      const shedA = activeBuffalo.filter(b => b.shed === 'Shed A').length;
      const shedB = activeBuffalo.filter(b => b.shed === 'Shed B').length;
      // Yard counts are represented in herd as Yard A / Yard B shed values
      const yardA = activeBuffalo.filter(b => b.shed === 'Yard A').length;
      const yardB = activeBuffalo.filter(b => b.shed === 'Yard B').length;
      const nooraCount = activeBuffalo.filter(b => b.shed === 'Noora').length;
      const tosifCount = activeBuffalo.filter(b => b.shed === 'Tosif').length;
      const totalAnimals = shedA + shedB + yardA + yardB + nooraCount + tosifCount;

      const tajiCame = p.tajiLog.length;
      const koriCame = p.koriLog.reduce((s,k)=>s+k.animals,0);
      const deadCount = p.deadLog.length;
      const slaCount = p.slaughtered.length;

      // ── Milk averages ──
      const totalMilkLiters = p.production.reduce((s,d)=>s+(d.shedAMorn||0)+(d.shedAEve||0)+(d.shedBMorn||0)+(d.shedBEve||0),0);
      const milkDays = p.production.length || 1;
      const avgMilkPerDay = Math.round(totalMilkLiters / milkDays);
      const milkRate = p.supply.length > 0 ? Math.round(p.supply.reduce((s,x)=>s+(x.amount/x.totalLiters),0)/p.supply.length) : 0;
      const avgMilkRevenuePerDay = avgMilkPerDay * milkRate;

      // feed avg
      const feedTotal = p.purchases.reduce((s,x)=>s+x.totalCost,0);
      const feedWeightKg = p.purchases.reduce((s,x)=>s+x.weight,0);
      const avgFeedCostPerKg = feedWeightKg > 0 ? Math.round(feedTotal/feedWeightKg*100)/100 : 0;
      const feedConsumedKg = p.consumption ? p.consumption.reduce((s,x)=>s+(x.kgUsed||0),0) : 0;
      const avgFeedPerDay = feedConsumedKg > 0 ? Math.round(feedConsumedKg / milkDays) : 0;

      // labour avg
      const activeLabour = p.labour.filter(l=>!l.leavingDate);
      const labourTotal = activeLabour.reduce((s,w)=>s+w.pagarPerMonth,0);

      // taji avg cost — reuse nooraCount/tosifCount from above
      const nooraBillAvg = nooraCount * p.rates.nooraPerMonth;
      const tosifBillAvg = tosifCount * p.rates.tosifPerMonth;
      const irshadTajiBill = p.tajiLog.length * p.rates.irshadPerTaji;
      const totalTajiCost = nooraBillAvg + tosifBillAvg + irshadTajiBill;
      const avgTajiRate = tajiCame > 0 ? Math.round(totalTajiCost / tajiCame) : 0;

      // kori avg
      const koriTotal = p.koriLog.reduce((s,k)=>s+k.amount,0);
      const tajiTotal2 = p.tajiLog.length * p.rates.irshadPerTaji;
      const totalKoriTaji = koriTotal + tajiTotal2;
      const koriTajiCount = koriCame + tajiCame;
      const avgPerBuffalo = koriTajiCount > 0 ? Math.round(totalKoriTaji / koriTajiCount) : 0;

      // slaughter avg
      const slaTotal = p.slaughtered.reduce((s,sl)=>s+sl.amount,0);
      const avgSla = slaCount > 0 ? Math.round(slaTotal / slaCount) : 0;

      // medicine avg
      const medTotal = p.medicineLog.reduce((s,m)=>s+m.amount,0);
      const avgMedPerBuffalo = totalAnimals > 0 ? Math.round(medTotal / totalAnimals) : 0;

      const cards = [
        { label:'Avg Milk/Buffalo (Daily)', val:totalAnimals>0?Math.round(avgMilkPerDay/totalAnimals*10)/10:'0', unit:'L', color:'#10B981', detail:'AVG_MILK', sub:'Daily per head' },
        { label:'Avg Feed/Buffalo (Daily)', val:avgFeedPerDay>0&&totalAnimals>0?Math.round(avgFeedPerDay/totalAnimals):'900', unit:'kg', color:'#3B82F6', detail:'AVG_FEED', sub:'Per head/day' },
        { label:'Avg Feed Cost/kg', val:'₹'+avgFeedCostPerKg, unit:'', color:'#6366F1', detail:'AVG_FEED_COST', sub:'Dana Rate', noFormat:true },
        { label:'Avg Milk Rate/Liter', val:'₹'+milkRate, unit:'', color:'#F59E0B', detail:'AVG_MILK_RATE', sub:'Per liter', noFormat:true },
        { label:'Avg Daily Revenue', val:'₹'+moneyFmt(avgMilkRevenuePerDay), unit:'', color:'#EF4444', detail:'AVG_REVENUE', sub:'Milk/day', noFormat:true },
        { label:'Avg Labour/Animal', val:totalAnimals>0?'₹'+moneyFmt(Math.round(labourTotal/totalAnimals)):'—', unit:'', color:'#14B8A6', detail:'AVG_LABOUR', sub:'/Month per head', noFormat:true },
        { label:'Avg Taji Animal Rate', val:'₹'+moneyFmt(avgTajiRate), unit:'', color:'#8B5CF6', detail:'AVG_TAJI', sub:'Palak+Freight', noFormat:true },
        { label:'Avg Kori Rate/Animal', val:'₹'+moneyFmt(koriCame>0?Math.round(koriTotal/koriCame):0), unit:'', color:'#EC4899', detail:'AVG_KORI', sub:'Per head purchased', noFormat:true },
        { label:'Avg Slaughter Rate', val:'₹'+moneyFmt(avgSla), unit:'', color:'#F97316', detail:'AVG_SLA', sub:'Per animal', noFormat:true },
        { label:'Total Dead', val:deadCount, unit:'Hd', color:'#6B7280', detail:'DEAD', sub:'All time' },
        { label:'Animals Came (Total)', val:koriCame+tajiCame, unit:'Hd', color:'#DC2626', detail:'ANIMALS_CAME', sub:'Kori+Taji' },
        { label:'Avg Cost/Buffalo', val:'₹'+moneyFmt(avgPerBuffalo), unit:'', color:'#A78BFA', detail:'AVG_BUF', sub:'Kori+Taji combined', noFormat:true },
        { label:'Avg Medicine/Buffalo', val:'₹'+moneyFmt(avgMedPerBuffalo), unit:'', color:'#2DD4BF', detail:'AVG_MED', sub:'All medicine', noFormat:true },
        { label:'Total Labour Pagar', val:'₹'+moneyFmt(labourTotal), unit:'', color:'#F87171', detail:'AVG_PAGAR', sub:'/Month total', noFormat:true },
      ];

      const renderDetail = () => {
        if (!detail) return null;
        let rows = [];
        let title = '';
        if (detail === 'AVG_MILK') {
          title = 'Milk Production Breakdown';
          rows = p.production.slice(0,10).map(pr=>({k:pr.date,v:(pr.shedAMorn+pr.shedAEve+pr.shedBMorn+pr.shedBEve)+'L total'}));
          rows.unshift({k:'Avg/Day Total',v:avgMilkPerDay+'L'},{k:'Animals',v:totalAnimals+' Hd'},{k:'Avg/Buffalo/Day',v:(totalAnimals>0?Math.round(avgMilkPerDay/totalAnimals*10)/10:0)+'L'});
        } else if (detail === 'AVG_FEED') {
          title = 'Feed Consumption (Avg/Buffalo)';
          rows = [{k:'Total KG Consumed',v:feedConsumedKg+'kg'},{k:'Days Tracked',v:milkDays+'d'},{k:'Avg KG/Day',v:avgFeedPerDay+'kg'},{k:'Animals',v:totalAnimals+' Hd'},{k:'Avg/Buffalo/Day',v:(totalAnimals>0?Math.round(avgFeedPerDay/totalAnimals):900)+'kg'}];
        } else if (detail === 'AVG_FEED_COST') {
          title = 'Feed Cost per KG (Dana Rate)';
          rows = p.purchases.map(pu=>({k:pu.broker+' • '+pu.date,v:'₹'+pu.ratePerKg+'/kg — '+pu.weight+'kg'}));
          rows.unshift({k:'Overall Avg Rate',v:'₹'+avgFeedCostPerKg+'/kg'});
        } else if (detail === 'AVG_MILK_RATE') {
          title = 'Milk Rate per Customer';
          const cm = {}; p.supply.forEach(s=>{if(!cm[s.customer])cm[s.customer]=[];cm[s.customer].push(s.rate);});
          rows = Object.entries(cm).map(([c,rates])=>({k:c,v:'₹'+Math.round(rates.reduce((a,b)=>a+b,0)/rates.length)+'/L avg'}));
          rows.unshift({k:'Overall Avg Rate',v:'₹'+milkRate+'/L'});
        } else if (detail === 'AVG_REVENUE') {
          title = 'Daily Milk Revenue';
          rows = [{k:'Avg Daily Revenue',v:'₹'+moneyFmt(avgMilkRevenuePerDay)},{k:'Avg Liters/Day',v:avgMilkPerDay+'L'},{k:'Avg Rate',v:'₹'+milkRate+'/L'},{k:'Total Revenue',v:'₹'+moneyFmt(p.supply.reduce((s,x)=>s+x.amount,0))}];
        } else if (detail === 'AVG_LABOUR') {
          title = 'Labour Cost per Animal';
          const activeLabour = p.labour.filter(l=>!l.leavingDate);
          rows = activeLabour.map(w=>({k:w.workerName,v:'₹'+moneyFmt(w.pagarPerMonth)+'/mo • '+w.shed}));
          rows.push({k:'Total Pagar/Mo',v:'₹'+moneyFmt(labourTotal)},{k:'Animals',v:totalAnimals+' Hd'},{k:'Avg/Animal',v:'₹'+moneyFmt(totalAnimals>0?Math.round(labourTotal/totalAnimals):0)});
        } else if (detail === 'AVG_TAJI') {
          title = 'Avg Taji Cost Calculation';
          rows = [
            {k:'Noora Buffalo',v:nooraCount+' Hd'},{k:'Noora Monthly Bill',v:'₹'+moneyFmt(nooraBillAvg)},
            {k:'Tosif Buffalo',v:tosifCount+' Hd'},{k:'Tosif Monthly Bill',v:'₹'+moneyFmt(tosifBillAvg)},
            {k:'Irshad Freight/Taji',v:'₹'+moneyFmt(irshadTajiBill)},{k:'Total Taji Cost',v:'₹'+moneyFmt(totalTajiCost)},
            {k:'Taji Count',v:tajiCame+' Hd'},{k:'Avg Per Taji',v:'₹'+moneyFmt(avgTajiRate)}
          ];
        } else if (detail === 'AVG_KORI') {
          title = 'Kori Purchase Rate';
          rows = p.koriLog.map(k=>({k:k.bhaisWala+' • '+k.date,v:k.animals+' Hd | ₹'+moneyFmt(k.amount)+' | Avg ₹'+moneyFmt(Math.round(k.amount/k.animals))}));
          rows.unshift({k:'Overall Avg/Buffalo',v:'₹'+moneyFmt(koriCame>0?Math.round(koriTotal/koriCame):0)});
        } else if (detail === 'AVG_SLA') {
          title = 'Slaughter Amounts';
          rows = p.slaughtered.map(s=>({k:s.tagId+' • '+s.outgoingDate,v:'₹'+moneyFmt(s.amount)+' — '+s.kasaiName}));
          rows.unshift({k:'Avg Per Animal',v:'₹'+moneyFmt(avgSla)},{k:'Total Revenue',v:'₹'+moneyFmt(slaTotal)});
        } else if (detail === 'DEAD') {
          title = 'Dead Animals';
          rows = p.deadLog.map(d=>({k:d.tagId,v:d.outgoingDate+' • '+d.shed}));
          rows.unshift({k:'Total Dead',v:deadCount+' Hd'});
        } else if (detail === 'ANIMALS_CAME') {
          title = 'Animals Came (Kori + Taji)';
          rows = [{k:'Kori Purchased',v:koriCame+' Hd'},{k:'Taji Inwards',v:tajiCame+' Hd'},{k:'TOTAL',v:(koriCame+tajiCame)+' Hd'}];
          p.koriLog.forEach(k=>rows.push({k:'Kori: '+k.bhaisWala,v:k.animals+' Hd • '+k.date}));
          p.tajiLog.forEach(t=>rows.push({k:'Taji: '+t.tagId,v:t.date+' • '+t.palak}));
        } else if (detail === 'AVG_BUF') {
          title = 'Avg Cost Per Buffalo (Kori+Taji)';
          rows = [{k:'Total Kori Amount',v:'₹'+moneyFmt(koriTotal)},{k:'Total Taji Freight',v:'₹'+moneyFmt(tajiTotal2)},
            {k:'Combined Cost',v:'₹'+moneyFmt(totalKoriTaji)},{k:'Animals Count',v:koriTajiCount+' Hd'},{k:'Avg Per Buffalo',v:'₹'+moneyFmt(avgPerBuffalo)}];
        } else if (detail === 'AVG_MED') {
          title = 'Medicine Cost per Buffalo';
          rows = p.medicineLog.slice(0,15).map(m=>({k:m.item+' • '+m.date,v:'₹'+moneyFmt(m.amount)+' — '+m.vendor}));
          rows.unshift({k:'Total Medicine',v:'₹'+moneyFmt(medTotal)},{k:'Animals',v:totalAnimals+' Hd'},{k:'Avg/Buffalo',v:'₹'+moneyFmt(avgMedPerBuffalo)});
        } else if (detail === 'AVG_PAGAR') {
          title = 'Labour Pagar Breakdown';
          rows = p.labour.filter(l=>!l.leavingDate).map(w=>({k:w.workerName,v:'₹'+moneyFmt(w.pagarPerMonth)+'/mo'}));
          rows.push({k:'TOTAL /Month',v:'₹'+moneyFmt(labourTotal)});
        }
        return (
          <div className="overlay" onClick={()=>setDetail(null)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-title">📊 {title}</div>
              {rows.map((r,i)=>(
                <div key={i} className="report-row"><span className="report-key">{r.k}</span><span className="report-val">{r.v}</span></div>
              ))}
              <button className="submit-btn" style={{marginTop:14,background:'var(--bg-back-btn)',color:'var(--primary)'}} onClick={()=>setDetail(null)}>Close</button>
            </div>
          </div>
        );
      };

      return (
        <div>
          <PageHeader title="HALIMA DAIRY FARM" sub="Complete Management System" onTheme={()=>p.setIsDark(!p.isDark)} isDark={p.isDark}
            onClear={async () => {
              // Async clear with IndexedDB
              p.setBuffalo([]); p.setFaliLog([]); p.setKoriLog([]); p.setBhaisPayLog([]);
              p.setSlaughtered([]); p.setDeadLog([]); p.setTajiLog([]); p.setBakdiLog([]);
              p.setPalakPayLog([]); p.setProduction([]); p.setSupply([]); p.setMilkPayLog([]);
              p.setLabour([]); p.setLabPayLog([]); p.setGodown([]); p.setPurchases([]);
              p.setConsumption([]); p.setDanaPayLog([]); p.setMedicineLog([]);
              await dbClearStores('buffalo','faliLog','koriLog','bhaisPayLog','slaughtered','deadLog','tajiLog','bakdiLog','palakPayLog','production','supply','milkPayLog','labour','labPayLog','godown','purchases','consumption','danaPayLog','medicineLog');
            }}
          />
          <div className="scroll-page" style={{paddingTop:10}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
              <SectionDivider label="Average Cards" />
              <button className="back-btn" style={{marginTop:20}} onClick={()=>setShowRates(true)}>⚙️ Rates</button>
            </div>

            <div className="dash-grid-2">
              {cards.map((c,i)=>(
                <div key={i} className="d-card" style={{borderLeft:`4px solid ${c.color}`, cursor:'default'}} onClick={()=>setDetail(c.detail)}>
                  <div className="d-card-left">
                    <div className="d-label">{c.label}</div>
                    {c.noFormat
                      ? <div className="d-val-sm" style={{color:c.color}}>{c.val}</div>
                      : <div style={{display:'flex',alignItems:'baseline'}}>
                          <span className="d-val">{c.val}</span>
                          {c.unit && <span className="d-unit">{c.unit}</span>}
                        </div>
                    }
                    {c.sub && <div style={{fontSize:9,color:'var(--text-muted-dark)',fontWeight:700,marginTop:1,textTransform:'uppercase'}}>{c.sub}</div>}
                  </div>
                  {c.detail && <span style={{fontSize:12,color:'var(--text-muted)'}}>➔</span>}
                </div>
              ))}
            </div>

            {/* System Alerts */}
            <SectionDivider label="System Alerts" />
            <HerdAlerts buffalo={p.buffalo} faliLog={p.faliLog} />

            {/* 12-Month Delivery Matrix */}
            <SectionDivider label="12-Month Expected Delivery Matrix" />
            <DeliveryMatrix faliLog={p.faliLog} />

          </div>

          {/* Rates Modal */}
          {showRates && (
            <div className="overlay" onClick={()=>setShowRates(false)}>
              <div className="modal-box" onClick={e=>e.stopPropagation()}>
                <div className="modal-title">⚙️ Rate Configuration</div>
                {[
                  ['nooraPerMonth','Noora Per Month (₹)'],
                  ['tosifPerMonth','Tosif Per Month (₹)'],
                  ['irshadPerTaji','Irshad Per Taji (₹)'],
                  ['irshadPerBakdi','Irshad Per Bakdi (₹)']
                ].map(([k,l])=>(
                  <div key={k} className="input-row">
                    <label className="field-lbl">{l}</label>
                    <input type="number" className="farm-input" value={rateForm[k]}
                      onChange={e=>setRateForm({...rateForm,[k]:Number(e.target.value)})} />
                  </div>
                ))}
                <button className="submit-btn" onClick={()=>{p.setRates(rateForm);setShowRates(false);}}>Save Rates</button>
              </div>
            </div>
          )}
          {renderDetail()}
        </div>
      );
    }

    function DeliveryMatrix({ faliLog }) {
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const counts = Array(12).fill(0);
      faliLog.forEach(f => {
        const fDate = new Date(f.faliDate);
        // Expected delivery ~10 months after fali date
        const delivDate = new Date(fDate);
        delivDate.setMonth(delivDate.getMonth() + 10);
        counts[delivDate.getMonth()]++;
      });
      return (
        <div className="matrix-grid">
          {months.map((m,i)=>(
            <div key={m} className="matrix-cell">
              <div className="matrix-month">{m}</div>
              <div className="matrix-count">{counts[i]} Hd</div>
            </div>
          ))}
        </div>
      );
    }

    function HerdAlerts({ buffalo, faliLog }) {
      const alerts = [];
      const today = new Date(BASE_DATE);
      // 60-day unserviced from incoming date
      buffalo.filter(b=>!b.outgoingDate && !['Dead','Slaughtered'].includes(b.status)).forEach(b=>{
        const days = daysBetween(b.incomingDate, BASE_DATE);
        const hasFali = faliLog.some(f=>f.tagId===b.tagId);
        if (days > 60 && !hasFali) {
          alerts.push({ type:'warn', msg:'🐃 '+b.tagId+' ('+b.khilaNo+') — Not serviced in '+days+' days from incoming date.' });
        }
      });
      // 30-day khali not re-serviced
      faliLog.filter(f=>f.doctorResult==='Khali').forEach(f=>{
        const reServiced = faliLog.filter(ff=>ff.tagId===f.tagId && ff.faliDate > f.doctorDate);
        if (reServiced.length===0) {
          const days = daysBetween(f.doctorDate||f.faliDate, BASE_DATE);
          if (days > 30) {
            alerts.push({ type:'danger', msg:'🚨 '+f.tagId+' — Khali since '+(f.doctorDate||f.faliDate)+'. '+days+' days without re-service.' });
          }
        }
      });
      // Pregnant over 7 months alert
      faliLog.filter(f=>f.doctorResult==='Pregnant').forEach(f=>{
        const daysPrg = daysBetween(f.faliDate, BASE_DATE);
        if(daysPrg > 210) {
          alerts.push({ type:'warn', msg:'🍼 '+f.tagId+' — Pregnant '+daysPrg+' days (over 7 months). Delivery expected soon!' });
        }
      });
      // Repeat breeder alert
      const svcCnt = {};
      faliLog.forEach(f=>{if(!svcCnt[f.tagId])svcCnt[f.tagId]=0;svcCnt[f.tagId]++;});
      Object.entries(svcCnt).forEach(([tagId,cnt])=>{
        if(cnt>3) alerts.push({ type:'danger', msg:'🔁 '+tagId+' — Repeat breeder! Serviced '+cnt+' times.' });
      });
      if (alerts.length === 0) return (
        <div className="alert-box alert-ok"><span className="alert-txt-ok">✅ All alerts clear. Farm operations normal.</span></div>
      );
      return alerts.map((a,i)=>(
        <div key={i} className={`alert-box ${a.type==='danger'?'alert-danger':'alert-warn'}`}>
          <span className={a.type==='danger'?'alert-txt':'alert-txt-warn'}>{a.msg}</span>
        </div>
      ));
    }
    // ─────────────────────────────────────────────
    //  HERD BOOK
    // ─────────────────────────────────────────────
    function HerdBook(p) {
      const [view, setView] = useState('DASHBOARD');
      const [modal, setModal] = useState(null);
      const [search, setSearch] = useState('');

      const activeBuffalo = p.buffalo.filter(b => !b.outgoingDate && !['Dead','Slaughtered'].includes(b.status));
      const archivedBuffalo = p.buffalo.filter(b => b.outgoingDate || ['Dead','Slaughtered'].includes(b.status));

      // Search by Tag No — show matched buffalo detail
      const searchResult = search.trim() ? p.buffalo.find(b=>b.tagId.toUpperCase()===search.trim().toUpperCase()) : null;
      const searchFali = search.trim() ? p.faliLog.filter(f=>f.tagId.toUpperCase()===search.trim().toUpperCase()) : [];
      
      // Helper functions for modal data
      const getTajiList = () => {
        return p.tajiLog.map(t => {
          const buf = p.buffalo.find(b => b.tagId === t.tagId);
          const rearingDays = t.rearingDays || (t.date && t.incomingDate ? daysBetween(t.incomingDate, t.date) : '—');
          return { tagId: t.tagId, palak: t.palak, rearingDays, incomingDate: t.incomingDate || (buf ? buf.incomingDate : '—'), billAmount: t.palakBill || 0 };
        });
      };
      
      const getKoriList = () => {
        return p.koriLog.map(k => ({ date: k.date, broker: k.bhaisWala, animals: k.animals, avgPerAnimal: Math.round(k.amount / k.animals) }));
      };
      
      const getBakdiList = () => {
        return p.bakdiLog.map(b => {
          const lastFali = p.faliLog.filter(f => f.tagId === b.tagId).sort((a,b)=>b.faliDate.localeCompare(a.faliDate))[0];
          const monthsPreg = lastFali ? Math.floor(daysBetween(lastFali.faliDate, b.date) / 30) : '—';
          return { tagId: b.tagId, outgoingDate: b.date, palak: b.palak, faliDate: lastFali?.faliDate || '—', monthsPregnant: monthsPreg };
        });
      };
      
      const getPregnantOver7 = () => {
        return p.faliLog.filter(f => f.doctorResult === 'Pregnant' && daysBetween(f.faliDate, BASE_DATE) > 210).map(f => {
          const buf = p.buffalo.find(b => b.tagId === f.tagId);
          return { tagId: f.tagId, khilaNo: buf?.khilaNo || '—', shed: f.shed, faliDate: f.faliDate, daysPregnant: daysBetween(f.faliDate, BASE_DATE) };
        });
      };
      
      const getRepeatBreeders = () => {
        const countMap = {};
        p.faliLog.forEach(f => { countMap[f.tagId] = (countMap[f.tagId] || 0) + 1; });
        return Object.entries(countMap).filter(([,cnt]) => cnt > 3).map(([tagId, cnt]) => {
          const buf = p.buffalo.find(b => b.tagId === tagId);
          return { tagId, khilaNo: buf?.khilaNo || '—', serviceCount: cnt, shed: buf?.shed || '—' };
        });
      };
      
      const getToBeServiced = () => {
        const servicedTags = new Set(p.faliLog.map(f => f.tagId));
        const khaliTestedMap = {};
        p.faliLog.filter(f => f.doctorResult === 'Khali').forEach(f => { khaliTestedMap[f.tagId] = f.doctorDate; });
        return p.buffalo.filter(b => !b.outgoingDate && !['Dead','Slaughtered'].includes(b.status) && daysBetween(b.incomingDate, BASE_DATE) > 60 && !servicedTags.has(b.tagId))
          .map(b => ({ tagId: b.tagId, khilaNo: b.khilaNo, incomingDate: b.incomingDate, daysFromIncoming: daysBetween(b.incomingDate, BASE_DATE), testedDate: khaliTestedMap[b.tagId] || '—' }));
      };

      if (view === 'BUFFALO_ENTRY') return <BuffaloEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'FALI_ENTRY') return <FaliEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'KORI_ENTRY') return <KoriEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'SLAUGHTER_ENTRY') return <SlaughterEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'DEAD_ENTRY') return <DeadEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'TAJI_BAKDI') return <TajiBakdiEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'DOCTORS') return <DoctorsPage {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'BHAIS_PAY') return <BhaisPayPage {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'PALAK_PAY') return <PalakPayPage {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'HERD_LIST') return <HerdListPage {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'PAYMENT_ENTRY') return <HerdPaymentEntry {...p} onBack={()=>setView('DASHBOARD')} />;
      if (view === 'ARCHIVE') return <ArchivePage {...p} onBack={()=>setView('DASHBOARD')} />;
      
      const shedCounts = {
        'Shed A': activeBuffalo.filter(b=>b.shed==='Shed A').length,
        'Shed B': activeBuffalo.filter(b=>b.shed==='Shed B').length,
        'Yard A': activeBuffalo.filter(b=>b.shed==='Yard A').length,
        'Yard B': activeBuffalo.filter(b=>b.shed==='Yard B').length,
        'Noora': activeBuffalo.filter(b=>b.shed==='Noora').length,
        'Tosif': activeBuffalo.filter(b=>b.shed==='Tosif').length,
      };
      
      // Modal rendering helper
      const renderModal = () => {
        if (!modal) return null;
        let title = '', rows = [];
        switch (modal.type) {
          case 'TAJI':
            title = '🐃 Taji Animals (Came to Mumbai)';
            rows = modal.data.map((d,i) => ({ k: d.tagId, v: `Palak: ${d.palak} | Rearing: ${d.rearingDays}d | Incoming: ${d.incomingDate} | Bill: ₹${moneyFmt(d.billAmount)}` }));
            break;
          case 'KORI':
            title = '💰 Kori Purchases';
            rows = modal.data.map((d,i) => ({ k: `${d.date} - ${d.broker}`, v: `${d.animals} Hd | Avg ₹${moneyFmt(d.avgPerAnimal)}` }));
            break;
          case 'BAKDI':
            title = '🚚 Bakdi (Sent to Gujarat)';
            rows = modal.data.map((d,i) => ({ k: d.tagId, v: `Out: ${d.outgoingDate} | To: ${d.palak} | Fali: ${d.faliDate} | Preg: ${d.monthsPregnant} mo` }));
            break;
          case 'PREGNANT7':
            title = '🤰 Pregnant > 7 Months';
            rows = modal.data.map((d,i) => ({ k: d.tagId, v: `Khila: ${d.khilaNo} | Shed: ${d.shed} | Fali: ${d.faliDate} | Days: ${d.daysPregnant}d` }));
            break;
          case 'REPEAT':
            title = '🔁 Repeat Breeders (>3 services)';
            rows = modal.data.map((d,i) => ({ k: d.tagId, v: `Khila: ${d.khilaNo} | Shed: ${d.shed} | Services: ${d.serviceCount}` }));
            break;
          case 'TOSERVICE':
            title = '⏰ To Be Serviced (60+ days no service)';
            rows = modal.data.map((d,i) => ({ k: d.tagId, v: `Khila: ${d.khilaNo} | Incoming: ${d.incomingDate} | Days: ${d.daysFromIncoming}d | Tested on: ${d.testedDate}` }));
            break;
          default: return null;
        }
        return (
          <div className="overlay" onClick={()=>setModal(null)}>
            <div className="modal-box" onClick={e=>e.stopPropagation()}>
              <div className="modal-title">{title}</div>
              {rows.length === 0 && <div className="alert-box alert-ok"><span className="alert-txt-ok">No records found.</span></div>}
              {rows.map((r,i)=>(
                <div key={i} className="report-row"><span className="report-key">{r.k}</span><span className="report-val">{r.v}</span></div>
              ))}
              <button className="submit-btn" style={{marginTop:14,background:'var(--bg-back-btn)',color:'var(--primary)'}} onClick={()=>setModal(null)}>Close</button>
            </div>
          </div>
        );
      };

      return (
        <div>
          <PageHeader title="Herd Book" sub="Livestock Registry" onTheme={()=>p.setIsDark(!p.isDark)} isDark={p.isDark}
            onClear={async () => {
              p.setBuffalo([]); p.setFaliLog([]); p.setKoriLog([]); p.setBhaisPayLog([]); p.setSlaughtered([]); p.setDeadLog([]); p.setTajiLog([]); p.setBakdiLog([]); p.setPalakPayLog([]);
              await dbClearStores('buffalo','faliLog','koriLog','bhaisPayLog','slaughtered','deadLog','tajiLog','bakdiLog','palakPayLog');
            }}
          />
          <div className="scroll-page" style={{paddingTop:10}}>

            {/* Search Bar */}
            <div className="input-row" style={{marginBottom:10}}>
              <label className="field-lbl">Search by Tag No</label>
              <input type="text" className="farm-input" placeholder="Enter Tag No to search buffalo history..." value={search} onChange={e=>setSearch(e.target.value)} />
            </div>

            {/* Search Result */}
            {search.trim() && (
              <div className="form-panel" style={{marginBottom:10}}>
                {searchResult ? (<>
                  <div className="panel-header">Buffalo Profile — {searchResult.tagId}</div>
                  {[
                    ['Khila No',searchResult.khilaNo],['Shed',searchResult.shed],
                    ['Incoming Date',searchResult.incomingDate],['Status',searchResult.status],
                    ['Lactation Cycle',searchResult.lactationCycle],
                    ['Lactation Days',daysBetween(searchResult.incomingDate,BASE_DATE)+'d'],
                    ['Outgoing Date',searchResult.outgoingDate||'Active'],
                  ].map(([k,v],i)=>(<div key={i} className="report-row"><span className="report-key">{k}</span><span className="report-val">{v}</span></div>))}
                  {searchFali.length>0 && <>
                    <div style={{marginTop:8,color:'var(--primary)',fontWeight:700,fontSize:11,textTransform:'uppercase'}}>Fali / Service History</div>
                    {searchFali.map((f,i)=>(
                      <div key={f.id} style={{padding:'6px 0',borderBottom:'1px solid var(--border-table-row)',fontSize:12}}>
                        <span style={{fontWeight:700}}>#{i+1}</span> — Fali: {f.faliDate} | Bull: {f.bull} | Result: <span className={f.doctorResult==='Pregnant'?'green-val':f.doctorResult==='Khali'?'red-val':'amber-val'}>{f.doctorResult||'Pending'}</span>
                      </div>
                    ))}
                  </>}
                </>) : (
                  <div style={{color:'var(--text-muted)',fontSize:13,padding:'8px 0'}}>No buffalo found with Tag No: {search.toUpperCase()}</div>
                )}
              </div>
            )}

            <SectionDivider label="Herd Dashboard" />
            {/* 12 Info Cards */}
            <div className="dash-grid-2">
              {[
                {label:'Total Animals',val:activeBuffalo.length+' Hd',sub:'Shed A+B+Yards+Palak',color:'#10B981',click:'HERD_LIST'},
                {label:'Shed A (A+Yard A)',val:(shedCounts['Shed A']+shedCounts['Yard A'])+' Hd',sub:'Shed A + Yard A',color:'#3B82F6',click:null},
                {label:'Shed B (B+Yard B)',val:(shedCounts['Shed B']+shedCounts['Yard B'])+' Hd',sub:'Shed B + Yard B',color:'#6366F1',click:null},
                {label:'Tosif Animals',val:shedCounts['Tosif']+' Hd',sub:'At Tosif Palak',color:'#EF4444',click:null},
                {label:'Noora Animals',val:shedCounts['Noora']+' Hd',sub:'At Noora Palak',color:'#F59E0B',click:null},
                {label:'Taji Came',val:p.tajiLog.length+' Hd',sub:'Inwards this season',color:'#14B8A6',click:() => setModal({ type:'TAJI', data: getTajiList() }) },
                {label:'Kori Animals',val:p.koriLog.reduce((s,k)=>s+k.animals,0)+' Hd',sub:'Purchased Kori',color:'#EC4899',click:() => setModal({ type:'KORI', data: getKoriList() }) },
                {label:'Bakdi Gone',val:p.bakdiLog.length+' Hd',sub:'Sent to Gujarat',color:'#8B5CF6',click:() => setModal({ type:'BAKDI', data: getBakdiList() }) },

    function PalakBillSummary({ buffalo, rates, tajiLog }) {
      const active = buffalo.filter(b=>!b.outgoingDate && !['Dead','Slaughtered'].includes(b.status));
      const nooraCount = active.filter(b=>b.shed==='Noora').length;
      const tosifCount = active.filter(b=>b.shed==='Tosif').length;
      const nooraBill = nooraCount * rates.nooraPerMonth;
      const tosifBill = tosifCount * rates.tosifPerMonth;
      const irshadTajiBill = tajiLog.length * rates.irshadPerTaji;
      return (
        <div className="form-panel">
          {[
            {k:'Noora ('+nooraCount+' Hd × ₹'+rates.nooraPerMonth+')',v:'₹'+moneyFmt(nooraBill)},
            {k:'Tosif ('+tosifCount+' Hd × ₹'+rates.tosifPerMonth+')',v:'₹'+moneyFmt(tosifBill)},
            {k:'Irshad Taji Freight ('+tajiLog.length+' × ₹'+rates.irshadPerTaji+')',v:'₹'+moneyFmt(irshadTajiBill)},
          ].map((r,i)=>(
            <div key={i} className="report-row"><span className="report-key">{r.k}</span><span className="report-val green-val">{r.v}</span></div>
          ))}
        </div>
      );
    }

    // ── Taji / Bakdi Entry ──
    function TajiBakdiEntry({ tajiLog, setTajiLog, bakdiLog, setBakdiLog, buffalo, setBuffalo, faliLog, rates, onBack }) {
      const [tajiForm, setTajiForm] = useState({ date:'', tagId:'', palak:'Noora', incomingDate:'' });
      const [bakdiForm, setBakdiForm] = useState({ date:'', tagId:'', palak:'Noora' });

      // Taji: auto-fill incoming date from buffalo record, calc rearing days
      const tajiMatch = buffalo.find(b=>b.tagId.toUpperCase()===tajiForm.tagId.trim().toUpperCase());
      const tajiRearingDays = tajiForm.incomingDate && tajiForm.date ? daysBetween(tajiForm.incomingDate, tajiForm.date) : 0;
      const tajiPalakRate = tajiForm.palak==='Noora' ? rates.nooraPerMonth : rates.tosifPerMonth;
      const tajiPalakBill = tajiRearingDays>0 ? Math.round(tajiPalakRate/30*tajiRearingDays) : 0;

      // Bakdi: auto-fill from buffalo, calc days pregnant from last fali date
      const bakdiMatch = buffalo.find(b=>b.tagId.toUpperCase()===bakdiForm.tagId.trim().toUpperCase());
      const lastFali = bakdiMatch ? faliLog.filter(f=>f.tagId===bakdiMatch.tagId).sort((a,b)=>b.faliDate.localeCompare(a.faliDate))[0] : null;
      const daysPrg = lastFali && bakdiForm.date ? daysBetween(lastFali.faliDate, bakdiForm.date) : 0;
      
      useEffect(()=>{
        if(tajiMatch) setTajiForm(f=>({...f,incomingDate:tajiMatch.incomingDate}));
      },[tajiForm.tagId]);
      
      const submitTaji = e => {
        e.preventDefault();
        const entry = {id:'tj-'+Date.now(),...tajiForm,tagId:tajiForm.tagId.trim().toUpperCase(),freight:rates.irshadPerTaji,rearingDays:tajiRearingDays,palakBill:tajiPalakBill};
        setTajiLog(prev=>[...prev,entry]);
        // Update buffalo location to shed
        if(tajiMatch) setBuffalo(prev=>prev.map(b=>b.tagId===entry.tagId?{...b,shed:'Shed A',status:'Taji'}:b));
        alert('Taji saved. Rearing: '+tajiRearingDays+'d, Palak Bill: ₹'+moneyFmt(tajiPalakBill)+', Irshad: ₹'+rates.irshadPerTaji);
        setTajiForm({date:'',tagId:'',palak:'Noora',incomingDate:''});
      };
      
      const submitBakdi = e => {
        e.preventDefault();
        const entry = {id:'bk-'+Date.now(),...bakdiForm,tagId:bakdiForm.tagId.trim().toUpperCase(),freight:rates.irshadPerBakdi,daysPrgnant:daysPrg};
        setBakdiLog(prev=>[...prev,entry]);
        if(bakdiMatch) setBuffalo(prev=>prev.map(b=>b.tagId===entry.tagId?{...b,shed:bakdiForm.palak,status:'Bakdi',outgoingDate:bakdiForm.date}:b));
        alert('Bakdi saved. Days Pregnant: '+daysPrg+'d, Freight: ₹'+rates.irshadPerBakdi);
        setBakdiForm({date:'',tagId:'',palak:'Noora'});
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Add Taji (Came to Mumbai)</span><BackBtn onClick={onBack} /></div>

    // ── Herd Payment Entry (Dana Wala / Bhaiswala) ──
    function HerdPaymentEntry({ koriLog, bhaisPayLog, setBhaisPayLog, purchases, danaPayLog, setDanaPayLog, onBack }) {
      const [form, setForm] = useState({ date:'', brokerType:'Bhaiswala', brokerName:'', amount:'' });
      // Build broker name lists
      const bhaisNames = [...new Set(koriLog.map(k=>k.bhaisWala))];
      const danaNames = [...new Set(purchases.map(p=>p.broker))];
      const nameList = form.brokerType==='Bhaiswala' ? bhaisNames : danaNames;

      // Auto outstanding
      let outstanding = 0;
      if (form.brokerType==='Bhaiswala' && form.brokerName) {
        const purchased = koriLog.filter(k=>k.bhaisWala===form.brokerName).reduce((s,k)=>s+k.amount,0);
        const paid = bhaisPayLog.filter(p=>p.bhaisWala===form.brokerName).reduce((s,p)=>s+p.amount,0);
        outstanding = purchased - paid;
      } else if (form.brokerType==='Danawala' && form.brokerName) {
        const purchased = purchases.filter(p=>p.broker===form.brokerName).reduce((s,p)=>s+p.totalCost,0);
        const paid = danaPayLog.filter(p=>p.broker===form.brokerName).reduce((s,p)=>s+p.amount,0);
        outstanding = purchased - paid;
      }

      const submit = e => {
        e.preventDefault();
        const entry = {id:'pay-'+Date.now(),date:form.date,amount:Number(form.amount)};
        if (form.brokerType==='Bhaiswala') {
          setBhaisPayLog(prev=>[...prev,{...entry,bhaisWala:form.brokerName}]);
        } else {
          setDanaPayLog(prev=>[...prev,{...entry,broker:form.brokerName}]);
        }
        alert('Payment saved for '+form.brokerName);
        setForm({date:'',brokerType:form.brokerType,brokerName:'',amount:''});
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div className="form-panel">
            <div className="panel-header"><span>Payment Entry</span><BackBtn onClick={onBack} /></div>
            <form onSubmit={submit}>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Broker Type</label>
                  <select className="farm-select" value={form.brokerType} onChange={e=>setForm({...form,brokerType:e.target.value,brokerName:''})}>
                    <option>Bhaiswala</option><option>Danawala</option>
                  </select></div>
                <div className="input-row"><label className="field-lbl">Broker Name</label>
                  <select className="farm-select" value={form.brokerName} onChange={e=>setForm({...form,brokerName:e.target.value})}>
                    <option value="">-- Select --</option>
                    {nameList.map(n=><option key={n}>{n}</option>)}
                  </select></div>
              </div>
              <div className="grid-2">
                <div className="input-row"><label className="field-lbl">Date</label>
                  <input type="date" className="farm-input" required value={form.date} onChange={e=>setForm({...form,date:e.target.value})} /></div>
                <div className="input-row"><label className="field-lbl">Amount Paid (₹)</label>
                  <input type="number" className="farm-input" required value={form.amount} onChange={e=>setForm({...form,amount:e.target.value})} /></div>
              </div>
              <div className="auto-hint" style={{marginBottom:8}}>💰 Outstanding Balance (Auto): ₹{moneyFmt(outstanding)}</div>
              <button type="submit" className="submit-btn">Save Payment</button>
            </form>
          </div>
        </div>
      );
    }

    // ── Doctors Page ──
    function DoctorsPage({ buffalo, faliLog, setFaliLog, setBuffalo, onBack }) {
      // Show animals that are 55+ days after fali date (not yet tested), sorted by khila in ascending order
      const eligible = faliLog.filter(f=>{
        if(f.doctorResult) return false;
        const days = daysBetween(f.faliDate, BASE_DATE);
        return days >= 55;
      }).sort((a,b)=>{
        const ba = buffalo.find(x=>x.tagId===a.tagId);
        const bb = buffalo.find(x=>x.tagId===b.tagId);
        return (ba?.khilaNo||'').localeCompare(bb?.khilaNo||'', undefined, {numeric:true});
      });
      const pending = faliLog.filter(f=>!f.doctorResult && daysBetween(f.faliDate,BASE_DATE)<55);
      const shedA = eligible.filter(f=>f.shed==='Shed A');
      const shedB = eligible.filter(f=>f.shed==='Shed B');
      
      const update = (id, result) => {
        const fEntry = faliLog.find(f=>f.id===id);
        setFaliLog(prev=>prev.map(f=>f.id===id?{...f,doctorResult:result,doctorDate:BASE_DATE}:f));
        // Update buffalo status
        if(fEntry) setBuffalo(prev=>prev.map(b=>b.tagId===fEntry.tagId?{...b,status:result}:b));
        alert('Doctor result saved: '+result);
      };
      
      const renderCard = f => {
        const buf = buffalo.find(b=>b.tagId===f.tagId);
        const daysSinceFali = daysBetween(f.faliDate, BASE_DATE);
        return (
          <div key={f.id} style={{background:'var(--bg-panel)',border:'1px solid var(--border-card)',borderRadius:8,padding:12,marginBottom:8}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
              <span style={{fontWeight:800,fontSize:14,color:'var(--primary)'}}>{f.tagId}</span>
              <span className="badge badge-amber">{f.shed}</span>
            </div>
            <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:4}}>
               Khila: {buf?.khilaNo||'—'} • Fali: {f.faliDate} • Days Since Fali: {daysSinceFali}d
            </div>
            <div style={{fontSize:11,color:'var(--text-muted-dark)',marginBottom:8}}>Service #{f.serviceCount} • Bull: {f.bull} • Cycle: {buf?.lactationCycle||1}</div>
            <div style={{display:'flex',gap:8}}>
              <button className="submit-btn" style={{background:'#064E3B',color:'#6EE7B7',fontSize:11,padding:'8px 4px',flex:1}} onClick={()=>update(f.id,'Pregnant')}>✅ Pregnant</button>
              <button className="submit-btn" style={{background:'#7F1D1D',color:'#FCA5A5',fontSize:11,padding:'8px 4px',flex:1}} onClick={()=>update(f.id,'Khali')}>❌ Khali</button>
            </div>
          </div>
        );
      };
      
      return (
        <div className="scroll-page" style={{paddingTop:10}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <h2 style={{color:'var(--primary)',fontWeight:800,fontSize:16,textTransform:'uppercase'}}>🩺 Doctor's Test Page</h2>
            <BackBtn onClick={onBack} />
          </div>
          <div className="alert-box alert-ok" style={{marginBottom:8}}>
            <span className="alert-txt-ok">Showing animals 55+ days after Fali date. Khila No ascending order.</span>
          </div>
          <SectionDivider label={'Shed A — '+shedA.length+' Ready for Test'} />
          {shedA.length===0 ? <div className="alert-box alert-ok"><span className="alert-txt-ok">No animals ready for test in Shed A</span></div> : shedA.map(renderCard)}
          <SectionDivider label={'Shed B — '+shedB.length+' Ready for Test'} />
          {shedB.length===0 ? <div className="alert-box alert-ok"><span className="alert-txt-ok">No animals ready for test in Shed B</span></div> : shedB.map(renderCard)}
          {pending.length>0 && <>
            <SectionDivider label={'Upcoming (under 55 Days) — '+pending.length+' Pending'} />
            {pending.map(f=>{
              const buf=buffalo.find(b=>b.tagId===f.tagId);
              const daysLeft = 55-daysBetween(f.faliDate,BASE_DATE);
              return <div key={f.id} style={{background:'var(--bg-panel)',border:'1px solid var(--border-color)',borderRadius:8,padding:10,marginBottom:6}}>
                <span style={{fontWeight:700,color:'var(--text-muted)'}}>{f.tagId}</span>
                <span style={{color:'var(--text-muted-dark)',fontSize:11,marginLeft:8}}>Khila: {buf?.khilaNo} • Test in {daysLeft}d (on {new Date(new Date(f.faliDate).getTime()+55*86400000).toISOString().split('T')[0]})</span>
              </div>;
            })}
          </>}
        </div>
      );
    }
