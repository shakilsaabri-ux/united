  <title>DairyOS — 7 Modules</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ––––– GLOBAL (Light Theme) ––––– */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    :root {
      --bg-primary:#f5f7fa; --bg-secondary:#ffffff; --bg-card:#ffffff; --bg-card-hover:#f0f4ff;
      --bg-input:#f0f2f5; --border-color:#e2e8f0; --text-primary:#1e293b; --text-secondary:#475569;
      --text-muted:#94a3b8; --accent-blue:#2563eb; --accent-cyan:#0ea5e9; --accent-green:#16a34a;
      --accent-orange:#f97316; --accent-red:#dc2626; --accent-purple:#8b5cf6;
      --shadow:0 4px 12px rgba(0,0,0,0.06); --radius:12px; --radius-sm:6px;
      --transition:0.2s ease; --bottom-nav-height:64px; --header-height:56px;
    }
    body.dark-theme {
      --bg-primary:#0b0e14; --bg-secondary:#131821; --bg-card:#1a212c; --bg-card-hover:#242e3d;
      --bg-input:#1f2836; --border-color:#2a3548; --text-primary:#f0f4fc; --text-secondary:#9aaec9;
      --text-muted:#6a7f9e; --accent-blue:#4a8cf7; --accent-cyan:#22d3ee; --accent-green:#34d399;
      --accent-orange:#fb923c; --accent-red:#f87171; --accent-purple:#a78bfa;
      --shadow:0 8px 24px rgba(0,0,0,0.5);
    }
    html, body { height:100%; overflow:hidden; background:var(--bg-primary); }
    body { color:var(--text-primary); display:flex; flex-direction:column; padding:0; margin:0; height:100vh; max-height:100vh; }
    ::-webkit-scrollbar { width:4px; height:4px; }
    ::-webkit-scrollbar-track { background:var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background:var(--border-color); border-radius:10px; }

    .app-header {
      background:var(--bg-secondary); border-bottom:1px solid var(--border-color);
      padding:8px 16px; display:flex; align-items:center; justify-content:space-between;
      flex-shrink:0; height:var(--header-height); min-height:var(--header-height); gap:8px; z-index:100;
    }
    .app-logo { font-weight:700; font-size:1.2rem; display:flex; align-items:center; gap:8px; flex-shrink:0; color:var(--text-primary); }
    .app-logo i { color:var(--accent-blue); font-size:1.4rem; }
    .app-logo span { background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .header-actions { display:flex; align-items:center; gap:6px; }
    .header-actions button { background:transparent; border:none; color:var(--text-secondary); font-size:1.1rem; cursor:pointer; padding:4px 8px; border-radius:8px; transition:var(--transition); }
    .header-actions button:hover { background:var(--bg-card-hover); color:var(--text-primary); }
    .header-actions .theme-toggle { font-size:1.2rem; padding:4px 10px; }
    .header-actions .customise-btn { color:var(--accent-blue); }
    .header-actions .customise-btn:hover { background:rgba(37,99,235,0.08); }
    .nav-modules { display:flex; flex-wrap:nowrap; gap:4px; overflow-x:auto; flex:1; justify-content:flex-end; }
    .nav-modules button { background:transparent; border:none; color:var(--text-secondary); padding:6px 14px; border-radius:30px; font-size:0.75rem; font-weight:500; cursor:pointer; transition:var(--transition); display:flex; align-items:center; gap:4px; white-space:nowrap; flex-shrink:0; }
    .nav-modules button i { font-size:0.85rem; }
    .nav-modules button:hover { background:var(--bg-card-hover); color:var(--text-primary); }
    .nav-modules button.active { background:var(--accent-blue); color:#fff; box-shadow:0 4px 12px rgba(37,99,235,0.25); }
    @media (max-width:640px) { .nav-modules { display:none; } .app-header { justify-content:space-between; } }

    .app-main { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 16px 16px 16px; max-width:1200px; margin:0 auto; width:100%; -webkit-overflow-scrolling:touch; }
    .module-panel { display:none; animation:fadeUp 0.25s ease; }
    .module-panel.active { display:block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    .section-title { font-size:1rem; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; color:var(--text-primary); }
    .section-title i { color:var(--accent-blue); font-size:1.1rem; }
    .section-title small { font-weight:400; font-size:0.75rem; color:var(--text-muted); margin-left:4px; }
    .section-title .customise-badge { font-size:0.6rem; background:var(--accent-blue); color:#fff; padding:2px 10px; border-radius:30px; font-weight:600; margin-left:6px; cursor:pointer; }

    .alert-banner { background:var(--bg-card); border:1px solid var(--accent-red); border-radius:var(--radius); padding:10px 16px; display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .alert-banner i { color:var(--accent-red); font-size:0.9rem; }
    .alert-banner .msg { flex:1; font-size:0.85rem; color:var(--text-primary); }
    .alert-banner .count { background:var(--accent-red); color:#fff; font-weight:700; padding:2px 12px; border-radius:30px; font-size:0.75rem; }

    .card-grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px; width:100%; max-width:100%; }
    .card-grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:16px; width:100%; max-width:100%; }

    .card-slim {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius);
      padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
      transition:var(--transition); cursor:pointer; min-height:68px; gap:8px;
      width:100%; max-width:100%; overflow:hidden; box-sizing:border-box;
      position:relative;
    }
    .card-slim:hover { background:var(--bg-card-hover); border-color:var(--accent-blue); transform:translateY(-2px); box-shadow:var(--shadow); }
    .card-slim:active { transform:scale(0.97); }
    .card-slim .label { font-size:0.75rem; font-weight:500; text-transform:uppercase; letter-spacing:0.3px; color:var(--text-secondary); display:flex; align-items:center; gap:8px; flex:1; min-width:0; line-height:1.3; word-break:break-word; hyphens:auto; max-width:70%; }
    .card-slim .label i { font-size:0.9rem; color:var(--accent-blue); width:20px; text-align:center; flex-shrink:0; }
    .card-slim .label span { display:inline; word-break:break-word; hyphens:auto; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .card-slim .value { font-size:1.2rem; font-weight:700; color:var(--text-primary); letter-spacing:-0.2px; white-space:nowrap; flex-shrink:0; text-align:right; margin-left:4px; max-width:30%; }
    .card-slim .value .sub { font-size:0.65rem; font-weight:400; color:var(--text-muted); margin-left:4px; }
    .card-slim .drag-handle { position:absolute; top:4px; right:4px; font-size:0.7rem; color:var(--text-muted); opacity:0.3; cursor:grab; padding:4px; }
    .card-slim:hover .drag-handle { opacity:0.8; }
    .card-slim.dragging { opacity:0.5; transform:scale(0.95); }
    .card-slim.drag-over { border-color:var(--accent-blue); border-style:dashed; background:var(--bg-card-hover); }
    .card-slim.hidden-card { display:none; }

    .touch-card {
      background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius);
      padding:14px 18px; display:flex; align-items:center; gap:12px;
      transition:var(--transition); cursor:pointer; min-height:60px;
      width:100%; max-width:100%; overflow:hidden; box-sizing:border-box;
    }
    .touch-card:hover { background:var(--bg-card-hover); border-color:var(--accent-blue); transform:translateX(4px); box-shadow:var(--shadow); }
    .touch-card:active { transform:scale(0.97); }
    .touch-card i { font-size:1.2rem; color:var(--accent-blue); width:28px; text-align:center; flex-shrink:0; }
    .touch-card .info { flex:1; min-width:0; overflow:hidden; }
    .touch-card .info .title { font-weight:600; font-size:0.9rem; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .touch-card .info .desc { font-size:0.7rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .touch-card .amount { font-weight:700; font-size:1rem; color:var(--accent-green); white-space:nowrap; flex-shrink:0; }

    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius); padding:18px 24px; margin-bottom:16px; }
    .form-grid .full { grid-column:1 / -1; }
    .form-grid label { font-size:0.8rem; font-weight:500; color:var(--text-secondary); display:flex; flex-direction:column; gap:4px; }
    .form-grid input, .form-grid select { background:var(--bg-input); border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:8px 12px; color:var(--text-primary); font-size:0.9rem; transition:var(--transition); width:100%; }
    .form-grid input:focus, .form-grid select:focus { outline:none; border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(37,99,235,0.15); }

    .btn { background:var(--accent-blue); border:none; color:#fff; padding:8px 20px; border-radius:30px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:var(--transition); display:inline-flex; align-items:center; gap:6px; border:1px solid transparent; }
    .btn:hover { background:#1d4ed8; transform:scale(1.02); box-shadow:0 4px 12px rgba(37,99,235,0.3); }
    .btn-outline { background:transparent; border-color:var(--border-color); color:var(--text-secondary); }
    .btn-outline:hover { background:var(--bg-card-hover); color:var(--text-primary); border-color:var(--accent-blue); }
    .btn-sm { padding:4px 14px; font-size:0.7rem; }
    .btn-danger { background:var(--accent-red); color:#fff; }
    .btn-danger:hover { background:#b91c1c; }
    .btn-green { background:var(--accent-green); color:#fff; }
    .btn-green:hover { background:#15803d; }
    .btn-orange { background:var(--accent-orange); color:#fff; }
    .btn-orange:hover { background:#ea580c; }
    .btn-reset { background:var(--accent-red); color:#fff; }
    .btn-reset:hover { background:#b91c1c; }

    .table-wrap { overflow-x:auto; background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius); padding:4px 0; margin-bottom:16px; -webkit-overflow-scrolling:touch; }
    .table-wrap table { width:100%; border-collapse:collapse; font-size:0.8rem; min-width:400px; }
    .table-wrap th { text-align:left; padding:10px 14px; color:var(--text-secondary); font-weight:500; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.3px; border-bottom:1px solid var(--border-color); background:var(--bg-primary); }
    .table-wrap td { padding:8px 14px; border-bottom:1px solid var(--border-color); color:var(--text-primary); vertical-align:middle; }
    .table-wrap tr:hover td { background:var(--bg-card-hover); }
    .table-wrap .delete-btn { background:transparent; border:none; color:var(--accent-red); cursor:pointer; font-size:1rem; transition:var(--transition); padding:2px 6px; }
    .table-wrap .delete-btn:hover { transform:scale(1.2); color:#b91c1c; }
    .status-badge { font-size:0.6rem; padding:2px 10px; border-radius:30px; font-weight:500; }
    .status-badge.green { background:#dcfce7; color:#16a34a; }
    .status-badge.orange { background:#fef3c7; color:#f97316; }
    .status-badge.red { background:#fee2e2; color:#dc2626; }
    .status-badge.blue { background:#dbeafe; color:#2563eb; }
    .status-badge.purple { background:#ede9fe; color:#8b5cf6; }
    .status-badge.gray { background:#f1f5f9; color:#64748b; }
    body.dark-theme .status-badge { background:var(--bg-input); color:var(--text-primary); }
    .mini-scroll { max-height:200px; overflow-y:auto; }

    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; height:var(--bottom-nav-height);
      background:var(--bg-secondary); border-top:1px solid var(--border-color);
      display:flex; justify-content:space-around; align-items:center; padding:6px 8px; z-index:200; backdrop-filter:blur(8px); flex-shrink:0;
    }
    .bottom-nav button { background:transparent; border:none; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:2px; font-size:0.6rem; font-weight:500; cursor:pointer; transition:var(--transition); padding:4px 8px; border-radius:8px; flex:1; max-width:64px; }
    .bottom-nav button i { font-size:1.3rem; transition:var(--transition); }
    .bottom-nav button span { line-height:1.2; }
    .bottom-nav button.active { color:var(--accent-blue); }
    .bottom-nav button.active i { color:var(--accent-blue); text-shadow:0 0 12px rgba(37,99,235,0.2); }
    .bottom-nav button:hover { color:var(--text-primary); }
    @media (max-width:480px) { .bottom-nav button { max-width:48px; font-size:0.5rem; } .bottom-nav button i { font-size:1.1rem; } .bottom-nav button span { display:none; } }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:999; padding:20px; animation:fadeUp 0.2s ease; }
    .modal-overlay .modal-box { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:var(--radius); padding:24px 28px; max-width:520px; width:100%; max-height:80vh; overflow-y:auto; box-shadow:var(--shadow); }
    .modal-overlay .modal-box h3 { margin-bottom:14px; display:flex; align-items:center; gap:10px; font-size:1.1rem; color:var(--text-primary); }
    .modal-overlay .modal-box h3 i { color:var(--accent-blue); }
    .modal-overlay .modal-box .detail-item { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); font-size:0.85rem; }
    .modal-overlay .modal-box .detail-item .label { color:var(--text-secondary); }
    .modal-overlay .modal-box .detail-item .val { font-weight:600; color:var(--text-primary); }
    .modal-actions { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }

    .customiser-item {
      display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-color);
    }
    .customiser-item .drag-handle { color:var(--text-muted); cursor:grab; font-size:1rem; }
    .customiser-item .info { flex:1; }
    .customiser-item .info .name { font-weight:500; font-size:0.9rem; color:var(--text-primary); }
    .customiser-item .info .desc { font-size:0.7rem; color:var(--text-muted); }
    .customiser-item .toggle { position:relative; width:44px; height:24px; flex-shrink:0; cursor:pointer; background:var(--bg-input); border-radius:30px; border:1px solid var(--border-color); transition:var(--transition); }
    .customiser-item .toggle.active { background:var(--accent-blue); border-color:var(--accent-blue); }
    .customiser-item .toggle .knob { position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:var(--transition); }
    .customiser-item .toggle.active .knob { left:22px; }
    .customiser-item.dragging { opacity:0.5; }

    .text-muted { color:var(--text-muted); }
    .text-green { color:var(--accent-green); }
    .text-orange { color:var(--accent-orange); }
    .text-red { color:var(--accent-red); }
    .text-blue { color:var(--accent-blue); }
    .mt-8 { margin-top:8px; }
    .mb-8 { margin-bottom:8px; }
    .flex-between { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

    @media (max-width:640px) {
      .app-main { padding:10px 12px 12px 12px; }
      .card-grid-2 { gap:10px; }
      .card-grid-3 { grid-template-columns:1fr 1fr; gap:10px; }
      .card-slim { padding:14px 16px; min-height:58px; }
      .card-slim .value { font-size:1rem; }
      .card-slim .label { font-size:0.7rem; }
      .touch-card { padding:12px 14px; min-height:52px; }
      .touch-card .info .title { font-size:0.8rem; }
      .touch-card .amount { font-size:0.9rem; }
      .form-grid { grid-template-columns:1fr; padding:14px 16px; }
      .form-grid .full { grid-column:1; }
      .form-grid input, .form-grid select { font-size:0.8rem; padding:6px 10px; }
      .section-title { font-size:0.9rem; }
    }
    @media (max-width:480px) {
      .card-grid-2 { gap:8px; }
      .card-grid-3 { grid-template-columns:1fr 1fr; gap:8px; }
      .card-slim { padding:10px 14px; min-height:50px; }
      .card-slim .value { font-size:0.9rem; }
      .card-slim .label { font-size:0.65rem; }
      .touch-card { padding:10px 12px; min-height:44px; }
      .touch-card .info .title { font-size:0.7rem; }
      .touch-card .amount { font-size:0.8rem; }
      .form-grid { padding:10px 12px; gap:8px; }
      .form-grid label { font-size:0.7rem; }
      .form-grid input, .form-grid select { font-size:0.75rem; padding:5px 8px; }
      .btn { font-size:0.7rem; padding:6px 14px; }
      .table-wrap table { font-size:0.7rem; min-width:300px; }
      .table-wrap th, .table-wrap td { padding:6px 10px; }
    }

    #appLoader {
      display:flex;
      justify-content:center;
      align-items:center;
      height:200px;
      color:var(--text-muted);
      font-size:1.2rem;
      transition:opacity 0.3s ease;
    }
    #appLoader i { margin-right:12px; }
    #appLoader.hidden { opacity:0; pointer-events:none; height:0; overflow:hidden; margin:0; padding:0; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="app-logo"><i class="fas fa-cow"></i><span>DairyOS</span></div>
    <nav class="nav-modules" id="topNav">
      <button class="active" data-module="dashboard"><i class="fas fa-chart-pie"></i> Dash</button>
      <button data-module="herd"><i class="fas fa-paw"></i> Herd</button>
      <button data-module="stock"><i class="fas fa-warehouse"></i> Stock</button>
      <button data-module="milk"><i class="fas fa-tint"></i> Milk</button>
      <button data-module="labour"><i class="fas fa-users"></i> Labour</button>
      <button data-module="accounts"><i class="fas fa-file-invoice-dollar"></i> P&L</button>
      <button data-module="reports"><i class="fas fa-chart-line"></i> Reports</button>
    </nav>
    <div class="header-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
      <button class="customise-btn" onclick="openCustomiser()" title="Customise Dashboard"><i class="fas fa-sliders-h"></i></button>
      <button onclick="exportData()" title="Export"><i class="fas fa-download"></i></button>
      <button onclick="document.getElementById('importInput').click()" title="Import"><i class="fas fa-upload"></i></button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)" />
      <button onclick="openRateModal()" title="Edit Rates"><i class="fas fa-cog"></i></button>
      <button onclick="installApp()" title="Install App" id="installBtn" style="display:none;"><i class="fas fa-download"></i></button>
    </div>
  </header>

  <main class="app-main" id="appMain">
    <div id="appLoader"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    <section id="panel-dashboard" class="module-panel"></section>
    <section id="panel-herd" class="module-panel"></section>
    <section id="panel-stock" class="module-panel"></section>
    <section id="panel-milk" class="module-panel"></section>
    <section id="panel-labour" class="module-panel"></section>
    <section id="panel-accounts" class="module-panel"></section>
    <section id="panel-reports" class="module-panel"></section>
  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="active" data-module="dashboard"><i class="fas fa-chart-pie"></i><span>Home</span></button>
    <button data-module="herd"><i class="fas fa-paw"></i><span>Herd</span></button>

  <script>
    // ================================================================
    // THEME TOGGLE
    // ================================================================
    function toggleTheme() {
      const body = document.body;
      const icon = document.getElementById('themeIcon');
      const isDark = body.classList.toggle('dark-theme');
      icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
      localStorage.setItem('dairyTheme', isDark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').content = isDark ? '#0b0e14' : '#ffffff';
    }

    function loadTheme() {
      const saved = localStorage.getItem('dairyTheme');
      if (saved === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('themeIcon').className = 'fas fa-sun';
        document.querySelector('meta[name="theme-color"]').content = '#0b0e14';
      }
    }

    // ================================================================
    // STORAGE (IndexedDB)
    // ================================================================
    const DB = {
      _cache: {},
      _usingIndexedDB: false,
      _db: null,
      _dbName: 'DairyOSDB',
      _storeName: 'appData',
      _initialized: false,

      init() {
        return new Promise((resolve) => {
          try {
            const request = indexedDB.open(this._dbName, 2);
            request.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(this._storeName)) {
                db.createObjectStore(this._storeName);
              }
            };
            request.onsuccess = (e) => {
              this._db = e.target.result;
              this._usingIndexedDB = true;
              this._loadAll().then(() => { this._initialized = true; resolve(); }).catch(() => { this
                  ._initialized = true; resolve(); });
            };
            request.onerror = () => {
              console.warn('IndexedDB not available, using localStorage fallback.');
              this._usingIndexedDB = false;
              this._loadFromLocalStorage();
              this._initialized = true;
              resolve();
            };
          } catch (e) {
            console.warn('IndexedDB error, using localStorage fallback.', e);
            this._usingIndexedDB = false;
            this._loadFromLocalStorage();
            this._initialized = true;
            resolve();
          }
        });
      },

      _loadAll() {
        return new Promise((resolve, reject) => {
          if (!this._db) return reject('DB not initialized');
          const transaction = this._db.transaction([this._storeName], 'readonly');
          const store = transaction.objectStore(this._storeName);
          const request = store.getAll();
          request.onsuccess = () => {
            const results = request.result || [];
            results.forEach(item => {
              if (item.key && item.value !== undefined) {
                this._cache[item.key] = item.value;
              }
            });
            resolve();
          };
          request.onerror = (e) => reject(e.target.error);
        });
      },

      _loadFromLocalStorage() {
        const keys = ['animals', 'taji', 'kori', 'bakdi', 'slaughter', 'dead',
          'feedPurchases', 'feedConsumption', 'godown', 'danawalaPayments',
          'customers', 'milkProduction', 'milkOverrides', 'customerPayments',
          'labour', 'labourPayments', 'vendorPayments', 'medicineBills', 'bhaiswalBills',
          'config', 'dashboardPrefs'
        ];
        keys.forEach(key => {
          try {
            const val = localStorage.getItem('dairy_' + key);
            if (val) { this._cache[key] = JSON.parse(val); }
          } catch (e) {}
        });
      },

      _saveToDB(key, value) {
        if (this._usingIndexedDB) {
          return new Promise((resolve, reject) => {
            if (!this._db) return reject('DB not initialized');
            const transaction = this._db.transaction([this._storeName], 'readwrite');
            const store = transaction.objectStore(this._storeName);
            const request = store.put({ key, value });
            request.onsuccess = () => resolve();
            request.onerror = (e) => reject(e.target.error);
          });
        } else {
          try {
            localStorage.setItem('dairy_' + key, JSON.stringify(value));
            return Promise.resolve();
          } catch (e) { return Promise.reject(e); }
        }
      },

      get(key, def) { return this._cache[key] !== undefined ? this._cache[key] : def; },
      async set(key, value) { this._cache[key] = value; await this._saveToDB(key, value); },
      getAll() { return this._cache; },
      async importAll(data) {
        const keys = Object.keys(data);
        for (const key of keys) {
          if (data[key] !== undefined) {
            this._cache[key] = data[key];
            await this._saveToDB(key, data[key]);
          }
        }
      },
      // Hard reset: clear all stores and re-seed demo data
      async hardReset() {
        if (!this._db) return;
        const storeNames = ['animals', 'taji', 'kori', 'bakdi', 'slaughter', 'dead',
          'feedPurchases', 'feedConsumption', 'godown', 'danawalaPayments',
          'customers', 'milkProduction', 'milkOverrides', 'customerPayments',
          'labour', 'labourPayments', 'vendorPayments', 'medicineBills', 'bhaiswalBills',
          'config', 'dashboardPrefs'
        ];
        const tx = this._db.transaction(storeNames, 'readwrite');
        for (const name of storeNames) {
          const store = tx.objectStore(name);
          await store.clear();
        }
        await new Promise((resolve, reject) => {
          tx.oncomplete = resolve;
          tx.onerror = reject;
        });
        // Clear cache
        for (const key of storeNames) {
          delete this._cache[key];
        }
        // Re-seed demo data
        await seedDemoData();
        // Reload all data
        await this._loadAll();
      }
    };

    // ================================================================
    // HELPERS
    // ================================================================
    async function getCaretakerTotal() {
      const animals = await DB.get('animals', []);
      const config = await DB.get('config', { nooraRate: 3300, tosifRate: 3100, tajiFreight: 3400, bakdiFreight: 1800,
        benchmarkProd: 192, benchmarkFeed: 200 });
      let t = 0;
      animals.forEach(a => { if (a.location === 'Noora') t += config.nooraRate;
        else if (a.location === 'Tosif') t += config.tosifRate; });
      return t;
    }

    async function getTransportTotal() {
      const taji = await DB.get('taji', []);
      const bakdi = await DB.get('bakdi', []);
      const config = await DB.get('config', { nooraRate: 3300, tosifRate: 3100, tajiFreight: 3400, bakdiFreight: 1800,
        benchmarkProd: 192, benchmarkFeed: 200 });
      return taji.length * config.tajiFreight + bakdi.length * config.bakdiFreight;
    }

    async function getLabourTotal() {
      const labour = await DB.get('labour', []);
      return labour.reduce((s, l) => s + (l.fixedPagar || 0), 0);
    }

    async function getMedicineTotal() {
      const medicineBills = await DB.get('medicineBills', []);
      return medicineBills.reduce((s, m) => s + (m.amount || 0), 0);
    }

    async function getActiveAnimals() {
      const animals = await DB.get('animals', []);
      return animals.filter(a => a.status !== 'Dead' && a.status !== 'Slaughtered');
    }

    async function getTotalMilk() {
      const milkProduction = await DB.get('milkProduction', []);
      return milkProduction.reduce((s, d) => s + (d.shedAMorning || 0) + (d.shedAEvening || 0) + (d.shedBMorning || 0) +
        (d.shedBEvening || 0), 0);
    }

    // NAVIGATION
    // ================================================================

      document.querySelectorAll('.module-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + mod).classList.add('active');

        case 'stock': await refreshStock(); break;

    window.showKpiDetail = async function(id) {

      const labourTotal = await getLabourTotal();
      const medicineTotal = await getMedicineTotal();
      const totalOpEx = feedCost + caretakerTotal + transportTotal + labourTotal + medicineTotal;
      const avgMilkRate = totalMilk ? (totalOpEx / totalMilk) : 0;
      const saleTotal = customers.reduce((s, c) => s + (c.sellingRate || 0), 0);
      const avgSale = customers.length ? (saleTotal / customers.length) : 0;
      const labTotal = labourTotal;
      const avgLabAnimal = active.length ? (labTotal / active.length) : 0;
      const tajiTotal = taji.reduce((s, d) => s + (d.billAmount || 0), 0);
      const avgTaji = taji.length ? (tajiTotal / taji.length) : 0;
      const koriTotal = kori.reduce((s, d) => s + (d.totalBillAmount || 0), 0);

      const avgMed = active.length ? (medTotal / active.length) : 0;
      const labMonths = Math.max(1, labour.length);

      if (map[id]) {

      const dead = await DB.get('dead', []);

      const config = await DB.get('config', { nooraRate: 3300, tosifRate: 3100, tajiFreight: 3400, bakdiFreight: 1800,
        benchmarkProd: 192, benchmarkFeed: 200 });

      const feedCost = feedPurchases.reduce((s, d) => s + (d.goodsBillAmount || 0), 0);
      const feedKg = feedPurchases.reduce((s, d) => s + (d.totalWeight || 0), 0);
      const totalFeed = feedCons.reduce((s, d) => s + (d.bagsConsumed || 0) * (d.bagSize || 50), 0);

      const avgFeed = active.length ? (totalFeed / active.length) : 0;
      const avgFeedCost = feedKg ? (feedCost / feedKg) : 0;
      const caretakerTotal = await getCaretakerTotal();
      const transportTotal = await getTransportTotal();
      const labourTotal = await getLabourTotal();
      const medicineTotal = await getMedicineTotal();
      const totalOpEx = feedCost + caretakerTotal + transportTotal + labourTotal + medicineTotal;
      const avgMilkRate = totalMilk ? (totalOpEx / totalMilk) : 0;
      const saleTotal = customers.reduce((s, c) => s + (c.sellingRate || 0), 0);
      const avgSale = customers.length ? (saleTotal / customers.length) : 0;
      const labTotal = labourTotal;
      const avgLabAnimal = active.length ? (labTotal / active.length) : 0;
      const tajiTotal = taji.reduce((s, d) => s + (d.billAmount || 0), 0);
      const avgTaji = taji.length ? (tajiTotal / taji.length) : 0;
      const koriTotal = kori.reduce((s, d) => s + (d.totalBillAmount || 0), 0);
      const koriCount = kori.reduce((s, d) => s + (d.numberOfAnimals || 0), 0);
      const avgKori = koriCount ? (koriTotal / koriCount) : 0;
      const slTotal = slaughter.reduce((s, d) => s + (d.soldAmount || 0), 0);

      const now = new Date();
      const threeMonths = new Date(now);

      const animals = await DB.get('animals', []);

        .faliDate)) > 7 * 30 * 24 * 60 * 60 * 1000);

      const toService = animals.filter(a => {
        const incoming = new Date(a.incomingDate);
        const days = (new Date() - incoming) / (24 * 60 * 60 * 1000);
        if (a.status === 'KHALI' && days > 60) return true;
        if (a.status === 'KHALI' && a.doctorDate) {
          const dd = new Date(a.doctorDate);
          if ((new Date() - dd) / (24 * 60 * 60 * 1000) > 30) return true;
        }
        return false;

        <div class="table-wrap"><table><thead><tr id="projectionHeaders"></tr></thead><tbody><tr id="projectionRow"></tr></tbody></table></div>
      `;
      dashboardPanel.innerHTML = html;
      setupDragAndDrop();
      await refreshLedgers();
      await refreshProjections();

    // Drag & drop setup
    function setupDragAndDrop() {
      const grid = document.getElementById('kpiGrid');
      if (!grid) return;
      let draggedId = null;
      grid.addEventListener('dragstart', (e) => {
        const card = e.target.closest('.card-slim');
        if (!card) return;
        draggedId = card.dataset.kpiId;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedId);
      });
      grid.addEventListener('dragend', (e) => {
        const card = e.target.closest('.card-slim');
        if (card) card.classList.remove('dragging');
        document.querySelectorAll('.card-slim.drag-over').forEach(el => el.classList.remove('drag-over'));
      });
      grid.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const target = e.target.closest('.card-slim');
        if (target && target.dataset.kpiId !== draggedId) {
          document.querySelectorAll('.card-slim.drag-over').forEach(el => el.classList.remove('drag-over'));
          target.classList.add('drag-over');
        }
      });
      grid.addEventListener('dragleave', (e) => {
        const target = e.target.closest('.card-slim');
        if (target) target.classList.remove('drag-over');
      });
      grid.addEventListener('drop', async (e) => {
        e.preventDefault();
        const target = e.target.closest('.card-slim');
        if (!target || !draggedId) return;
        target.classList.remove('drag-over');
        const prefs = await getDashboardPrefs();
        const order = prefs.order || DEFAULT_KPI_ORDER;
        const fromIdx = order.indexOf(draggedId);
        const toIdx = order.indexOf(target.dataset.kpiId);
        if (fromIdx === -1 || toIdx === -1) return;
        order.splice(fromIdx, 1);
        order.splice(toIdx, 0, draggedId);
        await saveDashboardPrefs(order, prefs.hidden || []);
        await refreshDashboard();
      });
    }

    async function refreshProjections() {
      const months = [];
      const now = new Date();
      for (let i = 0; i < 12; i++) { const d = new Date(now);
        d.setMonth(now.getMonth() + i);
        months.push(d.toLocaleString('en', { month: 'short', year: '2-digit' })); }
      const headers = document.getElementById('projectionHeaders');
      const row = document.getElementById('projectionRow');
      if (headers && row) {
        headers.innerHTML = months.map(m => '<th>' + m + '</th>').join('');
        const animals = await DB.get('animals', []);
        const counts = new Array(12).fill(0);
        animals.forEach(a => {
          if (a.faliDate) {
            const fali = new Date(a.faliDate);
            const birth = new Date(fali);
            birth.setDate(birth.getDate() + 300);
            const diff = (birth.getFullYear() - now.getFullYear()) * 12 + (birth.getMonth() - now.getMonth());
            if (diff >= 0 && diff < 12) counts[diff]++;
          }
        });
        row.innerHTML = counts.map(c => '<td>' + c + '</td>').join('');
      }
    }

    function addDays(dateStr, days) {
      const d = new Date(dateStr);
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }

    function daysBetween(a, b) {
      if (!a || !b) return 0;
      return Math.max(0, Math.floor((new Date(b) - new Date(a)) / 86400000));
    }

    async function refreshHerd() {
      const panel = document.getElementById('panel-herd');
      if (!panel) return;
      const animals = await DB.get('animals', []);

      const pregnant7 = animals.filter(a => a.status === 'Pregnant' && a.faliDate && (new Date() - new Date(a

      const repeatBreeder = animals.filter(a => (a.servicedCycle || 0) > 3);
      const toService = animals.filter(a => {
        const incoming = new Date(a.incomingDate);
        const days = (new Date() - incoming) / (24 * 60 * 60 * 1000);
        if (a.status === 'KHALI' && days > 60) return true;
        if (a.status === 'KHALI' && a.doctorDate) {

      });
      const diags = [

          color: '' },

    window.submitStockEntry = async function() {
      const action = document.getElementById('stockAction').value;
      if (action === 'purchase') {
        const broker = document.getElementById('sf_broker').value.trim();
        const goods = document.getElementById('sf_goods').value.trim();
        const date = document.getElementById('sf_date').value;
        const rate = parseFloat(document.getElementById('sf_rate').value) || 0;
        const rateType = document.getElementById('sf_rate_type').value;
        const freight = parseFloat(document.getElementById('sf_freight').value) || 0;
        const weight = parseFloat(document.getElementById('sf_weight').value) || 0;
        const bags = parseInt(document.getElementById('sf_bags').value) || 0;
        if (!broker || !goods || !date || !rate || !weight || !bags) {
          showModal('⚠️ Error', 'Fill all fields.');
          return;
        }
        const bagSize = weight / bags;
        const freightPerKg = weight > 0 ? freight / weight : 0;
        const goodsBillAmount = weight * rate + freight;
        const purchase = {
          id: 'P' + Date.now(),
          brokerName: broker,
          goodsName: goods,
          dateOfDelivery: date,
          bagsPurchased: bags,
          totalWeight: weight,
          rateType: rateType,
          totalFreight: freight,
          bagSize: bagSize,
          freightPerKg: freightPerKg,
          goodsBillAmount: goodsBillAmount
        };
        const purchases = await DB.get('feedPurchases', []);
        purchases.push(purchase);
        await DB.set('feedPurchases', purchases);
        // update godown
        const godown = await DB.get('godown', []);
        const existing = godown.find(g => g.goodsName === goods);
        if (existing) {
          existing.bagsInStock += bags;
          existing.bagSize = bagSize;
          existing.rate = rate; // keep track
        } else {
          godown.push({ goodsName: goods, bagsInStock: bags, bagSize: bagSize, rate: rate });
        }
        await DB.set('godown', godown);
        showModal('✅ Entry', `Purchase of ${goods} recorded. Stock updated.`);
        clearStockForm();
        await refreshAll();
      } else if (action === 'consume') {
        const goods = document.getElementById('sf_consume_goods').value;
        const bags = parseFloat(document.getElementById('sf_consume_bags').value) || 0;
        if (!goods || bags <= 0) {
          showModal('⚠️ Error', 'Select goods and enter bags consumed.');
          return;
        }
        const godown = await DB.get('godown', []);
        const stockItem = godown.find(g => g.goodsName === goods);
        if (!stockItem) { showModal('⚠️ Error', 'Goods not found in godown.'); return; }
        if (stockItem.bagsInStock < bags) { showModal('⚠️ Error', 'Not enough stock.'); return; }
        const bagSize = stockItem.bagSize || 0;
        const kgs = bags * bagSize;
        const consumption = {
          id: 'C' + Date.now(),
          date: new Date().toISOString().split('T')[0],
          goodsName: goods,
          bagsConsumed: bags,
          bagSize: bagSize,
          kgsConsumed: kgs
        };
        const consumptions = await DB.get('feedConsumption', []);
        consumptions.push(consumption);
        await DB.set('feedConsumption', consumptions);
        // deduct stock
        stockItem.bagsInStock -= bags;
        await DB.set('godown', godown);
        showModal('✅ Entry', `Consumption of ${bags} bags of ${goods} logged.`);
        clearStockForm();
        await refreshAll();
      } else if (action === 'godown') {
        const goods = document.getElementById('sf_init_goods').value.trim();
        const bags = parseInt(document.getElementById('sf_init_bags').value) || 0;
        if (!goods || bags <= 0) {
          showModal('⚠️ Error', 'Enter goods name and bags.');
          return;
        }
        const godown = await DB.get('godown', []);
        const existing = godown.find(g => g.goodsName === goods);
        if (existing) {
          existing.bagsInStock += bags;
        } else {
          godown.push({ goodsName: goods, bagsInStock: bags, bagSize: 50, rate: 0 });
        }
        await DB.set('godown', godown);
        showModal('✅ Entry', `Initial stock for ${goods} set.`);
        clearStockForm();
        await refreshAll();
      }
    };

        await DB.set('milkOverrides', overrides);

    window.exportData = async function() {
      const data = {};
      const keys = ['animals', 'taji', 'kori', 'bakdi', 'slaughter', 'dead',
        'feedPurchases', 'feedConsumption', 'godown', 'danawalaPayments',
        'customers', 'milkProduction', 'milkOverrides', 'customerPayments',
        'labour', 'labourPayments', 'vendorPayments', 'medicineBills', 'bhaiswalBills',
        'config', 'dashboardPrefs'
      ];
      for (const k of keys) {
        data[k] = await DB.get(k, null);
      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dairy_data_export.json';
      a.click();
      URL.revokeObjectURL(url);
      showModal('✅ Export', 'Data exported successfully!');
    };

    window.importData = async function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const data = JSON.parse(e.target.result);
          await DB.importAll(data);
          await refreshAll();
          showModal('✅ Import', 'Data imported successfully!');
        } catch (err) {
          showModal('❌ Error', 'Invalid JSON file.');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    };

    window.saveRates = async function() {

      const bakdi = parseFloat(document.getElementById('rate_bakdi')?.value);
      if (isNaN(noora) || isNaN(tosif) || isNaN(taji) || isNaN(bakdi)) {

      config.nooraRate = noora;

      config.tajiFreight = taji;

    // ================================================================
    // PWA INSTALL
    // ================================================================
    window.installApp = async function() {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        const result = await window.deferredPrompt.userChoice;
        if (result.outcome === 'accepted') {
          console.log('App installed successfully');
        }
        window.deferredPrompt = null;
        document.getElementById('installBtn').style.display = 'none';
      } else {
        showModal('📱 Install', 'To install this app, use your browser\'s "Add to Home Screen" option.');
      }
    };

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      document.getElementById('installBtn').style.display = 'block';
    });

    window.addEventListener('appinstalled', () => {
      document.getElementById('installBtn').style.display = 'none';
      console.log('App was installed');
    });

    // ================================================================
    // SERVICE WORKER (lightweight)
    // ================================================================
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'dairyos-v1';
        const urlsToCache = ['/', '/index.html', 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css'];
        self.addEventListener('install', event => {
          event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache)).then(() => self.skipWaiting()));
        });
        self.addEventListener('activate', event => {
          event.waitUntil(caches.keys().then(cacheNames => {
            return Promise.all(cacheNames.filter(name => name !== CACHE_NAME).map(name => caches.delete(name)));
          }).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', event => {
          event.respondWith(caches.match(event.request).then(response => response || fetch(event.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).then(() => console.log('Service Worker registered')).catch(err =>
        console.warn('Service Worker registration failed:', err));
    }

    // ================================================================

    // ================================================================
    let loaderHidden = false;

    function hideLoader() {
      if (!loaderHidden) {
        const loader = document.getElementById('appLoader');
        if (loader) {
          loader.classList.add('hidden');
          loader.style.display = 'none';
        }
        loaderHidden = true;
        console.log('Loader hidden.');
      }
    }

    async function refreshAll() {
      try {
        await refreshDashboard();
        await refreshHerd();
        await refreshStock();
        await refreshMilk();
        await refreshLabour();
        await refreshAccounts();
        await refreshReports();
        await refreshLedgers();
        await refreshProjections();
        hideLoader();
      } catch (e) {
        console.error('Refresh error:', e);
        hideLoader();
        const panel = document.getElementById('panel-dashboard');
        if (panel) {
          panel.innerHTML = `<div class="alert-banner"><i class="fas fa-exclamation-triangle"></i><span class="msg">Error loading data. Please refresh.</span></div>`;
        }
      }
    }
