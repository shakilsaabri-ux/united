<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2712F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wallet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23C2712F'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle'%3E%F0%9F%92%BC%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23C2712F'/%3E%3Ctext x='50' y='66' font-size='54' text-anchor='middle'%3E%F0%9F%92%BC%3C/text%3E%3C/svg%3E">
<title>Wallet</title>
<style>
  :root{
    --paper:#FBF3E1;
    --surface:#F1E5C6;
    --card:#FCF6E8;
    --ink:#2B2116;
    --ink-soft:#8C7C5E;
    --line:#E6D8B0;
    --accent:#C2712F;
    --income:#1F7A4C;
    --income-bg:#E2F0E6;
    --expense:#C23B32;
    --expense-bg:#F6E3E0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:linear-gradient(180deg, #FBF3E1 0%, #EEE0BC 100%);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric:tabular-nums;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:transparent;
    position:relative;
  }

  header{
    padding:18px 20px 14px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:5;
  }
  .header-left{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .header-icon{
    width:34px; height:34px;
    border-radius:9px;
    background:var(--card);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:17px;
    flex-shrink:0;
  }
  header h1{
    font-family:Georgia, "Times New Roman", serif;
    font-size:22px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
    color:var(--ink);
  }
  header .tab-label{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  #addBtn{
    width:40px;height:40px;
    border-radius:11px;
    border:none;
    background:var(--accent);
    color:#FFFFFF;
    font-size:22px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(194,113,47,0.35);
  }
  #addBtn:active{opacity:0.85;}
  #addBtn.hidden{visibility:hidden;}

  main{
    flex:1;
    overflow-y:auto;
    padding-bottom:90px;
  }

  .balance-strip{
    margin:16px 20px 4px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
  }
  .balance-strip .net-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .balance-strip .net-value{
    font-family:Georgia, serif;
    font-size:30px;
    font-weight:600;
  }
  .balance-split{
    display:flex;
    gap:18px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .balance-split div{font-size:13px; color:var(--ink-soft);}
  .balance-split strong{
    display:block;
    font-size:16px;
    color:var(--ink);
    font-weight:600;
    margin-top:2px;
  }

  .section-label{
    margin:22px 20px 8px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.07em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:16px 20px 4px;
  }
  .stat-card{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--stat-accent, var(--accent));
    border-radius:14px;
    padding:16px 16px 14px;
    color:var(--ink);
  }
  .stat-card.wide{grid-column:1 / -1;}
  .stat-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom:12px;
  }
  .stat-label{
    font-size:15px;
    font-weight:700;
    line-height:1.3;
    color:var(--ink);
  }
  .stat-icon{
    font-size:20px;
    line-height:1;
  }
  .stat-value-row{
    display:flex;
    align-items:baseline;
    gap:5px;
  }
  .stat-currency{
    font-size:15px;
    color:var(--ink-soft);
  }
  .stat-value{
    font-size:24px;
    font-weight:800;
    color:var(--stat-accent, var(--accent));
  }
  .stat-suffix{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
  }

  .chip-row{
    display:flex;
    gap:4px;
    margin:16px 20px 4px;
    background:var(--surface);
    border-radius:12px;
    padding:4px;
  }
  .chip{
    flex:1;
    padding:9px 4px;
    border-radius:9px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:12.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .chip.active{
    background:var(--card);
    color:var(--accent);
    box-shadow:0 1px 3px rgba(43,33,22,0.12);
  }

  .row-list{
    margin:0 20px;
  }
  .row{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:14px 0;
    border-bottom:1px solid var(--line);
    gap:12px;
  }
  .row-list .row:last-child{border-bottom:none;}
  .row-main{flex:1; min-width:0;}
  .row-title{
    font-size:15.5px;
    font-weight:600;
    color:var(--ink);
    overflow-wrap:break-word;
  }
  .row-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .row-right{
    text-align:right;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
  }
  .amount{
    font-size:16px;
    font-weight:600;
    white-space:nowrap;
  }
  .amount.income{color:var(--income);}
  .amount.expense{color:var(--expense);}
  .tag{
    display:inline-block;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    color:var(--ink-soft);
    background:var(--surface);
    white-space:nowrap;
  }
  .del-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:12px;
    cursor:pointer;
    padding:2px 0;
    text-decoration:underline;
  }

  .empty-state{
    margin:40px 30px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.5;
  }

  .backup-block{
    margin:28px 20px 10px;
    padding-top:18px;
    border-top:1px solid var(--line);
  }
  .backup-actions{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .backup-actions .btn{
    flex:1;
    padding:11px 0;
    font-size:14px;
  }
  .backup-hint{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:8px;
    line-height:1.5;
  }

  .net-bar{
    margin:10px 20px 4px;
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--stat-accent, var(--accent));
    border-radius:14px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .net-bar .net-bar-label{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
  }
  .net-bar .net-bar-sub{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .net-bar .net-bar-value{
    font-size:22px;
    font-weight:800;
  }

  nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--card);
    border-top:1px solid var(--line);
    display:flex;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index:5;
  }
  nav button{
    flex:1;
    background:none;
    border:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:6px 0;
    cursor:pointer;
    color:var(--ink-soft);
    font-size:12px;
    font-family:inherit;
  }
  nav button.active{color:var(--accent); font-weight:600;}
  nav .icon{font-size:19px; line-height:1;}

  .overlay{
    position:fixed; inset:0;
    background:rgba(43,33,22,0.45);
    display:flex; align-items:flex-end;
    justify-content:center;
    z-index:20;
  }
  .overlay.hidden{display:none;}
  .sheet{
    width:100%;
    max-width:480px;
    background:var(--paper);
    border-radius:16px 16px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h2{
    font-family:Georgia, serif;
    font-size:20px;
    margin:0 0 16px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=date],
  .field select,
  .field textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    font-size:15px;
    color:var(--ink);
    font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .seg{
    display:flex;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
  }
  .seg button{
    flex:1;
    padding:10px 0;
    border:none;
    background:var(--card);
    font-size:14px;
    font-family:inherit;
    color:var(--ink-soft);
    cursor:pointer;
    border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none;}
  .seg button.selected.income{background:var(--income-bg); color:var(--income); font-weight:600;}
  .seg button.selected.expense{background:var(--expense-bg); color:var(--expense); font-weight:600;}
  .seg button.selected{background:var(--surface); color:var(--accent); font-weight:600;}

  .file-drop{
    display:block;
    border:1px dashed var(--line);
    border-radius:8px;
    padding:14px;
    text-align:center;
    font-size:13.5px;
    color:var(--ink-soft);
    background:var(--card);
    cursor:pointer;
  }
  .file-drop input{display:none;}
  .file-name{
    margin-top:8px;
    font-size:13px;
    color:var(--ink);
    word-break:break-all;
  }

  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .btn{
    flex:1;
    padding:12px 0;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
    background:var(--card);
    color:var(--ink);
  }
  .btn.primary{background:var(--accent); color:#FFFFFF; border-color:var(--accent);}
  .btn.secondary{background:var(--card); color:var(--ink);}

  .status-line{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    padding:10px;
  }

  .lock-icon{
    width:64px; height:64px;
    border-radius:16px;
    background:var(--card);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    margin-bottom:16px;
  }
  .lock-title{
    font-family:Georgia, serif;
    font-size:20px;
    font-weight:600;
    color:var(--ink);
  }
  .lock-sub{
    font-size:13.5px;
    color:var(--ink-soft);
    margin-top:4px;
    margin-bottom:20px;
  }
  .lock-boxes{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .lock-box{
    width:38px;
    height:48px;
    font-size:22px;
    text-align:center;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--card);
    color:var(--ink);
  }
  .lock-box:focus{
    outline:none;
    border-color:var(--accent);
  }
  .lock-forgot{
    margin-top:14px;
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:underline;
  }
  .lock-error{
    font-size:12.5px;
    color:var(--expense);
    min-height:18px;
    margin-bottom:10px;
  }

  .install-block{
    margin:16px 20px 4px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .install-block .install-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .install-block .install-sub{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.5;
  }
  .install-block .btn{margin-top:10px;}

  .budget-row{
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .row-list .budget-row:last-child{border-bottom:none;}
  .budget-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
  }
  .budget-name{font-size:14.5px; font-weight:600; color:var(--ink);}
  .budget-figures{font-size:12.5px; color:var(--ink-soft);}
  .budget-track{
    height:7px;
    border-radius:4px;
    background:var(--surface);
    overflow:hidden;
  }
  .budget-fill{height:100%; border-radius:4px;}
  .budget-edit{
    border:none; background:none; color:var(--accent);
    font-size:12px; cursor:pointer; padding:6px 0 0; text-decoration:underline;
  }

  .expiry-tag{
    display:inline-block;
    font-size:11px;
    padding:2px 8px;
    border-radius:20px;
    font-weight:600;
    white-space:nowrap;
  }
  .expiry-tag.soon{background:#FBE9CF; color:#8A5A17;}
  .expiry-tag.expired{background:var(--expense-bg); color:var(--expense);}

  .file-btn-row{display:flex; gap:8px;}
  .file-btn-row .file-drop{flex:1;}

  .splash-screen{
    position:fixed; inset:0;
    z-index:100;
    background:linear-gradient(160deg, #7E97B2 0%, #4E6885 55%, #3A5169 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:32px;
    text-align:center;
  }
  .splash-screen.hidden{display:none;}
  .splash-date{
    color:#F3EFE3;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:0.04em;
    opacity:0.9;
  }
  .splash-logo{
    max-width:88%;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .splash-credit{
    color:#E7E1D1;
    font-size:12px;
    letter-spacing:0.06em;
    opacity:0.85;
  }
  .splash-pin{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    margin-top:6px;
  }
  .splash-pin.hidden{display:none;}
  .splash-pin .lock-icon{
    width:44px; height:44px;
    border-radius:12px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
  }
  .splash-pin .lock-title{
    font-family:Georgia, serif;
    font-size:17px;
    font-weight:600;
    color:#FFFFFF;
  }
  .splash-pin .lock-sub{
    font-size:12.5px;
    color:#DCE3EE;
    margin-top:-4px;
  }
  .splash-pin .lock-box{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.4);
    color:#FFFFFF;
  }
  .splash-pin .lock-box:focus{
    border-color:#FFFFFF;
  }
  .splash-pin .lock-error{
    color:#FFD9CE;
  }
  .splash-pin .lock-forgot{
    color:#DCE3EE;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <div class="header-icon">&#128188;</div>
      <div>
        <h1>Wallet</h1>
        <div class="tab-label" id="tabLabel">Documents</div>
      </div>
    </div>
    <button id="addBtn" aria-label="Add">+</button>
  </header>

  <main id="main"></main>

  <nav>
    <button data-tab="documents" class="active">
      <span class="icon">&#128196;</span>Documents
    </button>
    <button data-tab="money">
      <span class="icon">&#8377;</span>Income &amp; Expenses
    </button>
    <button data-tab="summary">
      <span class="icon">&#128202;</span>Summary
    </button>
  </nav>
</div>

<div class="overlay hidden" id="overlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<script>
(function(){
  var DB_NAME = 'walletDB';
  var DB_VERSION = 2;
  var MAX_FILE_BYTES = 500 * 1024 * 1024; // 500MB per attached file

  var state = { documents: [], finance: [], meta: { id:'app', pin:'332300', budgets:{} } };
  var activeTab = 'documents';
  var docFilter = 'all';
  var docSearch = '';
  var moneyPeriod = 'all'; // 'all' | 'year' | 'month'
  var CATEGORIES = ['Family', 'Personal', 'Assets'];
  var loaded = false;
  var deferredInstallPrompt = null;

  var mainEl = document.getElementById('main');
  var tabLabelEl = document.getElementById('tabLabel');
  var addBtn = document.getElementById('addBtn');
  var overlay = document.getElementById('overlay');
  var sheetContent = document.getElementById('sheetContent');
  var splashPin = document.getElementById('splashPin');
  var splashScreen = document.getElementById('splashScreen');

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if(activeTab === 'summary') render();
  });

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  // ---------- IndexedDB layer (stores data on this device, works fully offline) ----------
  var dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains('documents')) db.createObjectStore('documents', {keyPath:'id'});
        if(!db.objectStoreNames.contains('finance')) db.createObjectStore('finance', {keyPath:'id'});
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', {keyPath:'id'});
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    return dbPromise;
  }
  function dbGetAll(storeName){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, 'readonly');
        var req = tx.objectStore(storeName).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function dbPut(storeName, record){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(record);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function dbDelete(storeName, id){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function saveMeta(){
    return dbPut('meta', state.meta).catch(function(){ showStatus('Could not save settings.'); });
  }

  function addMonths(dateStr, n){
    var d = new Date(dateStr + 'T00:00:00');
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return d.toISOString().slice(0,10);
  }
  function monthKey(dateStr){ return (dateStr||'').slice(0,7); }

  async function generateRecurringOccurrences(){
    var templates = state.finance.filter(function(f){ return f.recurring === true; });
    if(templates.length === 0) return;
    var todayKey = new Date().toISOString().slice(0,7);
    var created = false;
    for(var i=0;i<templates.length;i++){
      var t = templates[i];
      var existingKeys = {};
      state.finance.forEach(function(f){
        if(f.id === t.id || f.recurringSourceId === t.id) existingKeys[monthKey(f.date)] = true;
      });
      var cursor = t.date;
      var guard = 0;
      while(monthKey(cursor) < todayKey && guard < 36){
        cursor = addMonths(cursor, 1);
        guard++;
        var k = monthKey(cursor);
        if(k > todayKey) break;
        if(!existingKeys[k]){
          var copy = {
            id: uid(),
            type: t.type,
            category: t.category,
            amount: t.amount,
            date: cursor,
            note: t.note,
            recurring: false,
            recurringSourceId: t.id
          };
          state.finance.push(copy);
          existingKeys[k] = true;
          await dbPut('finance', copy);
          created = true;
        }
      }
    }
    if(created) showStatus('Added this month\'s recurring entries.');
  }

  function fmtMoney(n){
    var num = Number(n) || 0;
    return '₹' + num.toLocaleString('en-IN', {maximumFractionDigits:2});
  }
  function fmtDate(d){
    if(!d) return '';
    var dt = new Date(d + 'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

    var dateEl = document.getElementById('splashDate');
    if(dateEl){
      dateEl.textContent = new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    }
  }

  async function loadState(){
    showSplashScreen();
    var splashStart = Date.now();
    try{
      var docs = await dbGetAll('documents');
      var fin = await dbGetAll('finance');
      var metaRows = await dbGetAll('meta');
      state.documents = docs;
      state.finance = fin;
      state.meta = (metaRows && metaRows[0]) || { id:'app', pin:'332300', budgets:{} };
      if(!state.meta.budgets) state.meta.budgets = {};
    }catch(e){
      showStatus('Could not open on-device storage.');
    }
    loaded = true;
    await generateRecurringOccurrences();

    var minSplash = 2200;
    var elapsed = Date.now() - splashStart;
    var wait = Math.max(0, minSplash - elapsed);
    setTimeout(function(){
      if(state.meta.pin){
        showLockScreen();
      }else{
        splashScreen.classList.add('hidden');
        render();
      }
    }, wait);
  }

  function inPeriod(dateStr){
    if(moneyPeriod === 'all') return true;

    var now = new Date();

    if(moneyPeriod === 'year') return d.getFullYear() === now.getFullYear();
    if(moneyPeriod === 'month') return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    return true;
  }

  function updateStorageUsage(){
    var el = document.getElementById('storageUsage');
    if(!el) return;
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        var usedMB = ((est.usage||0)/(1024*1024)).toFixed(1);
        var quotaMB = ((est.quota||0)/(1024*1024)).toFixed(0);
        var pct = est.quota ? Math.round((est.usage/est.quota)*100) : 0;
        el.textContent = usedMB + ' MB used of about ' + quotaMB + ' MB available on this device (' + pct + '%).';
      }).catch(function(){
        el.textContent = 'Storage estimate not available on this browser.';
      });
    }else{
      el.textContent = 'Storage estimate not available on this browser.';
    }
  }

  // ---------- backup / restore ----------
  function blobToDataURL(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = function(){ reject(reader.error); };
      reader.readAsDataURL(blob);
    });
  }
  function dataURLToBlob(dataURL){
    return fetch(dataURL).then(function(res){ return res.blob(); });
  }

  async function exportBackup(){
    showStatus('Preparing backup…');
    var docsOut = [];
    for(var i=0;i<state.documents.length;i++){
      var d = state.documents[i];
      var copy = { id:d.id, name:d.name, category:d.category, dateAdded:d.dateAdded, note:d.note, fileName:d.fileName, fileType:d.fileType, fileData:null };
      if(d.fileData){
        try{ copy.fileData = await blobToDataURL(d.fileData); }
        catch(e){ /* skip file if it can't be read */ }
      }
      docsOut.push(copy);
    }
    var payload = {
      app: 'wallet',
      exportedAt: new Date().toISOString(),
      documents: docsOut,
      finance: state.finance
    };
    var blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = 'wallet-backup-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  async function importBackup(e){
    var file = e.target.files[0];
    if(!file) return;
    try{
      var text = await file.text();
      var data = JSON.parse(text);
      var docs = Array.isArray(data.documents) ? data.documents : [];
      var fin = Array.isArray(data.finance) ? data.finance : [];
      for(var i=0;i<docs.length;i++){
        var d = docs[i];
        if(d.fileData && typeof d.fileData === 'string'){
          try{ d.fileData = await dataURLToBlob(d.fileData); }
          catch(e2){ d.fileData = null; }
        }
        await dbPut('documents', d);
      }
      for(var j=0;j<fin.length;j++){ await dbPut('finance', fin[j]); }
      await loadState();
      activeTab = 'summary';
      render();
      showStatus('Imported ' + docs.length + ' document(s) and ' + fin.length + ' entr(y/ies).');
    }catch(err){
      showStatus('That file could not be read as a backup.');
    }
    e.target.value = '';
  }

  function showLockScreen(){
    splashPin.classList.remove('hidden');
    var boxes = Array.prototype.slice.call(document.querySelectorAll('.lock-box'));
    var err = document.getElementById('lockError');
    boxes.forEach(function(b){ b.value = ''; });
    err.textContent = '';
    setTimeout(function(){ boxes[0].focus(); }, 50);

    function currentValue(){ return boxes.map(function(b){ return b.value; }).join(''); }
    function clearBoxes(){ boxes.forEach(function(b){ b.value = ''; }); boxes[0].focus(); }

    function tryUnlock(){
      var val = currentValue();
      if(val.length < 6) return;
      if(val === state.meta.pin){
        splashScreen.classList.add('hidden');
        render();
      }else{
        err.textContent = 'Incorrect PIN, try again.';
        clearBoxes();
      }
    }

    boxes.forEach(function(box, i){
      box.oninput = function(){
        box.value = box.value.replace(/[^0-9]/g, '').slice(0,1);
        if(box.value && i < boxes.length-1){ boxes[i+1].focus(); }
        if(currentValue().length === 6) tryUnlock();
      };
      box.onkeydown = function(e){
        if(e.key === 'Backspace' && !box.value && i > 0){ boxes[i-1].focus(); }
      };
    });

    document.getElementById('lockUnlockBtn').onclick = tryUnlock;

    document.getElementById('forgotPinLink').onclick = async function(e){
      e.preventDefault();
      if(confirm('Forgot your PIN?\n\nThis will remove the current PIN so you can get back into Wallet. You can set a new one afterwards from Summary → Security.')){
        state.meta.pin = null;
        await saveMeta();
        splashScreen.classList.add('hidden');
        render();
        showStatus('PIN removed — set a new one anytime from Summary.');
      }
    };
  }

  function openSetPinSheet(){
    openSheet(
      '<h2>Set a PIN</h2>' +
      '<div class="field"><label>New 6-digit PIN</label><input type="password" inputmode="numeric" maxlength="6" id="pin1"></div>' +
      '<div class="field"><label>Confirm PIN</label><input type="password" inputmode="numeric" maxlength="6" id="pin2"></div>' +
      '<div class="backup-hint" style="margin-bottom:6px;">This is a simple on-device screen lock, not encryption — it just keeps casual eyes out.</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn secondary" id="cancelPin">Cancel</button>' +
        '<button class="btn primary" id="savePin">Save PIN</button>' +
      '</div>'
    );
    document.getElementById('cancelPin').onclick = closeSheet;
    document.getElementById('savePin').onclick = async function(){
      var p1 = document.getElementById('pin1').value;
      var p2 = document.getElementById('pin2').value;
      if(!/^\d{6}$/.test(p1)){ showStatus('PIN must be 6 digits.'); return; }
      if(p1 !== p2){ showStatus('PINs did not match.'); return; }
      state.meta.pin = p1;
      await saveMeta();
      closeSheet();
      render();
    };
  }

  async function removePin(){
    if(!confirm('Remove your PIN lock?')) return;
    state.meta.pin = null;
    await saveMeta();
    render();
  }

  async function shareDocument(id){
    var doc = state.documents.find(function(d){ return d.id === id; });
    if(!doc || !doc.fileData){ showStatus('Nothing to share.'); return; }

    var fileToShare;
    try{
      fileToShare = new File([doc.fileData], doc.fileName || (doc.name + (doc.fileType==='PDF' ? '.pdf' : '')), {type: doc.fileData.type || 'application/octet-stream'});
    }catch(e){
      fileToShare = null;
    }

    if(fileToShare && navigator.canShare && navigator.canShare({files:[fileToShare]})){
      try{
        await navigator.share({
          files: [fileToShare],
          title: doc.name,
          text: doc.name
        });
      }catch(err){
        // user cancelled the share sheet — nothing to do
      }
      return;
    }

    if(navigator.share){
      try{
        var url = URL.createObjectURL(doc.fileData);
        await navigator.share({ title: doc.name, text: doc.name, url: url });
        setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
        return;
      }catch(err){ /* fall through to manual fallback */ }
    }

    showStatus('Sharing files isn\'t supported here — opening it instead so you can share manually.');
    var fallbackUrl = URL.createObjectURL(doc.fileData);
    window.open(fallbackUrl, '_blank');
    setTimeout(function(){ URL.revokeObjectURL(fallbackUrl); }, 60000);
  }

  // ---------- modals ----------
  function openSheet(html){
    sheetContent.innerHTML = html;
    overlay.classList.remove('hidden');
  }
  function closeSheet(){
    overlay.classList.add('hidden');
    sheetContent.innerHTML = '';
  }

  function openAddDocSheet(){
    var today = new Date().toISOString().slice(0,10);
    openSheet(
      '<h2>Add a document</h2>' +
      '<div class="field"><label>Name</label><input type="text" id="docName" placeholder="e.g. Rental agreement"></div>' +
      '<div class="field"><label>Category</label>' +
        '<div class="seg" id="catSeg">' +
          CATEGORIES.map(function(c, i){ return '<button type="button" data-cat="' + c + '" class="' + (i===1?'selected':'') + '">' + c + '</button>'; }).join('') +
        '</div>' +
      '</div>' +
      '<div class="field"><label>Date added</label><input type="date" id="docDate" value="' + today + '"></div>' +
      '<div class="field"><label>Expiry date (optional — for IDs, insurance, etc.)</label><input type="date" id="docExpiry"></div>' +
      '<div class="field"><label>Note (optional)</label><textarea id="docNote" placeholder="What is this document for?"></textarea></div>' +
      '<div class="field"><label>Attach file (PDF, photo, or video, up to 500MB)</label>' +
        '<div class="file-btn-row">' +
          '<label class="file-drop">&#128247; Take photo/video<input type="file" id="docCamera" accept="image/*,video/*" capture="environment"></label>' +
          '<label class="file-drop">&#128193; Choose file<input type="file" id="docFile" accept=".pdf,image/*,video/*"></label>' +
        '</div>' +
        '<div class="file-name" id="docFileName"></div>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn secondary" id="cancelDoc">Cancel</button>' +
        '<button class="btn primary" id="saveDoc">Save document</button>' +
      '</div>'
    );
    var fileInput = document.getElementById('docFile');
    var cameraInput = document.getElementById('docCamera');
    var fileNameEl = document.getElementById('docFileName');
    var pendingFile = null;
    var selectedCat = CATEGORIES[1];

    document.querySelectorAll('#catSeg button').forEach(function(btn){
      btn.addEventListener('click', function(){
        selectedCat = btn.dataset.cat;
        document.querySelectorAll('#catSeg button').forEach(function(b){
          b.className = (b.dataset.cat === selectedCat) ? 'selected' : '';
        });
      });
    });

    function handleChosenFile(f){
      if(!f) return;
      if(f.size > MAX_FILE_BYTES){
        fileNameEl.textContent = 'That file is too large (max 500MB).';
        pendingFile = null;
        return;
      }
      pendingFile = f;
      var sizeLabel = f.size > 1024*1024 ? (f.size/(1024*1024)).toFixed(1) + ' MB' : (f.size/1024).toFixed(0) + ' KB';
      fileNameEl.textContent = 'Attached: ' + f.name + ' (' + sizeLabel + ')';
    }
    fileInput.addEventListener('change', function(){ handleChosenFile(fileInput.files[0]); });
    cameraInput.addEventListener('change', function(){ handleChosenFile(cameraInput.files[0]); });

    document.getElementById('cancelDoc').onclick = closeSheet;
    document.getElementById('saveDoc').onclick = async function(){
      var name = document.getElementById('docName').value.trim();
      if(!name){ document.getElementById('docName').focus(); return; }
      var doc = {
        id: uid(),
        name: name,
        category: selectedCat,
        dateAdded: document.getElementById('docDate').value,
        expiryDate: document.getElementById('docExpiry').value || null,
        note: document.getElementById('docNote').value.trim(),
        fileData: pendingFile || null,
        fileName: pendingFile ? pendingFile.name : null,
        fileType: pendingFile ? ((pendingFile.type||'').indexOf('pdf')>-1 ? 'PDF' : ((pendingFile.type||'').indexOf('video')>-1 ? 'video' : 'image')) : null
      };
      try{
        await dbPut('documents', doc);
        state.documents.push(doc);
        closeSheet();
        render();
      }catch(err){
        showStatus('Could not save — file may be too large for this device.');
      }
    };
  }

  function openAddMoneySheet(){
    var today = new Date().toISOString().slice(0,10);
    var type = 'expense';
    openSheet(
      '<h2>Add income or expense</h2>' +
      '<div class="field"><label>Type</label>' +
        '<div class="seg" id="typeSeg">' +
          '<button type="button" data-type="income">Income</button>' +
          '<button type="button" data-type="expense" class="selected expense">Expense</button>' +
        '</div>' +
      '</div>' +
      '<div class="field"><label>Category</label><input type="text" id="finCategory" placeholder="e.g. Rent, Salary, Groceries"></div>' +
      '<div class="field"><label>Amount (₹)</label><input type="number" id="finAmount" placeholder="0" inputmode="decimal"></div>' +
      '<div class="field"><label>Date</label><input type="date" id="finDate" value="' + today + '"></div>' +
      '<div class="field"><label>Note (optional)</label><textarea id="finNote" placeholder="Any extra detail"></textarea></div>' +
      '<div class="field" style="display:flex;align-items:center;gap:8px;">' +
        '<input type="checkbox" id="finRecurring" style="width:18px;height:18px;">' +
        '<label style="margin:0;" for="finRecurring">Repeat this every month</label>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn secondary" id="cancelFin">Cancel</button>' +
        '<button class="btn primary" id="saveFin">Save entry</button>' +
      '</div>'
    );
    document.querySelectorAll('#typeSeg button').forEach(function(btn){
      btn.addEventListener('click', function(){
        type = btn.dataset.type;
        document.querySelectorAll('#typeSeg button').forEach(function(b){
          b.className = '';
          if(b.dataset.type === type) b.className = 'selected ' + type;
        });
      });
    });
    document.getElementById('cancelFin').onclick = closeSheet;
    document.getElementById('saveFin').onclick = async function(){
      var amount = parseFloat(document.getElementById('finAmount').value);
      if(!amount || amount <= 0){ document.getElementById('finAmount').focus(); return; }
      var entry = {
        id: uid(),
        type: type,
        category: document.getElementById('finCategory').value.trim(),
        amount: amount,
        date: document.getElementById('finDate').value,
        note: document.getElementById('finNote').value.trim(),
        recurring: document.getElementById('finRecurring').checked
      };
      try{
        await dbPut('finance', entry);
        state.finance.push(entry);
        closeSheet();
        render();
      }catch(err){
        showStatus('Could not save this entry.');
      }
    };
  }

  // ---------- events ----------
  addBtn.addEventListener('click', function(){
    if(activeTab === 'documents') openAddDocSheet();
    else if(activeTab === 'money') openAddMoneySheet();
  });

  document.querySelectorAll('nav button').forEach(function(b){
    b.addEventListener('click', function(){
      activeTab = b.dataset.tab;
      render();
    });
  });

  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeSheet();
  });

  mainEl.addEventListener('click', async function(e){
    var target = e.target;
    if(target.dataset.action === 'del-doc'){
      if(!confirm('Delete this document?')) return;
      await dbDelete('documents', target.dataset.id);
      state.documents = state.documents.filter(function(d){ return d.id !== target.dataset.id; });
      render();
    } else if(target.dataset.action === 'del-fin'){
      if(!confirm('Delete this entry?')) return;
      await dbDelete('finance', target.dataset.id);
      state.finance = state.finance.filter(function(f){ return f.id !== target.dataset.id; });
      render();
    } else if(target.dataset.action === 'open-doc'){
      var doc = state.documents.find(function(d){ return d.id === target.dataset.id; });
      if(doc && doc.fileData){
        var url = URL.createObjectURL(doc.fileData);
        var w = window.open(url, '_blank');
        if(!w){ showStatus('Allow pop-ups to open this file.'); }
        setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
      }
    } else if(target.dataset.action === 'share-doc'){
      await shareDocument(target.dataset.id);
    }
  });

  loadState();
})();
</script>
</body>
</html>
